<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Kernel Information Leak Defenses Simulator</title>
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-card: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
    --accent-blue: #38bdf8;
    --accent-green: #34d399;
    --accent-red: #f87171;
    --accent-amber: #fbbf24;
    --accent-purple: #c084fc;
    --token-fill: #38bdf8;
    --led-glow: rgba(52, 211, 153, 0.6);
  }

  body.light-mode {
    --bg-primary: #f8fafc;
    --bg-card: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --border-color: #cbd5e1;
    --accent-blue: #0284c7;
    --accent-green: #059669;
    --accent-red: #dc2626;
    --accent-amber: #d97706;
    --accent-purple: #7c3aed;
    --token-fill: #0284c7;
    --led-glow: rgba(5, 150, 105, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100vh;
  }

  .sim-container {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
  }

  .sim-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sim-title {
    font-size: 1.15rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .led-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: var(--accent-green);
    box-shadow: 0 0 10px var(--led-glow);
    transition: background-color 0.3s, box-shadow 0.3s;
  }
  .led-indicator.permissive {
    background-color: var(--accent-amber);
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
  }
  .led-indicator.violation {
    background-color: var(--accent-red);
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.8);
  }

  .sim-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
  }

  .btn {
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn:hover {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .btn.active {
    background: var(--accent-blue);
    color: #ffffff;
    border-color: var(--accent-blue);
  }

  .status-bar {
    font-family: monospace;
    font-size: 0.85rem;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 10px 14px;
    margin-top: 12px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .svg-box {
    fill: var(--bg-primary);
    stroke: var(--border-color);
    stroke-width: 1.5;
    rx: 8;
  }
  .svg-text-title {
    fill: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
  }
  .svg-text-desc {
    fill: var(--text-secondary);
    font-size: 11px;
    font-family: monospace;
  }

  #token {
    fill: var(--token-fill);
    filter: drop-shadow(0 0 6px var(--accent-blue));
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>
</head>
<body>

<div class="sim-container">
  <div class="sim-header">
    <div class="sim-title">
      <div id="led" class="led-indicator"></div>
      Kernel Information Leak Defenses & Dmesg Restrict Simulator
    </div>
    <div style="font-family:monospace; font-size:0.8rem; color:var(--text-secondary);">
      CONFIG_SECURITY_DMESG_RESTRICT=y & kptr_restrict=2
    </div>
  </div>

  <div class="sim-toolbar">
    <button id="btn-scen-kallsyms" class="btn active" onclick="selectScenario('kallsyms')">Query /proc/kallsyms</button>
    <button id="btn-scen-dmesg" class="btn" onclick="selectScenario('dmesg')">Read dmesg Buffer</button>
    <button id="btn-scen-printk" class="btn" onclick="selectScenario('printk')">Printk Pointer (%pK)</button>
    <div style="flex-grow:1;"></div>
    <button id="btn-mode" class="btn" onclick="toggleMode()">Mode: Hardened (kptr=2, dmesg=1)</button>
    <button id="btn-step" class="btn" onclick="stepSimulation()">Next Step ⏭</button>
    <button id="btn-play" class="btn" onclick="togglePlay()">Auto Play ▶</button>
    <button id="btn-reset" class="btn" onclick="resetSimulation()">Reset ↺</button>
    <button class="btn" onclick="toggleTheme()">Theme 🌓</button>
  </div>

  <svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--text-secondary)"/>
      </marker>
    </defs>

    <!-- Column 1: Userspace Query -->
    <g id="col-user">
      <rect x="20" y="20" width="220" height="340" fill="none" stroke="var(--border-color)" stroke-dasharray="4" rx="8"/>
      <text class="svg-text-title" x="35" y="45">Unprivileged User (UID 1000)</text>

      <!-- Kallsyms Query -->
      <g id="box-scen-kallsyms" transform="translate(30, 60)">
        <rect class="svg-box" width="200" height="75"/>
        <text class="svg-text-title" x="12" y="24">Read /proc/kallsyms</text>
        <text class="svg-text-desc" x="12" y="44">cat /proc/kallsyms</text>
        <text class="svg-text-desc" x="12" y="62" fill="var(--accent-purple)">Seeking KASLR base offset</text>
      </g>

      <!-- Dmesg Query -->
      <g id="box-scen-dmesg" transform="translate(30, 155)">
        <rect class="svg-box" width="200" height="85"/>
        <text class="svg-text-title" x="12" y="24">Read dmesg Log Buffer</text>
        <text class="svg-text-desc" x="12" y="44">klogctl(SYSLOG_ACTION_READ)</text>
        <text class="svg-text-desc" x="12" y="60">open("/dev/kmsg")</text>
        <text class="svg-text-desc" x="12" y="76" fill="var(--accent-amber)">Seeking crash/driver logs</text>
      </g>

      <!-- Printk Pointer Query -->
      <g id="box-scen-printk" transform="translate(30, 260)">
        <rect class="svg-box" width="200" height="85"/>
        <text class="svg-text-title" x="12" y="24">Read Sysfs / Procfs Node</text>
        <text class="svg-text-desc" x="12" y="44">cat /proc/vuln_info_leaks</text>
        <text class="svg-text-desc" x="12" y="60">Inspects %pK & %p formats</text>
        <text class="svg-text-desc" x="12" y="76" fill="var(--accent-blue)">Seeking kernel heap/stack</text>
      </g>
    </g>

    <!-- Column 2: Kernel Information Gatekeeper -->
    <g id="col-kernel" transform="translate(280, 20)">
      <rect class="svg-box" width="300" height="340"/>
      <text class="svg-text-title" x="20" y="32">Kernel Information Gatekeeper</text>
      <text id="svg-mode-text" class="svg-text-desc" x="20" y="52" fill="var(--accent-blue)">
        dmesg_restrict=1 & kptr_restrict=2
      </text>

      <!-- Gatekeeper Logic -->
      <g transform="translate(15, 70)">
        <rect width="270" height="110" fill="var(--bg-card)" stroke="var(--border-color)" rx="6"/>
        <text class="svg-text-title" x="15" y="28">Access Control & Sanitizer</text>
        <text class="svg-text-desc" x="15" y="50">1. kallsyms: kptr_restrict >= 1</text>
        <text class="svg-text-desc" x="15" y="70">2. dmesg: capable(CAP_SYSLOG)</text>
        <text class="svg-text-desc" x="15" y="90" fill="var(--accent-green)">3. SipHash pointer hashing (%p)</text>
      </g>

      <!-- Decision Matrix -->
      <g transform="translate(15, 200)">
        <rect width="270" height="120" fill="var(--bg-card)" stroke="var(--border-color)" rx="6"/>
        <text class="svg-text-title" x="15" y="26">Policy Decision Matrix</text>
        <text class="svg-text-desc" x="15" y="48">kptr_restrict=2: Redact all to zeros</text>
        <text class="svg-text-desc" x="15" y="70">dmesg_restrict=1: Reject unprivileged</text>
        <text class="svg-text-desc" x="15" y="92">%p: SipHash obscures memory layout</text>
        <text id="decision-text" class="svg-text-desc" x="15" y="112" fill="var(--accent-green)">Status: Complete address obfuscation</text>
      </g>
    </g>

    <!-- Column 3: Output & Outcome -->
    <g id="col-outcome" transform="translate(620, 20)">
      <rect x="0" y="0" width="220" height="340" fill="none" stroke="var(--border-color)" stroke-dasharray="4" rx="8"/>
      <text class="svg-text-title" x="20" y="32">Information Output</text>

      <!-- Hardened Output Box -->
      <g id="box-outcome-safe" transform="translate(10, 60)">
        <rect class="svg-box" width="200" height="110"/>
        <text id="safe-title" class="svg-text-title" x="15" y="28" fill="var(--accent-green)">REDACTED / GATED</text>
        <text id="safe-desc1" class="svg-text-desc" x="15" y="50">Symbols: 0000000000000000</text>
        <text id="safe-desc2" class="svg-text-desc" x="15" y="72">dmesg: -EPERM (Blocked)</text>
        <text class="svg-text-desc" x="15" y="94" fill="var(--accent-green)">KASLR secrecy preserved</text>
      </g>

      <!-- Leaked Output Box -->
      <g id="box-outcome-leak" transform="translate(10, 190)">
        <rect class="svg-box" width="200" height="130"/>
        <text id="leak-title" class="svg-text-title" x="15" y="28" fill="var(--accent-red)">POINTER EXPOSED</text>
        <text id="leak-desc1" class="svg-text-desc" x="15" y="50">Raw: 0xffff800081234567</text>
        <text id="leak-desc2" class="svg-text-desc" x="15" y="72">dmesg: Unrestricted read</text>
        <text class="svg-text-desc" x="15" y="92" fill="var(--accent-red)">KASLR offset compromised!</text>
        <text class="svg-text-desc" x="15" y="112" fill="var(--text-secondary)">Exploit ROP chain unlocked</text>
      </g>
    </g>

    <!-- Connecting Pathways -->
    <path d="M 230 100 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 230 200 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 230 300 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <path d="M 580 120 L 630 115" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 580 150 L 630 255" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- Animated Token -->
    <circle id="token" cx="130" cy="100" r="10"/>
  </svg>

  <div class="status-bar">
    <div id="status-text">Ready. Choose a scenario: Query /proc/kallsyms, Read dmesg Buffer, or Printk Pointer.</div>
    <div id="step-badge" style="font-weight:700; color:var(--accent-blue);">Step: 0/4</div>
  </div>
</div>

<script>
  let currentScenario = 'kallsyms'; // 'kallsyms', 'dmesg', 'printk'
  let isHardened = true;
  let currentStep = 0;
  let isPlaying = false;
  let playInterval = null;

  const positions = {
    kallsyms: [
      { cx: 130, cy: 100, text: "Step 1: Unprivileged user calls cat /proc/kallsyms to locate kernel functions." },
      { cx: 430, cy: 125, text: "Step 2: kallsyms_show_value() checks kernel.kptr_restrict level." },
      { cx: 430, cy: 260, text: "Step 3: Policy evaluation: kptr_restrict >= 1 and caller lacks CAP_SYSLOG." },
      { cx: 730, cy: 115, text: "" } // Handled dynamically
    ],
    dmesg: [
      { cx: 130, cy: 200, text: "Step 1: Process calls klogctl() or reads /dev/kmsg without CAP_SYSLOG." },
      { cx: 430, cy: 125, text: "Step 2: check_syslog_permissions() verifies kernel.dmesg_restrict." },
      { cx: 430, cy: 260, text: "Step 3: dmesg_restrict=1 enforces strict CAP_SYSLOG access control." },
      { cx: 730, cy: 115, text: "" } // Handled dynamically
    ],
    printk: [
      { cx: 130, cy: 300, text: "Step 1: Process reads driver procfs interface formatting pointers via %pK and %p." },
      { cx: 430, cy: 125, text: "Step 2: vsnprintf() pointer formatter evaluates pointer specifiers." },
      { cx: 430, cy: 260, text: "Step 3: %pK is checked against kptr_restrict; %p is passed through SipHash." },
      { cx: 730, cy: 115, text: "" } // Handled dynamically
    ]
  };

  function selectScenario(scenario) {
    currentScenario = scenario;
    document.getElementById('btn-scen-kallsyms').classList.toggle('active', scenario === 'kallsyms');
    document.getElementById('btn-scen-dmesg').classList.toggle('active', scenario === 'dmesg');
    document.getElementById('btn-scen-printk').classList.toggle('active', scenario === 'printk');
    resetSimulation();
  }

  function toggleMode() {
    isHardened = !isHardened;
    const btn = document.getElementById('btn-mode');
    const svgText = document.getElementById('svg-mode-text');
    const decText = document.getElementById('decision-text');

    if (isHardened) {
      btn.innerText = "Mode: Hardened (kptr=2, dmesg=1)";
      svgText.textContent = "dmesg_restrict=1 & kptr_restrict=2";
      decText.textContent = "Status: Complete address obfuscation";
    } else {
      btn.innerText = "Mode: Permissive (kptr=0, dmesg=0)";
      svgText.textContent = "dmesg_restrict=0 & kptr_restrict=0";
      decText.textContent = "Status: WARNING: Raw kernel addresses leaked";
    }
    updateDisplay();
  }

  function toggleTheme() {
    document.body.classList.toggle('light-mode');
  }

  function updateDisplay() {
    const token = document.getElementById('token');
    const statusText = document.getElementById('status-text');
    const stepBadge = document.getElementById('step-badge');
    const led = document.getElementById('led');
    const safeTitle = document.getElementById('safe-title');
    const safeDesc1 = document.getElementById('safe-desc1');
    const safeDesc2 = document.getElementById('safe-desc2');

    const posList = positions[currentScenario];
    const pos = posList[currentStep];

    token.setAttribute('cx', pos.cx);
    token.setAttribute('cy', pos.cy);
    stepBadge.innerText = `Step: ${currentStep + 1}/4`;

    if (currentStep === 3) {
      if (isHardened) {
        token.setAttribute('cx', 730);
        token.setAttribute('cy', 115);
        token.style.fill = "var(--accent-green)";
        led.className = "led-indicator";

        if (currentScenario === 'kallsyms') {
          safeTitle.textContent = "SYMBOLS REDACTED";
          safeDesc1.textContent = "Addresses: 0000000000000000";
          safeDesc2.textContent = "kptr_restrict=2 active";
          statusText.innerText = "Step 4: [REDACTED] Symbol addresses zeroed out! KASLR slide remains secret.";
        } else if (currentScenario === 'dmesg') {
          safeTitle.textContent = "ACCESS DENIED";
          safeDesc1.textContent = "klogctl() -> -EPERM";
          safeDesc2.textContent = "CAP_SYSLOG required";
          statusText.innerText = "Step 4: [BLOCKED] Unprivileged dmesg read rejected (-EPERM)! Kernel log protected.";
        } else {
          safeTitle.textContent = "POINTERS MASKED";
          safeDesc1.textContent = "%pK -> 0000000000000000";
          safeDesc2.textContent = "%p  -> Hashed via SipHash";
          statusText.innerText = "Step 4: [PROTECTED] Pointers safely redacted or hashed! No memory layout leaks.";
        }
      } else {
        token.setAttribute('cx', 730);
        token.setAttribute('cy', 255);
        token.style.fill = "var(--accent-red)";
        led.className = "led-indicator violation";
        statusText.innerText = "Step 4: [LEAKED] Raw kernel pointers exposed! KASLR defeated.";
      }
    } else {
      token.style.fill = isHardened ? "var(--accent-green)" : "var(--accent-amber)";
      led.className = isHardened ? "led-indicator" : "led-indicator permissive";
      statusText.innerText = pos.text;
    }
  }

  function stepSimulation() {
    currentStep = (currentStep + 1) % 4;
    updateDisplay();
  }

  function togglePlay() {
    const btn = document.getElementById('btn-play');
    if (isPlaying) {
      clearInterval(playInterval);
      isPlaying = false;
      btn.innerText = "Auto Play ▶";
    } else {
      isPlaying = true;
      btn.innerText = "Pause ⏸";
      playInterval = setInterval(() => {
        stepSimulation();
      }, 1400);
    }
  }

  function resetSimulation() {
    if (isPlaying) togglePlay();
    currentStep = 0;
    updateDisplay();
  }

  // Initialize
  updateDisplay();
</script>
</body>
</html>
