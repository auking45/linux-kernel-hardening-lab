<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kernel Module Signature Verification Architecture Simulator</title>
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-card: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
    --accent-blue: #38bdf8;
    --accent-green: #34d399;
    --accent-red: #f87171;
    --accent-amber: #fbbf24;
    --accent-purple: #c084fc;
    --token-fill: #38bdf8;
    --led-glow: rgba(52, 211, 153, 0.6);
  }

  body.light-mode {
    --bg-primary: #f8fafc;
    --bg-card: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --border-color: #cbd5e1;
    --accent-blue: #0284c7;
    --accent-green: #059669;
    --accent-red: #dc2626;
    --accent-amber: #d97706;
    --accent-purple: #7c3aed;
    --token-fill: #0284c7;
    --led-glow: rgba(5, 150, 105, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100vh;
  }

  .sim-container {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
  }

  .sim-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sim-title {
    font-size: 1.15rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .led-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: var(--accent-green);
    box-shadow: 0 0 10px var(--led-glow);
    transition: background-color 0.3s, box-shadow 0.3s;
  }
  .led-indicator.permissive {
    background-color: var(--accent-amber);
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
  }
  .led-indicator.violation {
    background-color: var(--accent-red);
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.8);
  }

  .sim-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
  }

  .btn {
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn:hover {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .btn.active {
    background: var(--accent-blue);
    color: #ffffff;
    border-color: var(--accent-blue);
  }

  .status-bar {
    font-family: monospace;
    font-size: 0.85rem;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 10px 14px;
    margin-top: 12px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .svg-box {
    fill: var(--bg-primary);
    stroke: var(--border-color);
    stroke-width: 1.5;
    rx: 8;
  }
  .svg-text-title {
    fill: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
  }
  .svg-text-desc {
    fill: var(--text-secondary);
    font-size: 11px;
    font-family: monospace;
  }

  #token {
    fill: var(--token-fill);
    filter: drop-shadow(0 0 6px var(--accent-blue));
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>
</head>
<body>

<div class="sim-container">
  <div class="sim-header">
    <div class="sim-title">
      <div id="led" class="led-indicator"></div>
      Kernel Module Signature Verification Architecture Simulator
    </div>
    <div style="font-family:monospace; font-size:0.8rem; color:var(--text-secondary);">
      CONFIG_MODULE_SIG_FORCE=y
    </div>
  </div>

  <div class="sim-toolbar">
    <button id="btn-mod-signed" class="btn active" onclick="selectScenario('signed')">Signed Module (.ko)</button>
    <button id="btn-mod-unsigned" class="btn" onclick="selectScenario('unsigned')">Unsigned Module</button>
    <button id="btn-mod-tampered" class="btn" onclick="selectScenario('tampered')">Tampered Module</button>
    <div style="flex-grow:1;"></div>
    <button id="btn-mode" class="btn" onclick="toggleMode()">Mode: Enforce (sig_enforce=1)</button>
    <button id="btn-step" class="btn" onclick="stepSimulation()">Next Step ⏭</button>
    <button id="btn-play" class="btn" onclick="togglePlay()">Auto Play ▶</button>
    <button id="btn-reset" class="btn" onclick="resetSimulation()">Reset ↺</button>
    <button class="btn" onclick="toggleTheme()">Theme 🌓</button>
  </div>

  <svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--text-secondary)"/>
      </marker>
    </defs>

    <!-- Column 1: Userspace Load Request / .ko Binary -->
    <g id="col-user">
      <rect x="20" y="20" width="220" height="340" fill="none" stroke="var(--border-color)" stroke-dasharray="4" rx="8"/>
      <text class="svg-text-title" x="35" y="45">Userspace insmod / finit_module</text>

      <!-- Signed Module -->
      <g id="box-mod-signed" transform="translate(30, 60)">
        <rect class="svg-box" width="200" height="75"/>
        <text class="svg-text-title" x="12" y="24">Official Signed Module</text>
        <text class="svg-text-desc" x="12" y="44">ELF + PKCS#7 / CMS</text>
        <text class="svg-text-desc" x="12" y="62" fill="var(--accent-green)">~Module signature append~</text>
      </g>

      <!-- Unsigned Module -->
      <g id="box-mod-unsigned" transform="translate(30, 155)">
        <rect class="svg-box" width="200" height="85"/>
        <text class="svg-text-title" x="12" y="24">Unsigned Rootkit (.ko)</text>
        <text class="svg-text-desc" x="12" y="44">Raw ELF executable</text>
        <text class="svg-text-desc" x="12" y="60">No PKCS#7 trailer</text>
        <text class="svg-text-desc" x="12" y="76" fill="var(--accent-red)">Missing cryptographic proof</text>
      </g>

      <!-- Tampered Module -->
      <g id="box-mod-tampered" transform="translate(30, 260)">
        <rect class="svg-box" width="200" height="85"/>
        <text class="svg-text-title" x="12" y="24">Tampered Module</text>
        <text class="svg-text-desc" x="12" y="44">ELF byte modified by attacker</text>
        <text class="svg-text-desc" x="12" y="60">PKCS#7 signature present</text>
        <text class="svg-text-desc" x="12" y="76" fill="var(--accent-amber)">SHA-256 hash mismatch</text>
      </g>
    </g>

    <!-- Column 2: Kernel Module Loader & Keyring Validation -->
    <g id="col-kernel" transform="translate(280, 20)">
      <rect class="svg-box" width="300" height="340"/>
      <text class="svg-text-title" x="20" y="32">Kernel Module Verification</text>
      <text id="svg-mode-text" class="svg-text-desc" x="20" y="52" fill="var(--accent-blue)">
        CONFIG_MODULE_SIG_FORCE=y (sig_enforce=1)
      </text>

      <!-- Verification Engine -->
      <g transform="translate(15, 70)">
        <rect width="270" height="110" fill="var(--bg-card)" stroke="var(--border-color)" rx="6"/>
        <text class="svg-text-title" x="15" y="28">module_sig_check()</text>
        <text class="svg-text-desc" x="15" y="50">Extracts PKCS#7 signature block</text>
        <text class="svg-text-desc" x="15" y="70">Computes SHA-256 over ELF binary</text>
        <text class="svg-text-desc" x="15" y="90" fill="var(--accent-purple)">Verifies against .builtin_trusted_keys</text>
      </g>

      <!-- Keyring & Decision Engine -->
      <g transform="translate(15, 200)">
        <rect width="270" height="120" fill="var(--bg-card)" stroke="var(--border-color)" rx="6"/>
        <text class="svg-text-title" x="15" y="26">Trusted Kernel Keyring</text>
        <text class="svg-text-desc" x="15" y="48">Keyring: .builtin_trusted_keys</text>
        <text class="svg-text-desc" x="15" y="70">X.509 Root CA / Ephemeral Key</text>
        <text class="svg-text-desc" x="15" y="92">Enforce=1: Denies unsigned/bad sig</text>
        <text id="decision-text" class="svg-text-desc" x="15" y="112" fill="var(--accent-green)">Status: Strict enforcement active</text>
      </g>
    </g>

    <!-- Column 3: Outcome -->
    <g id="col-outcome" transform="translate(620, 20)">
      <rect x="0" y="0" width="220" height="340" fill="none" stroke="var(--border-color)" stroke-dasharray="4" rx="8"/>
      <text class="svg-text-title" x="20" y="32">Kernel Load Outcome</text>

      <!-- Loaded Box -->
      <g id="box-outcome-allow" transform="translate(10, 60)">
        <rect class="svg-box" width="200" height="110"/>
        <text class="svg-text-title" x="15" y="28" fill="var(--accent-green)">MODULE LOADED</text>
        <text class="svg-text-desc" x="15" y="50">Return: 0 (Success)</text>
        <text class="svg-text-desc" x="15" y="72">Linked into kernel space</text>
        <text class="svg-text-desc" x="15" y="94" fill="var(--accent-green)">Driver init() executed</text>
      </g>

      <!-- Rejected Box -->
      <g id="box-outcome-deny" transform="translate(10, 190)">
        <rect class="svg-box" width="200" height="130"/>
        <text id="deny-title" class="svg-text-title" x="15" y="28" fill="var(--accent-red)">LOAD REJECTED</text>
        <text id="deny-errno" class="svg-text-desc" x="15" y="50">Error: -ENOKEY / -EKEYREJECTED</text>
        <text class="svg-text-desc" x="15" y="72">Module memory released</text>
        <text class="svg-text-desc" x="15" y="92" fill="var(--accent-red)">Rootkit injection thwarted</text>
        <text class="svg-text-desc" x="15" y="112" fill="var(--text-secondary)">No Ring 0 execution</text>
      </g>
    </g>

    <!-- Connecting Pathways -->
    <path d="M 230 100 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 230 200 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 230 300 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <path d="M 580 120 L 630 115" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 580 150 L 630 255" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- Animated Token -->
    <circle id="token" cx="130" cy="100" r="10"/>
  </svg>

  <div class="status-bar">
    <div id="status-text">Ready. Choose a scenario: Signed Module, Unsigned Module, or Tampered Module.</div>
    <div id="step-badge" style="font-weight:700; color:var(--accent-blue);">Step: 0/4</div>
  </div>
</div>

<script>
  let currentScenario = 'signed'; // 'signed', 'unsigned', 'tampered'
  let currentMode = 1;            // 1: Enforced, 0: Permissive
  let currentStep = 0;
  let isPlaying = false;
  let playInterval = null;

  const positions = {
    signed: [
      { cx: 130, cy: 100, text: "Step 1: Administrator calls insmod on validly signed driver with PKCS#7 signature." },
      { cx: 430, cy: 125, text: "Step 2: module_sig_check() parses PKCS#7 payload and calculates SHA-256 digest." },
      { cx: 430, cy: 260, text: "Step 3: Signature matches X.509 certificate in kernel keyring .builtin_trusted_keys." },
      { cx: 730, cy: 115, text: "Step 4: Result: MODULE LOADED (ret = 0). Init function executed in kernel." }
    ],
    unsigned: [
      { cx: 130, cy: 200, text: "Step 1: Attacker attempts to load unsigned rootkit binary (no PKCS#7 trailer)." },
      { cx: 430, cy: 125, text: "Step 2: module_sig_check() detects missing '~Module signature append~' marker." },
      { cx: 430, cy: 260, text: "Step 3: Keyring check fails: No signature present for module verification." },
      { cx: 730, cy: 255, text: "" } // Handled dynamically
    ],
    tampered: [
      { cx: 130, cy: 300, text: "Step 1: Attacker modifies binary bytes in signed module to inject malicious code." },
      { cx: 430, cy: 125, text: "Step 2: module_sig_check() computes SHA-256 digest over modified ELF sections." },
      { cx: 430, cy: 260, text: "Step 3: Cryptographic verification fails: computed digest does not match PKCS#7 signature." },
      { cx: 730, cy: 255, text: "" } // Handled dynamically
    ]
  };

  function selectScenario(scenario) {
    currentScenario = scenario;
    document.getElementById('btn-mod-signed').classList.toggle('active', scenario === 'signed');
    document.getElementById('btn-mod-unsigned').classList.toggle('active', scenario === 'unsigned');
    document.getElementById('btn-mod-tampered').classList.toggle('active', scenario === 'tampered');
    resetSimulation();
  }

  function toggleMode() {
    currentMode = currentMode === 1 ? 0 : 1;
    const btn = document.getElementById('btn-mode');
    const svgText = document.getElementById('svg-mode-text');
    const decText = document.getElementById('decision-text');

    if (currentMode === 1) {
      btn.innerText = "Mode: Enforce (sig_enforce=1)";
      svgText.textContent = "CONFIG_MODULE_SIG_FORCE=y (sig_enforce=1)";
      decText.textContent = "Status: Strict enforcement active";
    } else {
      btn.innerText = "Mode: Permissive (sig_enforce=0)";
      svgText.textContent = "CONFIG_MODULE_SIG=y (sig_enforce=0)";
      decText.textContent = "Status: Warning mode (TAINT_UNSIGNED_MODULE)";
    }
    updateDisplay();
  }

  function toggleTheme() {
    document.body.classList.toggle('light-mode');
  }

  function updateDisplay() {
    const token = document.getElementById('token');
    const statusText = document.getElementById('status-text');
    const stepBadge = document.getElementById('step-badge');
    const led = document.getElementById('led');
    const denyTitle = document.getElementById('deny-title');
    const denyErrno = document.getElementById('deny-errno');

    const posList = positions[currentScenario];
    const pos = posList[currentStep];

    token.setAttribute('cx', pos.cx);
    token.setAttribute('cy', pos.cy);
    stepBadge.innerText = `Step: ${currentStep + 1}/4`;

    const willBlock = (currentScenario !== 'signed' && currentMode === 1);

    if (currentStep === 3) {
      if (willBlock) {
        token.setAttribute('cx', 730);
        token.setAttribute('cy', 255);
        token.style.fill = "var(--accent-red)";
        led.className = "led-indicator violation";
        if (currentScenario === 'unsigned') {
          denyTitle.textContent = "REJECTED: -ENOKEY";
          denyErrno.textContent = "Required key not available";
          statusText.innerText = "Step 4: [ENFORCE] Kernel rejects unsigned module with -ENOKEY! Rootkit blocked.";
        } else {
          denyTitle.textContent = "REJECTED: -EKEYREJECTED";
          denyErrno.textContent = "Key was rejected (hash mismatch)";
          statusText.innerText = "Step 4: [ENFORCE] Kernel rejects tampered module with -EKEYREJECTED! Tamper blocked.";
        }
      } else {
        token.setAttribute('cx', 730);
        token.setAttribute('cy', 115);
        if (currentScenario === 'signed') {
          token.style.fill = "var(--accent-green)";
          led.className = "led-indicator";
          statusText.innerText = "Step 4: [VERIFIED] Signature valid. Module loaded cleanly without taints.";
        } else {
          token.style.fill = "var(--accent-amber)";
          led.className = "led-indicator permissive";
          statusText.innerText = "Step 4: [PERMISSIVE] Module loaded with warning. Kernel tainted (TAINT_UNSIGNED_MODULE).";
        }
      }
    } else {
      if (currentScenario === 'signed') {
        token.style.fill = "var(--accent-green)";
        led.className = "led-indicator";
      } else if (currentScenario === 'unsigned') {
        token.style.fill = (currentMode === 1) ? "var(--accent-red)" : "var(--accent-amber)";
        led.className = (currentMode === 1) ? "led-indicator violation" : "led-indicator permissive";
      } else {
        token.style.fill = (currentMode === 1) ? "var(--accent-amber)" : "var(--accent-amber)";
        led.className = (currentMode === 1) ? "led-indicator violation" : "led-indicator permissive";
      }
      statusText.innerText = pos.text;
    }
  }

  function stepSimulation() {
    currentStep = (currentStep + 1) % 4;
    updateDisplay();
  }

  function togglePlay() {
    const btn = document.getElementById('btn-play');
    if (isPlaying) {
      clearInterval(playInterval);
      isPlaying = false;
      btn.innerText = "Auto Play ▶";
    } else {
      isPlaying = true;
      btn.innerText = "Pause ⏸";
      playInterval = setInterval(() => {
        stepSimulation();
      }, 1400);
    }
  }

  function resetSimulation() {
    if (isPlaying) togglePlay();
    currentStep = 0;
    updateDisplay();
  }

  // Initialize
  updateDisplay();
</script>
</body>
</html>
