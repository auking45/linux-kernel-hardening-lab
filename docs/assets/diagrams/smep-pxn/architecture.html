<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMEP (x86) & PXN (ARM64) Dynamic Architecture Simulator</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --accent-yellow: #f59e0b;
      --perm-user: #fb923c;
      --perm-kernel: #38bdf8;
      --glow-blue: rgba(56, 189, 248, 0.4);
      --glow-red: rgba(239, 68, 68, 0.5);
      --glow-green: rgba(34, 197, 94, 0.4);
      --glow-yellow: rgba(245, 158, 11, 0.5);
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-purple: #9333ea;
      --accent-yellow: #d97706;
      --perm-user: #ea580c;
      --perm-kernel: #0284c7;
      --glow-blue: rgba(2, 132, 199, 0.2);
      --glow-red: rgba(220, 38, 38, 0.2);
      --glow-green: rgba(22, 163, 74, 0.2);
      --glow-yellow: rgba(217, 119, 6, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent-blue);
    }

    .scenario-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-blue);
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    /* Simulation Control Toolbar */
    .sim-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sim-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sim-btn {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .sim-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
    }

    .sim-btn.primary {
      background: var(--accent-blue);
      color: #0b132b;
      border-color: var(--accent-blue);
    }

    [data-theme="light"] .sim-btn.primary {
      color: #ffffff;
    }

    .speed-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .speed-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .speed-btn.active {
      background: var(--accent-blue);
      color: #0b132b;
      border-color: var(--accent-blue);
    }

    [data-theme="light"] .speed-btn.active {
      color: #ffffff;
    }

    .sim-status {
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Main View Grid */
    .view-container {
      display: grid;
      grid-template-columns: 2.1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 960px) {
      .view-container {
        grid-template-columns: 1fr;
      }
    }

    .diagram-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      min-height: 540px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .info-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .info-desc {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .metric-box {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
    }

    [data-theme="light"] .metric-box {
      background: rgba(241, 245, 249, 0.8);
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* SVG Canvas Styles & Animations */
    .svg-canvas {
      width: 100%;
      height: 520px;
      display: block;
    }

    /* Dynamic Flow Lines */
    @keyframes flowDash {
      to {
        stroke-dashoffset: -48;
      }
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 4px currentColor); }
      50% { filter: drop-shadow(0 0 12px currentColor); }
    }

    .flow-path {
      stroke-dasharray: 8 6;
      animation: flowDash 1.2s linear infinite;
    }

    .flow-path.normal {
      stroke: var(--accent-blue);
      color: var(--accent-blue);
    }

    .flow-path.return {
      stroke: var(--accent-green);
      color: var(--accent-green);
    }

    .flow-path.attack {
      stroke: var(--accent-red);
      color: var(--accent-red);
      animation: flowDash 0.8s linear infinite;
      filter: drop-shadow(0 0 6px var(--accent-red));
    }

    .flow-path.blocked {
      stroke: var(--accent-yellow);
      color: var(--accent-yellow);
      stroke-dasharray: 6 4;
      animation: flowDash 1.5s linear infinite;
    }

    .flow-particle {
      animation: pulseGlow 1.2s ease-in-out infinite;
    }

    /* Hardware Gate Barrier Shield */
    @keyframes shieldGlow {
      0%, 100% { stroke-opacity: 0.6; stroke-width: 2; }
      50% { stroke-opacity: 1; stroke-width: 4; }
    }

    .shield-line {
      stroke-dasharray: 10 5;
      animation: shieldGlow 2s ease-in-out infinite;
    }

    /* Detonation Trap Ripple */
    @keyframes rippleExpand {
      0% { r: 6; opacity: 1; }
      100% { r: 38; opacity: 0; }
    }

    .trap-ripple {
      animation: rippleExpand 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }

    /* Badges */
    .shield-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .danger-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.75rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        <span>SMEP & PXN Dynamic Architecture Simulator</span>
        <span class="badge">Hardware Instruction Fetch Prevention</span>
      </h1>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️ 테마 전환</button>
    </header>

    <div class="scenario-tabs">
      <button class="tab-btn active" onclick="switchScenario(1)">1. 권한 분리 정상 모델 (Syscall Flow)</button>
      <button class="tab-btn" onclick="switchScenario(2)">2. ret2usr 공격 침투 (Without SMEP/PXN)</button>
      <button class="tab-btn" onclick="switchScenario(3)">3. 하드웨어 MMU 차단 (With SMEP/PXN Active)</button>
      <button class="tab-btn" onclick="switchScenario(4)">4. ROP 전이 및 방어 매트릭스 (Comparison)</button>
    </div>

    <!-- Simulator Interactive Controls -->
    <div class="sim-toolbar">
      <div class="sim-controls">
        <button class="sim-btn primary" id="playBtn" onclick="togglePlay()">⏸ 일시정지</button>
        <button class="sim-btn" onclick="resetAnimation()">⏮ 초기화</button>
        <div class="speed-selector">
          <span>속도:</span>
          <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
          <button class="speed-btn active" onclick="setSpeed(1.0)">1.0x</button>
          <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
        </div>
      </div>
      <div class="sim-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Simulation Active: Real-time Signal Stream</span>
      </div>
    </div>

    <div class="view-container">
      <div class="diagram-panel" id="diagramPanel">
        <!-- SVG Canvas rendered dynamically -->
      </div>

      <div class="info-panel" id="infoPanel">
        <!-- Technical explanations and telemetry -->
      </div>
    </div>
  </div>

  <script>
    let currentScenario = 1;
    let isPlaying = true;
    let currentSpeed = 1.0;

    const scenarios = {
      1: {
        title: "1. 권한 분리 정상 모델 (Privilege Separation & Syscall Flow)",
        desc: "CPU는 링(Ring 0 / EL1)과 유저(Ring 3 / EL0)의 권한 레벨을 물리적으로 분리합니다. 유저 프로세스는 시스템 콜(syscall / svc)을 통해 합법적인 인터페이스로 커널에 진입하며, 작업 완료 후 sysret / eret을 통해 유저 공간으로 안전하게 복귀합니다. 이 정상 흐름에서는 유저 공간 코드가 커널 모드에서 실행되지 않습니다.",
        metric1Label: "x86 제어 플래그",
        metric1Val: "CR4.SMEP (Bit 20 = 1)",
        metric2Label: "ARM64 디스크립터",
        metric2Val: "PTE_PXN (Bit 53 = 1)",
        status: "Normal: Syscall Entry (EL0 -> EL1) & Return (EL1 -> EL0)",
        statusColor: "var(--accent-green)",
        renderSvg: (speed) => {
          const dur1 = (2.2 / speed).toFixed(2);
          const dur2 = (2.2 / speed).toFixed(2);
          return `
          <svg class="svg-canvas" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
              <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
              <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
              </linearGradient>
              <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ea580c" stop-opacity="0.15" />
                <stop offset="100%" stop-color="#fb923c" stop-opacity="0.05" />
              </linearGradient>
            </defs>

            <!-- KERNEL ZONE (Ring 0 / EL1) -->
            <rect x="30" y="30" width="700" height="180" rx="12" fill="url(#kernelGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" />
            <text x="50" y="60" fill="#38bdf8" font-size="14" font-weight="bold" letter-spacing="1">KERNEL SPACE (SUPERVISOR: RING 0 / EL1)</text>
            <rect x="580" y="44" width="130" height="24" rx="12" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" />
            <text x="645" y="60" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">CPL = 0 (Privileged)</text>

            <!-- Kernel Components -->
            <g transform="translate(60, 80)">
              <rect width="260" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
              <text x="20" y="32" fill="#f8fafc" font-size="13" font-weight="bold">Syscall Dispatcher</text>
              <text x="20" y="52" fill="#94a3b8" font-size="11" font-family="monospace">entry_SYSCALL_64 / el0_svc</text>
              <text x="20" y="76" fill="#38bdf8" font-size="11">Valid Kernel Entry Point</text>
            </g>

            <g transform="translate(440, 80)">
              <rect width="260" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
              <text x="20" y="32" fill="#f8fafc" font-size="13" font-weight="bold">Kernel Service Routines</text>
              <text x="20" y="52" fill="#94a3b8" font-size="11" font-family="monospace">sys_read(), sys_write(), ...</text>
              <text x="20" y="76" fill="#22c55e" font-size="11">Execution in Ring 0 (.text)</text>
            </g>

            <!-- HARDWARE MMU BOUNDARY PLANE -->
            <g transform="translate(30, 235)">
              <line x1="0" y1="20" x2="700" y2="20" stroke="#f59e0b" stroke-width="2" class="shield-line" />
              <rect x="250" y="6" width="260" height="28" rx="14" fill="#1c2541" stroke="#f59e0b" stroke-width="1.5" />
              <text x="380" y="24" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">⚡ HARDWARE MMU PRIVILEGE BOUNDARY</text>
            </g>

            <!-- USER ZONE (Ring 3 / EL0) -->
            <rect x="30" y="295" width="700" height="180" rx="12" fill="url(#userGrad)" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4 2" />
            <text x="50" y="325" fill="#fb923c" font-size="14" font-weight="bold" letter-spacing="1">USER SPACE (UNPRIVILEGED: RING 3 / EL0)</text>
            <rect x="580" y="309" width="130" height="24" rx="12" fill="rgba(251,146,60,0.2)" stroke="#fb923c" />
            <text x="645" y="325" fill="#fb923c" font-size="11" font-weight="bold" text-anchor="middle">CPL = 3 (Unprivileged)</text>

            <!-- User Components -->
            <g transform="translate(60, 345)">
              <rect width="260" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
              <text x="20" y="32" fill="#f8fafc" font-size="13" font-weight="bold">User Application Process</text>
              <text x="20" y="52" fill="#94a3b8" font-size="11" font-family="monospace">/bin/exploit (UID 1000)</text>
              <text x="20" y="76" fill="#fb923c" font-size="11">Invokes syscall instruction</text>
            </g>

            <g transform="translate(440, 345)">
              <rect width="260" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
              <text x="20" y="32" fill="#f8fafc" font-size="13" font-weight="bold">User Return Destination</text>
              <text x="20" y="52" fill="#94a3b8" font-size="11" font-family="monospace">libc resume / RIP restore</text>
              <text x="20" y="76" fill="#22c55e" font-size="11">Resumes unprivileged task</text>
            </g>

            <!-- DYNAMIC CONNECTING PATHS -->
            <!-- 1. Syscall Path (User -> Kernel) -->
            <path id="pathSyscall" d="M 190 345 C 190 280 190 240 190 180" fill="none" stroke="#38bdf8" stroke-width="3" class="flow-path normal" />
            <circle r="6" fill="#38bdf8" filter="url(#glow-blue)" class="flow-particle">
              <animateMotion dur="${dur1}s" repeatCount="indefinite" path="M 190 345 C 190 280 190 240 190 180" />
            </circle>

            <!-- 2. Kernel Internal Dispatch Path -->
            <path id="pathInternal" d="M 320 130 L 440 130" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-path normal" />

            <!-- 3. Sysret Path (Kernel -> User) -->
            <path id="pathSysret" d="M 570 180 C 570 240 570 280 570 345" fill="none" stroke="#22c55e" stroke-width="3" class="flow-path return" />
            <circle r="6" fill="#22c55e" filter="url(#glow-green)" class="flow-particle">
              <animateMotion dur="${dur2}s" repeatCount="indefinite" path="M 570 180 C 570 240 570 280 570 345" />
            </circle>

            <rect x="120" y="240" width="140" height="20" rx="4" fill="#0b132b" stroke="#38bdf8" />
            <text x="190" y="254" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">▲ 1. SYSCALL (Safe)</text>

            <rect x="500" y="240" width="140" height="20" rx="4" fill="#0b132b" stroke="#22c55e" />
            <text x="570" y="254" fill="#22c55e" font-size="10" font-weight="bold" text-anchor="middle">▼ 2. SYSRET (Safe)</text>
          </svg>
          `;
        }
      },
      2: {
        title: "2. ret2usr 공격 침투 (Without SMEP/PXN Baseline)",
        desc: "SMEP/PXN이 비활성화된 커널(clearcpuid=smep, pxn=off)에서는 슈퍼바이저 모드(Ring 0)가 유저 가상 주소 공간의 명령어를 페치하는 것이 하드웨어적으로 차단되지 않습니다. 공격자가 커널 취약 드라이버의 함수 포인터를 유저 공간 쉘코드(0x00401234)로 덮어쓰면, CPU는 슈퍼바이저 권한(CPL=0)을 유지한 채 유저 쉘코드로 뛰어들어 commit_creds(0)를 실행하고 루트 권한을 즉각 탈취합니다.",
        metric1Label: "공격 기법",
        metric1Val: "ret2usr (Return-to-User)",
        metric2Label: "공격 결과",
        metric2Val: "루트 권한 완전 탈취 (VULNERABLE)",
        status: "CRITICAL BREACH: Ring 0 CPU executed User Shellcode directly!",
        statusColor: "var(--accent-red)",
        renderSvg: (speed) => {
          const dur = (1.5 / speed).toFixed(2);
          return `
          <svg class="svg-canvas" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
              <linearGradient id="breachGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
                <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05" />
              </linearGradient>
            </defs>
