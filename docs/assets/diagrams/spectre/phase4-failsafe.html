<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario 06 - Phase 4: Perception Anomaly Intercept & Safe Mission Hold</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    [data-theme="light"] .step-desc-bar {
      background: #f8fafc;
      color: #0f172a;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .metric-item {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .svg-canvas rect {
      fill: #ffffff !important;
    }

    [data-theme="light"] .svg-canvas text[fill="#94a3b8"] {
      fill: #64748b !important;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-green);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 6px;
    }

    .phase-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .controls { display: flex; gap: 6px; align-items: center; }
    .btn {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(34, 197, 94, 0.25); border-color: var(--accent-green); }
    .btn.primary { background: var(--accent-green); color: #0b132b; }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diagram-viewport {
      width: 100%;
      height: 250px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: rgba(11, 19, 43, 0.4);
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .svg-canvas { width: 100%; height: 100%; }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .metric-item {
      background: rgba(11, 19, 43, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      text-align: center;
    }

    .metric-title { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
    .metric-val { font-size: 0.85rem; font-weight: 700; color: var(--accent-green); }

    .status-ok { color: var(--accent-green) !important; }
    .status-alert { color: var(--accent-red) !important; }

    @keyframes safe-pulse {
      0% { filter: drop-shadow(0 0 2px var(--accent-green)); }
      50% { filter: drop-shadow(0 0 10px var(--accent-green)); }
      100% { filter: drop-shadow(0 0 2px var(--accent-green)); }
    }
    .pulse-safe { animation: safe-pulse 1.8s infinite; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="phase-badge">Phase 4: 부채널 탐지 격리 및 안전 홀드 자율 대응</span>
        <span style="font-size:0.75rem; color:var(--text-muted);" id="stepIndicator">단계 1 / 4</span>
      </div>
      <div class="controls">
        <button class="btn" onclick="prevStep()">◀ 이전</button>
        <button class="btn" onclick="nextStep()">다음 ▶</button>
        <button class="btn primary" id="playBtn" onclick="togglePlay()">자동 재생</button>
        <button class="btn" onclick="resetSim()">초기화</button>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️ 라이트</button>
      </div>
    </div>

    <div class="step-desc-bar" id="descBar">
      <span id="descIcon">🛑</span>
      <span id="descText">비정상적인 캐시 타이밍 측정(Flush+Reload) 스캔 빈도가 워치독 모니터에 포착되어 긴급 보안 격리가 발령됨.</span>
    </div>

    <div class="diagram-viewport">
      <svg class="svg-canvas" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#22c55e" />
          </marker>
          <marker id="arrow-yellow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
          </marker>
        </defs>

        <!-- Anomaly Detector -->
        <g id="boxDetector">
          <rect x="25" y="30" width="170" height="165" rx="6" fill="#1c2541" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="35" y="55" font-size="11" font-weight="700" fill="#f59e0b">Side-Channel Watchdog</text>
          <text x="35" y="75" font-size="9" fill="#94a3b8">Hardware PMU Monitor</text>
          <line x1="25" y1="85" x2="195" y2="85" stroke="#3a506b" stroke-width="1"/>
          <text x="35" y="105" font-size="9.5" fill="#f8fafc">clflush Rate: Anomalous</text>
          <rect x="33" y="120" width="154" height="32" rx="4" fill="rgba(245,158,11,0.15)" stroke="#f59e0b"/>
          <text x="40" y="140" font-size="9" font-weight="700" fill="#f59e0b">TIMING PROBE ALERT</text>
          <text x="35" y="175" font-size="8.5" fill="#94a3b8">Interception: Active</text>
        </g>

        <!-- Enclave Keystore Lockdown -->
        <g id="boxKeystore">
          <rect x="235" y="30" width="175" height="165" rx="6" fill="#1c2541" stroke="#22c55e" stroke-width="1.5"/>
          <text x="245" y="55" font-size="11" font-weight="700" fill="#22c55e">Crypto Keystore</text>
          <text x="245" y="75" font-size="9" fill="#94a3b8">Enclave Quarantine</text>
          <line x1="235" y1="85" x2="410" y2="85" stroke="#3a506b" stroke-width="1"/>
          <text x="245" y="105" font-size="9.5" fill="#f8fafc">Key Token: ZEROIZED</text>
          <rect x="243" y="120" width="159" height="32" rx="4" fill="rgba(34,197,94,0.15)" stroke="#22c55e"/>
          <text x="252" y="140" font-size="9" font-weight="700" fill="#22c55e">TOKEN REVOKED (LOCKED)</text>
          <text x="245" y="175" font-size="8.5" fill="#94a3b8">Geofence: Tamper-Proof</text>
        </g>

        <!-- Safe Mission Hold Locomotion -->
        <g id="boxLocomotion">
          <rect x="450" y="30" width="165" height="165" rx="6" fill="#1c2541" stroke="#22c55e" stroke-width="1.5"/>
          <text x="460" y="55" font-size="11" font-weight="700" fill="#22c55e">Locomotion Planner</text>
          <text x="460" y="75" font-size="9" fill="#94a3b8">Autonomous Trajectory</text>
          <line x1="450" y1="85" x2="615" y2="85" stroke="#3a506b" stroke-width="1"/>
          <text x="460" y="105" font-size="9.5" fill="#f8fafc">Trajectory: IMMOBILIZED</text>
          <rect x="458" y="120" width="149" height="32" rx="4" fill="rgba(34,197,94,0.15)" stroke="#22c55e"/>
          <text x="468" y="140" font-size="9" font-weight="700" fill="#22c55e">SAFE HOLD MODE</text>
          <text x="460" y="175" font-size="8.5" fill="#94a3b8">Position: Standing Still</text>
        </g>

        <!-- Zero Damage State -->
        <g id="boxResult" class="pulse-safe">
          <rect x="655" y="30" width="125" height="165" rx="6" fill="#1c2541" stroke="#22c55e" stroke-width="1.8"/>
          <text x="665" y="55" font-size="10.5" font-weight="700" fill="#22c55e">Mission Safe</text>
          <text x="665" y="75" font-size="9" fill="#94a3b8">Zero Breach</text>
          <line x1="655" y1="85" x2="780" y2="85" stroke="#3a506b" stroke-width="1"/>
          <text x="665" y="105" font-size="9" fill="#22c55e">Geofence: OK</text>
          <text x="665" y="125" font-size="9" fill="#22c55e">Secret: 0% Leak</text>
          <text x="665" y="145" font-size="9" fill="#22c55e">Hardware: 0 J</text>
          <rect x="662" y="160" width="111" height="26" rx="4" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
          <text x="668" y="177" font-size="8.5" font-weight="700" fill="#22c55e">DEFENSE PASS</text>
        </g>

        <path d="M 195 112 L 235 112" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-yellow)"/>
        <path d="M 410 112 L 450 112" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
        <path d="M 615 112 L 655 112" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
      </svg>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-title">부채널 모니터</div>
        <div class="metric-val status-ok">PROBE FLAGGED</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">엔클레이브 키 상태</div>
        <div class="metric-val status-ok">REVOKED (LOCKED)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">자율 주행 모드</div>
        <div class="metric-val status-ok">SAFE HOLD (정지)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">전체 시스템 보안</div>
        <div class="metric-val status-ok">SECURE HALT</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 4;
    let isPlaying = false;
    let playTimer = null;

    const stepData = [
      {
        step: 1,
        desc: "비정상적인 캐시 타이밍 측정(Flush+Reload) 스캔 빈도가 워치독 모니터에 포착되어 긴급 보안 격리가 발령됨.",
        action: () => {}
      },
      {
        step: 2,
        desc: "미션 보안 엔클레이브가 기밀 토큰을 즉각 소거(Zeroize) 및 동결하여 조작된 인증 시도를 원천 무력화함.",
        action: () => {}
      },
      {
        step: 3,
        desc: "로봇 자율 주행 플래너가 'Safe Hold Mode'로 즉각 전환하여 위험 구역 진입을 물리적으로 차단하고 제자리 기립 정지함.",
        action: () => {}
      },
      {
        step: 4,
        desc: "지오펜스 보안 경계가 완벽히 보존되고 물리적 기구 파손 위험이 0%로 완벽 차단된 결정론적 안전 상태 확립.",
        action: () => {}
      }
    ];

    function renderStep(idx) {
      currentStep = idx;
      const data = stepData[idx - 1];
      document.getElementById('stepIndicator').textContent = `단계 ${data.step} / ${totalSteps}`;
      document.getElementById('descText').textContent = data.desc;
      data.action();
      reportHeight();
    }

    function nextStep() {
      if (currentStep < totalSteps) renderStep(currentStep + 1);
      else renderStep(1);
    }

    function prevStep() {
      if (currentStep > 1) renderStep(currentStep - 1);
      else renderStep(totalSteps);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        btn.textContent = "일시정지";
        btn.style.background = "#e2e8f0";
        btn.style.color = "#0f172a";
        playLoop();
      } else {
        btn.textContent = "자동 재생";
        btn.style.background = "var(--accent-green)";
        btn.style.color = "#0b132b";
        clearTimeout(playTimer);
      }
    }

    function playLoop() {
      if (!isPlaying) return;
      nextStep();
      playTimer = setTimeout(playLoop, 2600);
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    function toggleTheme(forcedTheme) {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const target = forcedTheme || (current === 'light' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', target);
      try { localStorage.setItem('diagram-theme', target); } catch(e){}
      updateThemeBtn(target);
      try {
        window.parent.postMessage({ type: 'diagram-theme-change', theme: target }, '*');
      } catch(e){}
    }

    function updateThemeBtn(theme) {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = theme === 'light' ? '🌙 다크' : '☀️ 라이트';
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'set-diagram-theme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        updateThemeBtn(e.data.theme);
      }
    });

    (function() {
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('diagram-theme'); } catch(e){}
      if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        savedTheme = 'light';
      }
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);
      }
    })();

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
      playTimer = setTimeout(playLoop, 2000);
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  </script>
</body>
</html>
