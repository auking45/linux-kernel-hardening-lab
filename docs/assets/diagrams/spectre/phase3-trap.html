<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario 06 - Phase 3: array_index_nospec & Retpoline Defense Trap</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    [data-theme="light"] .step-desc-bar {
      background: #f8fafc;
      color: #0f172a;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .metric-item {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .svg-canvas rect {
      fill: #ffffff !important;
    }

    [data-theme="light"] .svg-canvas text[fill="#94a3b8"] {
      fill: #64748b !important;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-yellow);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 6px;
    }

    .phase-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      border: 1px solid var(--accent-yellow);
    }

    .controls { display: flex; gap: 6px; align-items: center; }
    .btn {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(245, 158, 11, 0.25); border-color: var(--accent-yellow); }
    .btn.primary { background: var(--accent-yellow); color: #0b132b; }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diagram-viewport {
      width: 100%;
      height: 250px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: rgba(11, 19, 43, 0.4);
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .svg-canvas { width: 100%; height: 100%; }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .metric-item {
      background: rgba(11, 19, 43, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      text-align: center;
    }

    .metric-title { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
    .metric-val { font-size: 0.85rem; font-weight: 700; color: var(--accent-yellow); }

    .status-ok { color: var(--accent-green) !important; }
    .status-alert { color: var(--accent-red) !important; }

    @keyframes shield-pulse {
      0% { filter: drop-shadow(0 0 2px var(--accent-yellow)); }
      50% { filter: drop-shadow(0 0 10px var(--accent-yellow)); }
      100% { filter: drop-shadow(0 0 2px var(--accent-yellow)); }
    }
    .pulse-shield { animation: shield-pulse 1.5s infinite; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="phase-badge">Phase 3: array_index_nospec 산술 마스킹 &amp; Retpoline 차단</span>
        <span style="font-size:0.75rem; color:var(--text-muted);" id="stepIndicator">단계 1 / 4</span>
      </div>
      <div class="controls">
        <button class="btn" onclick="prevStep()">◀ 이전</button>
        <button class="btn" onclick="nextStep()">다음 ▶</button>
        <button class="btn primary" id="playBtn" onclick="togglePlay()">자동 재생</button>
        <button class="btn" onclick="resetSim()">초기화</button>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️ 라이트</button>
      </div>
    </div>

    <div class="step-desc-bar" id="descBar">
      <span id="descIcon">🛡️</span>
      <span id="descText">array_index_nospec() 마스크가 개입하여 예측 실행 중에도 경계 초과 인덱스를 0으로 강제 클램핑함.</span>
    </div>

    <div class="diagram-viewport">
      <svg class="svg-canvas" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-yellow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
          </marker>
        </defs>

        <!-- Speculation Barrier Engine -->
        <g id="boxCpu">
          <rect x="25" y="25" width="220" height="180" rx="6" fill="#1c2541" stroke="#f59e0b" stroke-width="1.8"/>
          <text x="35" y="48" font-size="11" font-weight="700" fill="#f59e0b">Speculation Barrier Engine</text>
          <text x="35" y="66" font-size="9" fill="#94a3b8">array_index_nospec(x, size)</text>
          <line x1="25" y1="75" x2="245" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="35" y="85" width="200" height="48" rx="4" fill="rgba(245,158,11,0.1)" stroke="#f59e0b"/>
          <text x="43" y="103" font-size="8.5" font-family="monospace" fill="#f59e0b">mask = ~(index &lt; size);</text>
          <text x="43" y="120" font-size="8.5" font-family="monospace" fill="#22c55e">safe_idx = index &amp; ~mask;</text>
          <text x="35" y="156" font-size="9" fill="#22c55e">Clamped Index: 0 (Benign)</text>
          <text x="35" y="180" font-size="9" font-weight="700" fill="#22c55e">SPECULATION CLAMPED</text>
        </g>

        <!-- Protected Enclave -->
        <g id="boxMemory" class="pulse-shield">
          <rect x="280" y="25" width="230" height="180" rx="6" fill="#1c2541" stroke="#22c55e" stroke-width="1.5"/>
          <text x="290" y="48" font-size="11" font-weight="700" fill="#22c55e">Mission Security Enclave</text>
          <text x="290" y="66" font-size="9" fill="#94a3b8">Zero Speculative Leakage</text>
          <line x1="280" y1="75" x2="510" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="290" y="85" width="210" height="42" rx="4" fill="rgba(34,197,94,0.1)" stroke="#22c55e"/>
          <text x="298" y="101" font-size="8.5" fill="#22c55e">Target Secret: NAV_SEC_8F3A</text>
          <text x="298" y="116" font-size="8.5" fill="#f8fafc">Speculative Access: BLOCKED</text>
          <rect x="290" y="136" width="210" height="42" rx="4" fill="rgba(56,189,248,0.1)" stroke="#38bdf8"/>
          <text x="298" y="152" font-size="8.5" fill="#38bdf8">Retpoline Active: CONFIG_RETPOLINE</text>
          <text x="298" y="167" font-size="8.5" fill="#94a3b8">Indirect Branch Safe: pause loop</text>
        </g>

        <!-- Neutralized Cache Probe -->
        <g id="boxCache">
          <rect x="545" y="25" width="230" height="180" rx="6" fill="#1c2541" stroke="#22c55e" stroke-width="1.8"/>
          <text x="555" y="48" font-size="11" font-weight="700" fill="#22c55e">Neutralized Cache State</text>
          <text x="555" y="66" font-size="9" fill="#94a3b8">No Timing Differential</text>
          <line x1="545" y1="75" x2="775" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="555" y="85" width="210" height="48" rx="4" fill="rgba(34,197,94,0.15)"/>
          <text x="563" y="103" font-size="9" font-weight="700" fill="#22c55e">All Secret Lines: DRAM Latency</text>
          <text x="563" y="120" font-size="8.5" fill="#94a3b8">Measured Time: &gt; 240 Cycles</text>
          <rect x="555" y="142" width="210" height="42" rx="4" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
          <text x="565" y="160" font-size="9" font-weight="700" fill="#22c55e">🛡️ LEAK BLOCKED (0% RECOVERY)</text>
          <text x="565" y="176" font-size="8" fill="#f8fafc">Side-Channel Timing Flattened</text>
        </g>

        <path d="M 245 110 L 280 110" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-yellow)"/>
        <path d="M 510 110 L 545 110" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-yellow)"/>
      </svg>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-title">예측 인덱스 상태</div>
        <div class="metric-val status-ok">CLAMPED (idx=0)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">기밀 라인 L1 적재</div>
        <div class="metric-val status-ok">0 건 (DRAM 유지)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">부채널 탈취율</div>
        <div class="metric-val status-ok">0% (탈취 불가)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">Retpoline 보호</div>
        <div class="metric-val status-ok">ACTIVE (Spectre v2)</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 4;
    let isPlaying = false;
    let playTimer = null;

    const stepData = [
      {
        step: 1,
        desc: "array_index_nospec() 마스크가 개입하여 예측 실행 중에도 경계 초과 인덱스를 0으로 강제 클램핑함.",
        action: () => {}
      },
      {
        step: 2,
        desc: "CPU 마이크로아키텍처가 잘못된 경로를 일시 실행하더라도 기밀 주소 대신 공개 인덱스 0번 데이터만 로드함.",
        action: () => {}
      },
      {
        step: 3,
        desc: "CONFIG_RETPOLINE이 간접 점프 예측을 포즈 루프로 가두어 Spectre v2 분기 주입 공격을 원천 차단함.",
        action: () => {}
      },
      {
        step: 4,
        desc: "Flush+Reload 측정 시 모든 기밀 라인이 240사이클 이상의 DRAM 지연을 나타내어 부채널 신호가 0%로 평탄화됨.",
        action: () => {}
      }
    ];

    function renderStep(idx) {
      currentStep = idx;
      const data = stepData[idx - 1];
      document.getElementById('stepIndicator').textContent = `단계 ${data.step} / ${totalSteps}`;
      document.getElementById('descText').textContent = data.desc;
      data.action();
      reportHeight();
    }

    function nextStep() {
      if (currentStep < totalSteps) renderStep(currentStep + 1);
      else renderStep(1);
    }

    function prevStep() {
      if (currentStep > 1) renderStep(currentStep - 1);
      else renderStep(totalSteps);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        btn.textContent = "일시정지";
        btn.style.background = "#e2e8f0";
        btn.style.color = "#0f172a";
        playLoop();
      } else {
        btn.textContent = "자동 재생";
        btn.style.background = "var(--accent-yellow)";
        btn.style.color = "#0b132b";
        clearTimeout(playTimer);
      }
    }

    function playLoop() {
      if (!isPlaying) return;
      nextStep();
      playTimer = setTimeout(playLoop, 2600);
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    function toggleTheme(forcedTheme) {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const target = forcedTheme || (current === 'light' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', target);
      try { localStorage.setItem('diagram-theme', target); } catch(e){}
      updateThemeBtn(target);
      try {
        window.parent.postMessage({ type: 'diagram-theme-change', theme: target }, '*');
      } catch(e){}
    }

    function updateThemeBtn(theme) {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = theme === 'light' ? '🌙 다크' : '☀️ 라이트';
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'set-diagram-theme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        updateThemeBtn(e.data.theme);
      }
    });

    (function() {
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('diagram-theme'); } catch(e){}
      if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        savedTheme = 'light';
      }
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);
      }
    })();

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
      playTimer = setTimeout(playLoop, 2000);
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  </script>
</body>
</html>
