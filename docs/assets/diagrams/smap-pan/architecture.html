<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMAP (x86) & PAN (ARM64) Dynamic Architecture Simulator</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --accent-yellow: #f59e0b;
      --perm-user: #fb923c;
      --perm-kernel: #38bdf8;
      --glow-blue: rgba(56, 189, 248, 0.4);
      --glow-red: rgba(239, 68, 68, 0.5);
      --glow-green: rgba(34, 197, 94, 0.4);
      --glow-yellow: rgba(245, 158, 11, 0.5);
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-purple: #9333ea;
      --accent-yellow: #d97706;
      --perm-user: #ea580c;
      --perm-kernel: #0284c7;
      --glow-blue: rgba(2, 132, 199, 0.2);
      --glow-red: rgba(220, 38, 38, 0.2);
      --glow-green: rgba(22, 163, 74, 0.2);
      --glow-yellow: rgba(217, 119, 6, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent-blue);
    }

    .scenario-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-blue);
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    /* Simulation Control Toolbar */
    .sim-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 16px;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sim-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sim-btn {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .sim-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
    }

    .sim-btn.primary {
      background: var(--accent-blue);
      color: #0b132b;
      border-color: var(--accent-blue);
    }

    [data-theme="light"] .sim-btn.primary {
      color: #ffffff;
    }

    .speed-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .speed-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .speed-btn.active {
      background: var(--accent-blue);
      color: #0b132b;
      border-color: var(--accent-blue);
    }

    [data-theme="light"] .speed-btn.active {
      color: #ffffff;
    }

    .sim-status {
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .view-container {
      display: grid;
      grid-template-columns: 2.1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 960px) {
      .view-container {
        grid-template-columns: 1fr;
      }
    }

    .diagram-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      min-height: 540px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .info-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .info-desc {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .metric-box {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
    }

    [data-theme="light"] .metric-box {
      background: rgba(241, 245, 249, 0.8);
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .svg-canvas {
      width: 100%;
      height: 520px;
      display: block;
    }

    @keyframes flowDash {
      to {
        stroke-dashoffset: -48;
      }
    }

    .flow-path {
      stroke-dasharray: 8 6;
      animation: flowDash 1.2s linear infinite;
    }

    .flow-path.normal {
      stroke: var(--accent-blue);
    }

    .flow-path.return {
      stroke: var(--accent-green);
    }

    .flow-path.attack {
      stroke: var(--accent-red);
      animation: flowDash 0.8s linear infinite;
      filter: drop-shadow(0 0 6px var(--accent-red));
    }

    .flow-path.blocked {
      stroke: var(--accent-yellow);
      stroke-dasharray: 6 4;
    }

    @keyframes shieldGlow {
      0%, 100% { stroke-opacity: 0.6; stroke-width: 2; }
      50% { stroke-opacity: 1; stroke-width: 4; }
    }

    .shield-line {
      stroke-dasharray: 10 5;
      animation: shieldGlow 2s ease-in-out infinite;
    }

    @keyframes rippleExpand {
      0% { r: 6; opacity: 1; }
      100% { r: 38; opacity: 0; }
    }

    .trap-ripple {
      animation: rippleExpand 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        <span>SMAP & PAN Dynamic Architecture Simulator</span>
        <span class="badge">Hardware User Data Access Prevention</span>
      </h1>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️ 테마 전환</button>
    </header>

    <div class="scenario-tabs">
      <button class="tab-btn active" onclick="switchScenario(1)">1. 인가된 유저 메모리 접근 (uaccess & STAC/CLAC)</button>
      <button class="tab-btn" onclick="switchScenario(2)">2. 비인가 유저 데이터 역참조 (Without SMAP/PAN)</button>
      <button class="tab-btn" onclick="switchScenario(3)">3. 하드웨어 MMU 차단 (With SMAP/PAN Enforced)</button>
      <button class="tab-btn" onclick="switchScenario(4)">4. 보안 영향도 및 우회 기법 비교 매트릭스</button>
    </div>

    <!-- Simulator Interactive Controls -->
    <div class="sim-toolbar">
      <div class="sim-controls">
        <button class="sim-btn primary" id="playBtn" onclick="togglePlay()">⏸ 일시정지</button>
        <button class="sim-btn" onclick="resetAnimation()">⏮ 초기화</button>
        <div class="speed-selector">
          <span>속도:</span>
          <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
          <button class="speed-btn active" onclick="setSpeed(1.0)">1.0x</button>
          <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
        </div>
      </div>
      <div class="sim-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Simulation Active: Hardware Data Flow Stream</span>
      </div>
    </div>

    <div class="view-container">
      <div class="diagram-panel" id="diagramPanel">
        <!-- Injected via JavaScript -->
      </div>

      <div class="info-panel" id="infoPanel">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

  <script>
    let currentScenario = 1;
    let isPlaying = true;
    let currentSpeed = 1.0;

    const scenarios = {
      1: {
        title: "1. 인가된 유저 메모리 접근 (uaccess API & STAC/CLAC)",
        desc: "커널이 합법적으로 유저 공간 메모리와 데이터를 주고받을 때(copy_from_user, copy_to_user), x86 CPU는 stac 명령어로 EFLAGS.AC를 1로 세트하거나 ARM64는 uaccess_enable()로 PSTATE.PAN을 임시 해제합니다. 복사가 끝나면 clac / uaccess_disable()로 즉시 창구를 잠급니다.",
        metric1Label: "x86 제어 플래그",
        metric1Val: "CR4.SMAP=1 + EFLAGS.AC toggle",
        metric2Label: "ARM64 레지스터",
        metric2Val: "PSTATE.PAN (0 = Temp Allow, 1 = Deny)",
        status: "Normal: Authorized uaccess Window (stac -> copy -> clac)",
        statusColor: "var(--accent-green)",
        renderSvg: (speed) => {
          const dur = (2.0 / speed).toFixed(2);
          return `
          <svg class="svg-canvas" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            <!-- KERNEL ZONE -->
            <rect x="30" y="30" width="700" height="180" rx="12" fill="#1c2541" stroke="#38bdf8" stroke-width="1.5" />
            <text x="50" y="60" fill="#38bdf8" font-size="14" font-weight="bold">KERNEL SPACE (SUPERVISOR: RING 0 / EL1)</text>

            <g transform="translate(60, 80)">
              <rect width="280" height="100" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
              <text x="20" y="32" fill="#22c55e" font-size="13" font-weight="bold">Authorized uaccess API</text>
              <text x="20" y="52" fill="#f8fafc" font-size="11" font-family="monospace">stac; copy_from_user(); clac;</text>
              <text x="20" y="76" fill="#86efac" font-size="11">Explicit AC/PAN Toggle Window</text>
            </g>

            <g transform="translate(420, 80)">
              <rect width="280" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
              <text x="20" y="32" fill="#f8fafc" font-size="13" font-weight="bold">Kernel Target Buffer</text>
              <text x="20" y="52" fill="#94a3b8" font-size="11" font-family="monospace">kbuf (Kernel Heap/Stack)</text>
              <text x="20" y="76" fill="#38bdf8" font-size="11">Data safely validated and copied</text>
            </g>

            <!-- MMU BARRIER WITH AUTHORIZED GATE -->
            <g transform="translate(30, 235)">
              <line x1="0" y1="20" x2="700" y2="20" stroke="#22c55e" stroke-width="2" class="shield-line" />
              <rect x="220" y="6" width="320" height="28" rx="14" fill="#0b132b" stroke="#22c55e" stroke-width="1.5" />
              <text x="380" y="24" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle">🔓 MMU SMAP/PAN TEMPORARILY UNLOCKED (AC=1)</text>
            </g>

            <!-- USER ZONE -->
            <rect x="30" y="295" width="700" height="180" rx="12" fill="#1c2541" stroke="#fb923c" stroke-width="1.5" />
            <text x="50" y="325" fill="#fb923c" font-size="14" font-weight="bold">USER SPACE BUFFER (UNPRIVILEGED: RING 3 / EL0)</text>

            <g transform="translate(240, 345)">
              <rect width="320" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
              <text x="20" y="32" fill="#f8fafc" font-size="13" font-weight="bold">User Source Buffer</text>
              <text x="20" y="52" fill="#94a3b8" font-size="11" font-family="monospace">char *ubuf (PTE User=1)</text>
              <text x="20" y="76" fill="#fb923c" font-size="11">Read through authorized page mapping</text>
            </g>

            <!-- DYNAMIC NORMAL DATA STREAM -->
            <path id="pathNorm" d="M 400 345 C 400 280 200 280 200 180" fill="none" stroke="#22c55e" stroke-width="3" class="flow-path normal" />
            <circle r="6" fill="#22c55e" class="flow-particle">
              <animateMotion dur="${dur}s" repeatCount="indefinite" path="M 400 345 C 400 280 200 280 200 180" />
            </circle>

            <rect x="250" y="240" width="160" height="20" rx="4" fill="#0b132b" stroke="#22c55e" />
            <text x="330" y="254" fill="#22c55e" font-size="10" font-weight="bold" text-anchor="middle">▲ Controlled copy_from_user</text>
          </svg>
          `;
        }
      },
      2: {
        title: "2. 비인가 유저 데이터 역참조 (Without SMAP/PAN Baseline)",
        desc: "SMAP/PAN이 없는 베이스라인 환경(nosmap, pan=off)에서는 커널 모드 코드가 유저 주소(0x0040... < TASK_SIZE)의 데이터를 직접 포인터 역참조(*user_ptr)하여 읽고 쓰는 것이 아무런 제약 없이 허용됩니다. 공격자는 가짜 커널 자격 증명(Fake cred)을 유저 공간에 구성하고 커널 포인터를 유저 주소로 조작하여 임의 쓰기/읽기 공격을 완수합니다.",
        metric1Label: "취약점 형태",
        metric1Val: "Direct Pointer Dereference (*ptr)",
        metric2Label: "공격 결과",
        metric2Val: "가짜 구조체 오염 성공 (VULNERABLE)",
        status: "CRITICAL: Direct supervisor dereference of User space memory!",
        statusColor: "var(--accent-red)",
        renderSvg: (speed) => {
          const dur = (1.5 / speed).toFixed(2);
          return `
          <svg class="svg-canvas" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="30" width="700" height="180" rx="12" fill="#1c2541" stroke="#ef4444" stroke-width="2" />
            <text x="50" y="60" fill="#ef4444" font-size="14" font-weight="bold">KERNEL SPACE - DIRECT USER DEREFERENCE (VULN)</text>

            <g transform="translate(60, 80)">
              <rect width="280" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
              <text x="20" y="32" fill="#ef4444" font-size="13" font-weight="bold">Flawed Driver Logic</text>
              <text x="20" y="52" fill="#f8fafc" font-size="11" font-family="monospace">*ptr = 0x00401234 (Direct Read)</text>
              <text x="20" y="76" fill="#fca5a5" font-size="11">Bypassed copy_from_user() checks</text>
            </g>

            <g transform="translate(420, 80)">
              <rect width="280" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
              <text x="20" y="32" fill="#f8fafc" font-size="13" font-weight="bold">Execution Mode</text>
              <text x="20" y="52" fill="#ef4444" font-size="11" font-family="monospace">Ring 0 / EL1 (No SMAP hardware check)</text>
              <text x="20" y="76" fill="#94a3b8" font-size="11">Reads user memory unconditionally</text>
            </g>

            <!-- DISABLED BARRIER -->
            <g transform="translate(30, 235)">
              <line x1="0" y1="20" x2="700" y2="20" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />
              <rect x="220" y="6" width="320" height="28" rx="14" fill="#1c2541" stroke="#ef4444" stroke-width="1.2" />
              <text x="380" y="24" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">⚠️ SMAP / PAN DISABLED (NO HARDWARE CHECK)</text>
            </g>

            <!-- USER ZONE -->
            <rect x="30" y="295" width="700" height="180" rx="12" fill="#1c2541" stroke="#ef4444" stroke-width="2" />
            <text x="50" y="325" fill="#ef4444" font-size="14" font-weight="bold">USER SPACE MEMORY - FAKE STRUCT INJECTED</text>

            <g transform="translate(240, 345)">
              <rect width="320" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
              <text x="20" y="32" fill="#ef4444" font-size="13" font-weight="bold">Fake Kernel Struct in User Space</text>
              <text x="20" y="52" fill="#f8fafc" font-size="11" font-family="monospace">struct cred { uid: 0, gid: 0 }</text>
              <text x="20" y="76" fill="#22c55e" font-size="11" font-weight="bold">Kernel dereferences user memory as trusted!</text>
            </g>

            <path id="pathAttack" d="M 200 180 C 200 240 400 250 400 345" fill="none" stroke="#ef4444" stroke-width="4" class="flow-path attack" />
            <circle r="7" fill="#ef4444" class="flow-particle">
              <animateMotion dur="${dur}s" repeatCount="indefinite" path="M 200 180 C 200 240 400 250 400 345" />
            </circle>

            <rect x="240" y="240" width="180" height="22" rx="4" fill="#ef4444" />
            <text x="330" y="255" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">⚡ UNPROTECTED DIRECT DEREFERENCE</text>
          </svg>
          `;
        }
      },
      3: {
        title: "3. 하드웨어 MMU 차단 (With SMAP/PAN Active)",
        desc: "하드닝이 켜지면(CR4.SMAP=1, PSTATE.PAN=1), 커널 슈퍼바이저 모드(Ring 0 / EL1)에서 AC 플래그가 꺼진 상태(AC=0)로 유저 주소를 직접 읽거나 쓰려고 시도하는 즉시 CPU 하드웨어 MMU가 Page Fault (#PF, Supervisor Data Access Violation)를 발생시켜 커널 크래시/트랩으로 즉각 방어합니다.",
        metric1Label: "하드웨어 강제",
        metric1Val: "CR4.SMAP=1 / PSTATE.PAN=1",
        metric2Label: "방어 결과",
        metric2Val: "MMU #PF Trap Detonated (ACCESS DENIED)",
        status: "BLOCKED: MMU Hardware Page Fault trapped direct user dereference!",
        statusColor: "var(--accent-yellow)",
        renderSvg: (speed) => {
          const dur = (1.8 / speed).toFixed(2);
          return `
          <svg class="svg-canvas" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg">
            <rect x="30" y="30" width="700" height="180" rx="12" fill="#1c2541" stroke="#38bdf8" stroke-width="1.5" />
            <text x="50" y="60" fill="#38bdf8" font-size="14" font-weight="bold">KERNEL SPACE - HARDWARE SMAP/PAN DEFENSE ACTIVE</text>

            <g transform="translate(60, 80)">
              <rect width="270" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />

    function switchScenario(num) {
      currentScenario = num;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === num);
      });

      const s = scenarios[num];
      renderCurrentScenario();

      document.getElementById('infoPanel').innerHTML = `
        <div class="info-title">${s.title}</div>
        <div class="info-desc">${s.desc}</div>
        <div class="metric-box">
          <div class="metric-label">${s.metric1Label}</div>
          <div class="metric-val">${s.metric1Val}</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">${s.metric2Label}</div>
          <div class="metric-val">${s.metric2Val}</div>
        </div>
      `;

      updateStatus(s.status, s.statusColor);
    }

    function renderCurrentScenario() {
      const s = scenarios[currentScenario];
      const panel = document.getElementById('diagramPanel');
      panel.innerHTML = s.renderSvg(isPlaying ? currentSpeed : 0.0001);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      const dot = document.getElementById('statusDot');

      if (isPlaying) {
        btn.innerHTML = '⏸ 일시정지';
        dot.style.animationPlayState = 'running';
      } else {
        btn.innerHTML = '▶ 재생';
        dot.style.animationPlayState = 'paused';
      }
      renderCurrentScenario();
    }

    function resetAnimation() {
      renderCurrentScenario();
    }

    function setSpeed(speed) {
      currentSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(speed + 'x'));
      });
      renderCurrentScenario();
    }

    function updateStatus(text, color) {
      const statusText = document.getElementById('statusText');
      const statusDot = document.getElementById('statusDot');
      statusText.textContent = text;
      statusDot.style.background = color || 'var(--accent-green)';
      statusDot.style.boxShadow = `0 0 8px ${color || 'var(--accent-green)'}`;
    }

    function toggleTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
      document.getElementById('themeToggle').textContent = isLight ? '☀️ 테마 전환' : '🌙 테마 전환';
    }

    switchScenario(1);
