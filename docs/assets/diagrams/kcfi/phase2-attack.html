<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario 05 - Phase 2: Type Confusion & Indirect Call Hijack (Attack)</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    [data-theme="light"] .step-desc-bar {
      background: #f8fafc;
      color: #0f172a;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .metric-item {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .svg-canvas rect {
      fill: #ffffff !important;
    }

    [data-theme="light"] .svg-canvas text[fill="#94a3b8"] {
      fill: #64748b !important;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-red);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 6px;
    }

    .phase-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    .controls { display: flex; gap: 6px; align-items: center; }
    .btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(239, 68, 68, 0.25); border-color: var(--accent-red); }
    .btn.primary { background: var(--accent-red); color: #ffffff; }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diagram-viewport {
      width: 100%;
      height: 250px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: rgba(11, 19, 43, 0.4);
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .svg-canvas { width: 100%; height: 100%; }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .metric-item {
      background: rgba(11, 19, 43, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      text-align: center;
    }

    .metric-title { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
    .metric-val { font-size: 0.85rem; font-weight: 700; color: var(--accent-red); }

    .status-ok { color: var(--accent-green) !important; }
    .status-alert { color: var(--accent-red) !important; }

    @keyframes hijack-pulse {
      0% { stroke: #ef4444; stroke-width: 2; }
      50% { stroke: #ef4444; stroke-width: 4; filter: drop-shadow(0 0 8px #ef4444); }
      100% { stroke: #ef4444; stroke-width: 2; }
    }
    .pulse-hijack { animation: hijack-pulse 1.3s infinite; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="phase-badge">Phase 2: 함수 포인터 변조 &amp; 제어 흐름 하이재킹 공격</span>
        <span style="font-size:0.75rem; color:var(--text-muted);" id="stepIndicator">단계 1 / 4</span>
      </div>
      <div class="controls">
        <button class="btn" onclick="prevStep()">◀ 이전</button>
        <button class="btn" onclick="nextStep()">다음 ▶</button>
        <button class="btn primary" id="playBtn" onclick="togglePlay()">자동 재생</button>
        <button class="btn" onclick="resetSim()">초기화</button>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️ 라이트</button>
      </div>
    </div>

    <div class="step-desc-bar" id="descBar">
      <span id="descIcon">⚠️</span>
      <span id="descText">공격자가 CVE-2021-4154 타입 혼동(Type Confusion) 취약점을 트리거하여 ops-&gt;dispatch_fn 함수 포인터 메모리를 조작함.</span>
    </div>

    <div class="diagram-viewport">
      <svg class="svg-canvas" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
          </marker>
        </defs>

        <!-- Corrupted Caller Dispatcher -->
        <g id="boxCaller">
          <rect x="25" y="25" width="220" height="180" rx="6" fill="#1c2541" stroke="#ef4444" stroke-width="1.5"/>
          <text x="35" y="48" font-size="11" font-weight="700" fill="#ef4444">Corrupted Ops Table</text>
          <text x="35" y="66" font-size="9" fill="#94a3b8">CVE-2021-4154 Type Confusion</text>
          <line x1="25" y1="75" x2="245" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="35" y="85" width="200" height="50" rx="4" fill="rgba(239,68,68,0.15)" stroke="#ef4444"/>
          <text x="43" y="103" font-size="9" font-family="monospace" fill="#ef4444">ops-&gt;dispatch_fn = 0x5788...</text>
          <text x="43" y="122" font-size="8.5" fill="#f8fafc">Overwritten: &amp;malicious_payload</text>
          <text x="35" y="156" font-size="9" fill="#ef4444">CFI Protection: DISABLED (n)</text>
          <text x="35" y="180" font-size="9" font-weight="700" fill="#ef4444">DISPATCH HIJACKED</text>
        </g>

        <!-- Unchecked Direct Jump Vector -->
        <path id="jumpPath" d="M 245 110 L 515 110" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)" class="pulse-hijack"/>

        <!-- Attacker Malicious Function -->
        <g id="boxAttacker">
          <rect x="520" y="25" width="255" height="180" rx="6" fill="#1c2541" stroke="#ef4444" stroke-width="1.8" id="atkRect"/>
          <text x="530" y="48" font-size="11" font-weight="700" fill="#ef4444">Hostile: malicious_actuator_overload</text>
          <text x="530" y="66" font-size="9" fill="#94a3b8">Untagged Payload (No kCFI, No ENDBR)</text>
          <line x1="520" y1="75" x2="775" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="530" y="85" width="235" height="42" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444"/>
          <text x="538" y="101" font-size="8.5" fill="#ef4444">Preamble: 0x00000000 (UNTAGGED)</text>
          <text x="538" y="116" font-size="8.5" fill="#ef4444">Execution: Unchecked Ring 0 Burst</text>
          <text x="530" y="148" font-size="9.5" font-weight="700" fill="#ef4444" id="atkVelo">Commanded Velocity: 48.5 rad/s!</text>
          <text x="530" y="168" font-size="8.5" fill="#f8fafc" id="atkDamage">Harmonic Drive: Gear Teeth Sheared</text>
          <rect x="530" y="178" width="235" height="22" rx="4" fill="#ef4444"/>
          <text x="550" y="193" font-size="8.5" font-weight="700" fill="#ffffff">💥 ACTUATOR GEAR SHIFT EXPLOSION</text>
        </g>
      </svg>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-title">제어 흐름 무결성</div>
        <div class="metric-val status-alert">HIJACKED (탈취됨)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">kCFI 서명 검증</div>
        <div class="metric-val status-alert">BYPASSED (미적용)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">모터 지령 각속도</div>
        <div class="metric-val status-alert" id="mAtkVel">48.5 rad/s (27배 폭주)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">기구부 손상 상태</div>
        <div class="metric-val status-alert" id="mAtkDmg">치절 파단 (Gear Shear)</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 4;
    let isPlaying = false;
    let playTimer = null;

    const stepData = [
      {
        step: 1,
        desc: "공격자가 CVE-2021-4154 타입 혼동(Type Confusion) 취약점을 트리거하여 ops->dispatch_fn 함수 포인터 메모리를 조작함.",
        vel: "1.8 rad/s (조작 직전)",
        dmg: "정상 대기",
        action: () => {
          document.getElementById('atkVelo').textContent = "Commanded Velocity: 1.8 rad/s";
          document.getElementById('atkDamage').textContent = "Harmonic Drive: 대기 중";
        }
      },
      {
        step: 2,
        desc: "함수 포인터가 악의적 관절 과부하 루틴(malicious_actuator_overload) 주소로 완전히 덮어써짐.",
        vel: "오버로드 페이로드 바인딩",
        dmg: "변조 완료",
        action: () => {
          document.getElementById('atkVelo').textContent = "Target Payload Bound: 0x5788...";
          document.getElementById('atkDamage').textContent = "간접 분기 명령어 대기";
        }
      },
      {
        step: 3,
        desc: "커널이 (*ops->dispatch_fn)()를 실행: CFI 및 IBT 방어 부재로 인해 아무런 타입/주소 검증 없이 악성 코드로 무단 점프함!",
        vel: "점프 실행 (Ring 0)",
        dmg: "제어권 완전 상실",
        action: () => {
          document.getElementById('atkVelo').textContent = "Execution: Jumping to hostile payload";
          document.getElementById('atkDamage').textContent = "Unchecked execution in Ring 0!";
        }
      },
      {
        step: 4,
        desc: "악성 루틴이 관절 모터 지령 속도를 48.5 rad/s로 폭주시킴! 하모닉 감속기 치절이 전단(Shear) 파괴되고 모터 권선이 즉각 소손됨.",
        vel: "48.5 rad/s (27배 폭주)",
        dmg: "치절 파단 (Gear Shear)",
        action: () => {
          document.getElementById('atkVelo').textContent = "Commanded Velocity: 48.5 rad/s!";
          document.getElementById('atkDamage').textContent = "Harmonic Drive: Gear Teeth Sheared";
        }
      }
    ];

    function renderStep(idx) {
      currentStep = idx;
      const data = stepData[idx - 1];
      document.getElementById('stepIndicator').textContent = `단계 ${data.step} / ${totalSteps}`;
      document.getElementById('descText').textContent = data.desc;
      document.getElementById('mAtkVel').textContent = data.vel;
      document.getElementById('mAtkDmg').textContent = data.dmg;
      data.action();
      reportHeight();
    }

    function nextStep() {
      if (currentStep < totalSteps) renderStep(currentStep + 1);
      else renderStep(1);
    }

    function prevStep() {
      if (currentStep > 1) renderStep(currentStep - 1);
      else renderStep(totalSteps);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        btn.textContent = "일시정지";
        btn.style.background = "#e2e8f0";
        btn.style.color = "#0f172a";
        playLoop();
      } else {
        btn.textContent = "자동 재생";
        btn.style.background = "var(--accent-red)";
        btn.style.color = "#ffffff";
        clearTimeout(playTimer);
      }
    }

    function playLoop() {
      if (!isPlaying) return;
      nextStep();
      playTimer = setTimeout(playLoop, 2600);
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    function toggleTheme(forcedTheme) {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const target = forcedTheme || (current === 'light' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', target);
      try { localStorage.setItem('diagram-theme', target); } catch(e){}
      updateThemeBtn(target);
      try {
        window.parent.postMessage({ type: 'diagram-theme-change', theme: target }, '*');
      } catch(e){}
    }

    function updateThemeBtn(theme) {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = theme === 'light' ? '🌙 다크' : '☀️ 라이트';
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'set-diagram-theme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        updateThemeBtn(e.data.theme);
      }
    });

    (function() {
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('diagram-theme'); } catch(e){}
      if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        savedTheme = 'light';
      }
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);
      }
    })();

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
      playTimer = setTimeout(playLoop, 2000);
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  </script>
</body>
</html>
