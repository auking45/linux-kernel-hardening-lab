<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario 03 - Phase 3: Hardware MMU SMAP/PAN Trap</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    [data-theme="light"] .step-desc-bar {
      background: #f8fafc;
      color: #0f172a;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .metric-item {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .svg-canvas rect {
      fill: #ffffff !important;
    }

    [data-theme="light"] .svg-canvas text[fill="#94a3b8"] {
      fill: #64748b !important;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-yellow);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 6px;
    }

    .phase-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      border: 1px solid var(--accent-yellow);
    }

    .controls { display: flex; gap: 6px; align-items: center; }
    .btn {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(245, 158, 11, 0.25); border-color: var(--accent-yellow); }
    .btn.primary { background: var(--accent-yellow); color: #0b132b; }
    [data-theme="light"] .btn.primary { color: #ffffff; }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diagram-viewport {
      width: 100%;
      height: 240px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: rgba(11, 19, 43, 0.4);
      position: relative;
    }

    .svg-canvas { width: 100%; height: 100%; display: block; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .metric-item {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
    }

    .metric-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .metric-val { font-size: 0.85rem; font-weight: 700; font-family: monospace; }
    .metric-val.yellow { color: var(--accent-yellow); }
    .metric-val.green { color: var(--accent-green); }
    .metric-val.red { color: var(--accent-red); }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="phase-badge">PHASE 3 : TRAP</span>
        <span style="font-weight: 700; font-size: 0.88rem;">하드웨어 MMU 트랩: SMAP / PAN 페이지 폴트 (#PF 0x0015)</span>
      </div>
      <div class="controls">
        <button class="btn primary" id="playBtn" onclick="togglePlay()">⏸ 일시정지</button>
        <button class="btn" onclick="prevStep()">⏮ 이전</button>
        <button class="btn" onclick="nextStep()">⏭ 다음</button>
        <button class="btn" onclick="resetSim()">↺ 리셋</button>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️ 라이트</button>
      </div>
    </div>

    <div class="step-desc-bar" id="stepDesc">
      <span style="color: var(--accent-yellow); font-weight: bold;">[Step 1/3]</span>
      <span>커널 워커(Ring 0)가 오염된 포인터를 통해 유저 주소(0x00405000) 데이터 읽기를 시도함.</span>
    </div>

    <div class="diagram-viewport">
      <svg class="svg-canvas" viewBox="0 0 900 240" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b" />
          </marker>
        </defs>

        <!-- User Space Box -->
        <rect x="30" y="25" width="250" height="190" rx="8" fill="#1e293b" stroke="#3a506b" stroke-width="1.5" />
        <text x="45" y="50" fill="#94a3b8" font-size="13" font-weight="700">USER SPACE (U/S = 1)</text>
        <text x="45" y="70" fill="#94a3b8" font-size="10">Target: 0x00405000</text>

        <rect x="50" y="90" width="210" height="95" rx="6" fill="#1c2541" stroke="#ef4444" stroke-width="1" />
        <text x="65" y="115" fill="#ef4444" font-size="11" font-weight="bold">HOSTILE FAKE POLICY</text>
        <text x="65" y="135" fill="#94a3b8" font-size="10">• torque: 650.0 Nm</text>
        <text x="65" y="152" fill="#94a3b8" font-size="10">• margin: 0.00 m</text>
        <text x="65" y="169" fill="#22c55e" font-size="10">• Status: BLOCKED (0 Bytes Read)</text>

        <!-- MMU Hardware Trap Box -->
        <rect x="330" y="25" width="240" height="190" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="2.5" />
        <text x="350" y="50" fill="#f59e0b" font-size="13" font-weight="700">HARDWARE MMU INTERCEPT</text>
        <text x="350" y="70" fill="#22c55e" font-size="10">CR4.SMAP=1 | EFLAGS.AC=0</text>

        <rect id="trapBox" x="350" y="90" width="200" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
        <text id="trapTitle" x="365" y="115" fill="#f59e0b" font-size="11" font-weight="bold">#PF Fault Detonation!</text>

        <rect id="trapDetailBox" x="350" y="145" width="200" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
        <text id="trapDetail" x="365" y="170" fill="#f8fafc" font-size="11" font-weight="bold">Error Code: 0x0015</text>

        <!-- Kernel Space Box -->
        <rect x="620" y="25" width="250" height="190" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <text x="635" y="50" fill="#38bdf8" font-size="13" font-weight="700">KERNEL SPACE (Ring 0 / EL1)</text>
        <text x="635" y="70" fill="#94a3b8" font-size="10">Direct Dereference Attempt</text>

        <rect id="kernelSafeBox" x="640" y="90" width="210" height="95" rx="6" fill="#1c2541" stroke="#22c55e" stroke-width="1.5" />
        <text x="655" y="115" fill="#22c55e" font-size="11" font-weight="bold">Kinematics Preserved</text>
        <text x="655" y="135" fill="#22c55e" font-size="10">• torque: 120.0 Nm (Safe)</text>
        <text x="655" y="152" fill="#22c55e" font-size="10">• margin: 0.50 m (Safe)</text>
        <text x="655" y="169" fill="#22c55e" font-size="10">• Intercept: 100% BLOCKED</text>

        <!-- Intercept Flash Barrier -->
        <line x1="330" y1="25" x2="330" y2="215" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8,4" />
        <circle id="blastCircle" cx="330" cy="120" r="14" fill="#f59e0b" opacity="0.8" />
        <text x="323" y="125" fill="#0b132b" font-size="12" font-weight="bold">⚡</text>
      </svg>
    </div>

    <div class="metrics-grid">
      <div class="metric-item">
        <div class="metric-label">Exception Fired</div>
        <div class="metric-val yellow" id="metricExc">Page Fault (#PF)</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Page Fault Code</div>
        <div class="metric-val yellow" id="metricCode">0x0015 (Supervisor Read)</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Fake Object Ingestion</div>
        <div class="metric-val green" id="metricIngest">0 Bytes (REJECTED)</div>
      </div>
      <div class="metric-item">
        <div class="metric-label">Tampering Success</div>
        <div class="metric-val green" id="metricTamp">0% (BLOCKED)</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 3;
    let isPlaying = true;
    let playTimer = null;

    const descriptions = [
      "<span style='color: var(--accent-yellow); font-weight: bold;'>[Step 1/3]</span> 커널 워커(Ring 0)가 오염된 포인터를 통해 유저 주소(0x00405000) 데이터 읽기를 시도함.",
      "<span style='color: var(--accent-yellow); font-weight: bold;'>[Step 2/3]</span> 하드웨어 MMU가 <code>CR4.SMAP=1</code> 및 <code>EFLAGS.AC=0</code> 상태를 확인하고, 0 클록 지연으로 데이터 로드 명령을 강제 중단함.",
      "<span style='color: var(--accent-green); font-weight: bold;'>[Step 3/3]</span> <code>#PF (0x0015)</code> 예외 핸들러가 호출되어 위조 파라미터 유입을 100% 차단하고 커널 긴급 방어 루틴으로 전환함."
    ];

    function renderStep(step) {
      currentStep = step;
      document.getElementById('stepDesc').innerHTML = descriptions[step - 1];

      const trapTitle = document.getElementById('trapTitle');
      const trapDetail = document.getElementById('trapDetail');
      const blast = document.getElementById('blastCircle');

      if (step === 1) {
        trapTitle.textContent = "Validating Access...";
        trapDetail.textContent = "CPL=0 vs U/S=1 Check";
        blast.setAttribute("r", "10");
        blast.setAttribute("opacity", "0.5");
      } else if (step === 2) {
        trapTitle.textContent = "#PF Fault Detonated!";
        trapDetail.textContent = "Error Code: 0x0015";
        blast.setAttribute("r", "22");
        blast.setAttribute("opacity", "1.0");
      } else if (step === 3) {
        trapTitle.textContent = "Hostile Read Aborted";
        trapDetail.textContent = "Integrity: 100% Guarded";
        blast.setAttribute("r", "16");
        blast.setAttribute("opacity", "0.8");
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        btn.textContent = '⏸ 일시정지';
        btn.classList.add('primary');
        playLoop();
      } else {
        btn.textContent = '▶ 재생';
        btn.classList.remove('primary');
        clearTimeout(playTimer);
      }
    }

    function prevStep() {
      if (isPlaying) togglePlay();
      renderStep(currentStep > 1 ? currentStep - 1 : totalSteps);
    }

    function nextStep() {
      if (isPlaying) togglePlay();
      renderStep(currentStep < totalSteps ? currentStep + 1 : 1);
    }

    function playLoop() {
      if (!isPlaying) return;
      if (currentStep < totalSteps) {
        renderStep(currentStep + 1);
        playTimer = setTimeout(playLoop, 1800);
      } else {
        playTimer = setTimeout(() => {
          if (!isPlaying) return;
          renderStep(1);
          playTimer = setTimeout(playLoop, 1800);
        }, 2200);
      }
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    function toggleTheme(forcedTheme) {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const target = forcedTheme || (current === 'light' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', target);
      try { localStorage.setItem('diagram-theme', target); } catch(e){}
      updateThemeBtn(target);
      try {
        window.parent.postMessage({ type: 'diagram-theme-change', theme: target }, '*');
      } catch(e){}
    }

    function updateThemeBtn(theme) {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = theme === 'light' ? '🌙 다크' : '☀️ 라이트';
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'set-diagram-theme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        updateThemeBtn(e.data.theme);
      }
    });

    (function() {
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('diagram-theme'); } catch(e){}
      if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        savedTheme = 'light';
      }
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);
      }
    })();

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
      playTimer = setTimeout(playLoop, 1800);
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  </script>
</body>
</html>
