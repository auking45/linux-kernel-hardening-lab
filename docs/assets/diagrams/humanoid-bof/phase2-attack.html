<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 2: Buffer Overflow Attack</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"], (prefers-color-scheme: light) {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-red);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-red);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-badge {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--accent-red);
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .ctrl-btn.primary {
      background: var(--accent-red);
      color: #ffffff;
      border-color: var(--accent-red);
    }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--accent-red);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      color: var(--text-main);
      line-height: 1.4;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stack-preview-bar {
      display: flex;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 10px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.72rem;
      font-weight: 600;
      text-align: center;
    }

    .stack-cell {
      padding: 5px 2px;
      flex: 1;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      transition: all 0.3s ease;
    }
    .stack-cell:last-child { border-right: none; }
    .cell-buf { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); }
    .cell-canary { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
    .cell-sfp { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); }
    .cell-ret { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); }
    .cell-warn { background: rgba(245, 158, 11, 0.3); color: var(--accent-yellow); font-weight: bold; }
    .cell-danger { background: rgba(239, 68, 68, 0.35); color: var(--accent-red); font-weight: bold; animation: pulseRed 1s infinite alternate; }
    .cell-ret-corrupted { background: rgba(239, 68, 68, 0.6); color: #fff; font-weight: bold; animation: pulseRed 0.8s infinite alternate; }

    @keyframes pulseRed {
      from { box-shadow: inset 0 0 4px rgba(239, 68, 68, 0.5); }
      to { box-shadow: inset 0 0 12px rgba(239, 68, 68, 0.9); }
    }

    .svg-canvas { width: 100%; height: 110px; display: block; }
    @keyframes flowDash { to { stroke-dashoffset: -48; } }

    .flow-path.attack {
      stroke: var(--accent-red);
      stroke-dasharray: 8 6;
      animation: flowDash 0.8s linear infinite;
      filter: drop-shadow(0 0 6px var(--accent-red));
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .metric-item {
      background: rgba(11, 19, 43, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 5px;
      padding: 5px 8px;
    }
    .metric-name { font-size: 0.68rem; color: var(--text-muted); }
    .metric-val { font-size: 0.82rem; font-weight: 700; color: var(--accent-red); font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div class="badge-title">
        <span>🚨 Phase 2: 초과 페이로드 주입 (CVE-2026-76640)</span>
        <span class="step-badge" id="stepBadge">Step 1/4: 초과 패킷 송신</span>
      </div>
      <div class="btn-group">
        <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">▶ 재생</button>
        <button class="ctrl-btn" id="prevBtn" onclick="prevStep()" disabled>⏮ 이전</button>
        <button class="ctrl-btn" id="nextBtn" onclick="nextStep()">⏭ 다음 스텝</button>
        <button class="ctrl-btn" id="resetBtn" onclick="resetSim()">↺ 리셋</button>
      </div>
    </div>

    <div class="step-desc-bar" id="stepDesc">
      <span>공격자가 BLE GATT 연결 없이 1,050바이트 비정상 패킷을 btgatt-server 데몬으로 전송 시작.</span>
    </div>

    <div class="stack-preview-bar" id="stackPreview">
      <div class="stack-cell cell-buf"><code>wifi_ssid[500]</code><br><small>데이터 유입 대기</small></div>
      <div class="stack-cell cell-canary"><code>[Canary 보존]</code><br><small>0x8f3c7a10e42d (정상)</small></div>
      <div class="stack-cell cell-sfp"><code>[Saved FP]</code><br><small>0x7fff... (정상 FP)</small></div>
      <div class="stack-cell cell-ret"><code>[Target RIP]</code><br><small>0x5555... (정상 복귀 주소)</small></div>
    </div>

    <svg class="svg-canvas" viewBox="0 0 850 110">
      <defs>
        <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <rect id="nodeAttacker" x="20" y="20" width="160" height="70" rx="8" fill="#1c2541" stroke="#ef4444" stroke-width="2"/>
      <text x="100" y="50" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">🚨 근거리 공격자</text>
      <text x="100" y="70" fill="#94a3b8" font-size="10" text-anchor="middle">1,050B 초과 패킷</text>

      <path id="pathAttack" d="M 180 55 L 340 55" fill="none" class="flow-path attack" stroke-width="3"/>
      <circle id="pAttack" r="6" fill="#ef4444" filter="url(#glowRed)">
        <animateMotion id="animAttack" dur="0.8s" repeatCount="indefinite" path="M 180 55 L 340 55"/>
      </circle>

      <rect id="nodeServer" x="340" y="15" width="220" height="80" rx="8" fill="#1c2541" stroke="#ef4444" stroke-width="2"/>
      <text x="450" y="42" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">⚠️ btgatt-server</text>
      <text id="serverSub1" x="450" y="62" fill="#ef4444" font-size="11" text-anchor="middle">수신 버퍼: 500 Bytes</text>
      <text id="serverSub2" x="450" y="80" fill="#f59e0b" font-size="9" text-anchor="middle">경계 검사 부재</text>

      <path id="pathThreat" d="M 560 55 L 670 55" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

      <rect id="nodeThreat" x="670" y="20" width="160" height="70" rx="8" fill="#1c2541" stroke="#334155" stroke-width="1.5"/>
      <text id="threatTitle" x="750" y="50" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">Locomotion PC</text>
      <text id="threatSub" x="750" y="70" fill="#64748b" font-size="10" text-anchor="middle">정상 대기 상태</text>
    </svg>

    <div class="metric-grid">
      <div class="metric-item">
        <div class="metric-name">초과 바이트</div>
        <div class="metric-val" id="metricBytes">0 / +550 Bytes</div>
      </div>
      <div class="metric-item">
        <div class="metric-name">카나리 상태</div>
        <div class="metric-val" id="metricCanary">VALID (보존)</div>
      </div>
      <div class="metric-item">
        <div class="metric-name">물리적 위협</div>
        <div class="metric-val" id="metricThreat">패킷 유입 시작</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 4;
    let isPlaying = false;
    let playTimer = null;

    const steps = [
      {
        badge: "Step 1/4: 초과 패킷 송신",
        desc: "공격자가 BLE GATT 연결 없이 1,050바이트 비정상 패킷을 btgatt-server 데몬으로 전송 시작.",
        stack: [
          { text: "<code>wifi_ssid[500]</code><br><small>데이터 유입 중...</small>", cls: "cell-buf" },
          { text: "<code>[Canary 보존]</code><br><small>0x8f3c7a10e42d (정상)</small>", cls: "cell-canary" },
          { text: "<code>[Saved FP]</code><br><small>0x7fff... (정상 FP)</small>", cls: "cell-sfp" },
          { text: "<code>[Target RIP]</code><br><small>0x5555... (정상 복귀 주소)</small>", cls: "cell-ret" }
        ],
        serverSub1: "수신 버퍼: 500 Bytes",
        serverSub2: "경계 검사 부재 (취약)",
        threatActive: false,
        metrics: ["0 / +550 Bytes", "VALID (보존)", "패킷 유입 중"]
      },
      {
        badge: "Step 2/4: 500B 버퍼 경계 도달",
        desc: "할당된 스택 버퍼(500B) 용량이 가득 찼으며, 인접 메모리(스택 카나리)로 초과 침범 직전임.",
        stack: [
          { text: "<code>wifi_ssid[500]</code><br><small>500B FULL (한계 도달!)</small>", cls: "cell-warn" },
          { text: "<code>[Canary 보존]</code><br><small>0x8f3c7a10e42d (경계 위험)</small>", cls: "cell-canary" },
          { text: "<code>[Saved FP]</code><br><small>0x7fff... (정상 FP)</small>", cls: "cell-sfp" },
          { text: "<code>[Target RIP]</code><br><small>0x5555... (정상 복귀 주소)</small>", cls: "cell-ret" }
        ],
        serverSub1: "버퍼 한계 도달 (500B)",
        serverSub2: "오버플로우 직전 위험",
        threatActive: false,
        metrics: ["500 / 500 Bytes (FULL)", "VALID (위험)", "버퍼 초과 직전"]
      },
      {
        badge: "Step 3/4: 스택 카나리 슬롯 오염!",
        desc: "+8바이트 오버플로우 발생! 리턴 주소 앞의 64비트 무작위 난수가 공격자의 0x41414141로 덮어써짐.",
        stack: [
          { text: "<code>wifi_ssid[500]</code><br><small>500B 초과 (OVERFLOW)</small>", cls: "cell-danger" },
          { text: "<code>[Canary 오염!]</code><br><small>0x4141414141414141</small>", cls: "cell-danger" },
          { text: "<code>[Saved FP]</code><br><small>0x7fff... (정상 FP)</small>", cls: "cell-sfp" },
          { text: "<code>[Target RIP]</code><br><small>0x5555... (정상 복귀 주소)</small>", cls: "cell-ret" }
        ],
        serverSub1: "초과 쓰기: +8 Bytes",
        serverSub2: "카나리 슬롯 오염 발생!",
        threatActive: false,
        metrics: ["+8 Bytes 초과", "CORRUPTED (오염됨!)", "1차 방어선 침범"]
      },
      {
        badge: "Step 4/4: 리턴 주소(RIP) 덮어쓰기 완료",
        desc: "+550바이트 침범! Saved FP 및 복귀 주소(RIP)가 악성 가젯으로 변조되어 함수 리턴 시 제어권 탈취 위험 노출.",
        stack: [
          { text: "<code>wifi_ssid[500]</code><br><small>1,050B OVERFLOW</small>", cls: "cell-danger" },
          { text: "<code>[Canary 오염!]</code><br><small>0x4141414141414141</small>", cls: "cell-danger" },
          { text: "<code>[Saved FP 변조]</code><br><small>0x4141414141414141</small>", cls: "cell-danger" },
          { text: "<code>[Target RIP 변조]</code><br><small>0xdeadbeef (악성 주소)</small>", cls: "cell-ret-corrupted" }
        ],
        serverSub1: "초과 쓰기: +550 Bytes!",
        serverSub2: "RIP 주소 변조 완료",
        threatActive: true,
        metrics: ["+550 Bytes 초과", "CORRUPTED", "🚨 Locomotion 탈취 위험"]
      }
    ];

    function renderStep(idx) {
      currentStep = idx;
      const s = steps[idx - 1];
      document.getElementById('stepBadge').textContent = s.badge;
      document.getElementById('stepDesc').innerHTML = `<span>${s.desc}</span>`;
      
      const stackContainer = document.getElementById('stackPreview');
      stackContainer.innerHTML = s.stack.map(cell => 
        `<div class="stack-cell ${cell.cls}">${cell.text}</div>`
      ).join('');

      document.getElementById('serverSub1').textContent = s.serverSub1;
      document.getElementById('serverSub2').textContent = s.serverSub2;

      const pathThreat = document.getElementById('pathThreat');
      const nodeThreat = document.getElementById('nodeThreat');
      const threatTitle = document.getElementById('threatTitle');
      const threatSub = document.getElementById('threatSub');

      if (s.threatActive) {
        pathThreat.setAttribute('stroke', '#ef4444');
        pathThreat.style.strokeDasharray = '6 4';
        pathThreat.classList.add('attack');
        nodeThreat.setAttribute('stroke', '#ef4444');
        nodeThreat.setAttribute('stroke-width', '2');
        threatTitle.textContent = '🚨 위협 노출';
        threatTitle.setAttribute('fill', '#ef4444');
        threatSub.textContent = 'Locomotion 제어권 위험';
        threatSub.setAttribute('fill', '#f59e0b');
      } else {
        pathThreat.setAttribute('stroke', '#334155');
        pathThreat.style.strokeDasharray = '4 4';
        pathThreat.classList.remove('attack');
        nodeThreat.setAttribute('stroke', '#334155');
        nodeThreat.setAttribute('stroke-width', '1.5');
        threatTitle.textContent = 'Locomotion PC';
        threatTitle.setAttribute('fill', '#64748b');
        threatSub.textContent = '정상 대기 상태';
        threatSub.setAttribute('fill', '#64748b');
      }

      document.getElementById('metricBytes').textContent = s.metrics[0];
      document.getElementById('metricCanary').textContent = s.metrics[1];
      document.getElementById('metricThreat').textContent = s.metrics[2];

      document.getElementById('prevBtn').disabled = (currentStep === 1);
      document.getElementById('nextBtn').textContent = (currentStep === totalSteps) ? '↺ 처음으로' : '⏭ 다음 스텝';

      reportHeight();
    }

    function nextStep() {
      if (currentStep < totalSteps) {
        renderStep(currentStep + 1);
      } else {
        renderStep(1);
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        renderStep(currentStep - 1);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const playBtn = document.getElementById('playBtn');
      if (isPlaying) {
        playBtn.textContent = '⏸ 정지';
        playBtn.classList.remove('primary');
        playLoop();
      } else {
        playBtn.textContent = '▶ 재생';
        playBtn.classList.add('primary');
        if (playTimer) clearTimeout(playTimer);
      }
    }

    function playLoop() {
      if (!isPlaying) return;
      if (currentStep < totalSteps) {
        renderStep(currentStep + 1);
        playTimer = setTimeout(playLoop, 1600);
      } else {
        playTimer = setTimeout(() => {
          if (!isPlaying) return;
          renderStep(1);
          playTimer = setTimeout(playLoop, 1600);
        }, 2200);
      }
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(reportHeight).observe(document.body);
    }
  </script>
</body>
</html>
