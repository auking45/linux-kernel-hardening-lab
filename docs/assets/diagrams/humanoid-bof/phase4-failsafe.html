<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 4: Fail-Safe State</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"], (prefers-color-scheme: light) {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-green);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-badge {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover:not(:disabled) {
      background: rgba(34, 197, 94, 0.25);
      border-color: var(--accent-green);
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .ctrl-btn.primary {
      background: var(--accent-green);
      color: #0b132b;
      border-color: var(--accent-green);
    }

    [data-theme="light"] .ctrl-btn.primary {
      color: #ffffff;
    }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--accent-green);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      color: var(--text-main);
      line-height: 1.4;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .svg-canvas { width: 100%; height: 110px; display: block; }
    @keyframes flowDash { to { stroke-dashoffset: -48; } }

    .flow-path.safe {
      stroke: var(--accent-green);
      stroke-dasharray: 8 6;
      animation: flowDash 1.2s linear infinite;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .metric-item {
      background: rgba(11, 19, 43, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 5px;
      padding: 5px 8px;
    }
    .metric-name { font-size: 0.68rem; color: var(--text-muted); }
    .metric-val { font-size: 0.82rem; font-weight: 700; color: var(--accent-green); font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div class="badge-title">
        <span>🛡️ Phase 4: 페일세이프 E-Stop 및 로봇 안전 정지</span>
        <span class="step-badge" id="stepBadge">Step 1/3: 통신 이상 감지</span>
      </div>
      <div class="btn-group">
        <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">▶ 재생</button>
        <button class="ctrl-btn" id="prevBtn" onclick="prevStep()" disabled>⏮ 이전</button>
        <button class="ctrl-btn" id="nextBtn" onclick="nextStep()">⏭ 다음 스텝</button>
        <button class="ctrl-btn" id="resetBtn" onclick="resetSim()">↺ 리셋</button>
      </div>
    </div>

    <div class="step-desc-bar" id="stepDesc">
      <span>btgatt-server 프로세스 강제 종료를 하드웨어 세이프티 릴레이 및 커널 워치독이 즉시 감지함.</span>
    </div>

    <svg class="svg-canvas" viewBox="0 0 850 110">
      <defs>
        <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <rect id="nodeRelay" x="20" y="20" width="220" height="70" rx="8" fill="#1c2541" stroke="#22c55e" stroke-width="2"/>
      <text x="130" y="48" fill="#22c55e" font-size="12" font-weight="bold" text-anchor="middle">🛡️ 하드웨어 세이프티 릴레이</text>
      <text id="relaySub" x="130" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">비정상 SIGABRT 감지 완료</text>

      <path id="pathRelay" d="M 240 55 L 420 55" fill="none" class="flow-path safe" stroke-width="2"/>
      <circle id="pRelay" r="5" fill="#22c55e" filter="url(#glowGreen)">
        <animateMotion dur="1.2s" repeatCount="indefinite" path="M 240 55 L 420 55"/>
      </circle>

      <rect id="nodePower" x="420" y="15" width="220" height="80" rx="8" fill="#1c2541" stroke="#334155" stroke-width="1.5"/>
      <text id="powerTitle" x="530" y="42" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">⚡ 모터 드라이버 전원</text>
      <text id="powerSub1" x="530" y="62" fill="#64748b" font-size="11" text-anchor="middle">Power Relay: 대기</text>
      <text id="powerSub2" x="530" y="80" fill="#64748b" font-size="9" text-anchor="middle">차단 신호 대기 중</text>

      <path id="pathLock" d="M 640 55 L 690 55" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

      <rect id="nodeLock" x="690" y="20" width="140" height="70" rx="8" fill="#1c2541" stroke="#334155" stroke-width="1.5"/>
      <text id="lockTitle" x="760" y="48" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">🤖 기구부 록(Lock)</text>
      <text id="lockSub" x="760" y="68" fill="#64748b" font-size="10" text-anchor="middle">정상 동작 중</text>
    </svg>

    <div class="metric-grid">
      <div class="metric-item">
        <div class="metric-name">보안 결과</div>
        <div class="metric-val" id="metricResult">Root 탈취 차단 완료</div>
      </div>
      <div class="metric-item">
        <div class="metric-name">로봇 하드웨어 안전</div>
        <div class="metric-val" id="metricRobot">비정상 감지 (E-Stop 대기)</div>
      </div>
      <div class="metric-item">
        <div class="metric-name">보완 하드닝 권고</div>
        <div class="metric-val" id="metricAdvice" style="color: var(--accent-blue);">_FORTIFY_SOURCE=3</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 3;
    let isPlaying = false;
    let playTimer = null;

    const steps = [
      {
        badge: "Step 1/3: 통신 이상 감지",
        desc: "btgatt-server 프로세스 강제 종료(SIGABRT)를 하드웨어 세이프티 릴레이 및 커널 워치독이 즉시 감지함.",
        relaySub: "비정상 SIGABRT 감지 완료",
        powerActive: false,
        lockActive: false,
        metrics: ["Root 탈취 차단 완료", "이상 감지 (E-Stop 준비)", "_FORTIFY_SOURCE=3"]
      },
      {
        badge: "Step 2/3: 모터 전원 0V 물리 차단",
        desc: "긴급 셧다운 신호가 모터 파워 릴레이를 트리거하여 구동 모터 전원을 0V로 즉각 물리 차단함.",
        relaySub: "긴급 E-Stop 신호 전송 완료",
        powerActive: true,
        lockActive: false,
        metrics: ["Root 탈취 차단 완료", "Power: OFF (0V 차단)", "관절 토크 폭주 방지"]
      },
      {
        badge: "Step 3/3: 페일세이프 록 완료",
        desc: "전 관절 액추에이터가 기계식 브레이크 록(Lock) 상태로 전환되어 넘어짐 없이 로봇이 안전하게 기립 정지함.",
        relaySub: "E-Stop 프로세스 완료",
        powerActive: true,
        lockActive: true,
        metrics: ["Root 권한 탈취 원천 무산", "FAIL-SAFE ENGAGED (기립 록)", "물리 손상 ZERO"]
      }
    ];

    function renderStep(idx) {
      currentStep = idx;
      const s = steps[idx - 1];
      document.getElementById('stepBadge').textContent = s.badge;
      document.getElementById('stepDesc').innerHTML = `<span>${s.desc}</span>`;
      document.getElementById('relaySub').textContent = s.relaySub;

      const pathRelay = document.getElementById('pathRelay');
      const pRelay = document.getElementById('pRelay');
      const nodePower = document.getElementById('nodePower');
      const powerTitle = document.getElementById('powerTitle');
      const powerSub1 = document.getElementById('powerSub1');
      const powerSub2 = document.getElementById('powerSub2');
      const pathLock = document.getElementById('pathLock');
      const nodeLock = document.getElementById('nodeLock');
      const lockTitle = document.getElementById('lockTitle');
      const lockSub = document.getElementById('lockSub');

      if (s.powerActive) {
        nodePower.setAttribute('stroke', '#22c55e');
        nodePower.setAttribute('stroke-width', '2');
        powerTitle.setAttribute('fill', '#22c55e');
        powerSub1.textContent = 'Power Relay: OFF (0V)';
        powerSub1.setAttribute('fill', '#f8fafc');
        powerSub2.textContent = '관절 모터 구동 차단';
        powerSub2.setAttribute('fill', '#22c55e');
      } else {
        nodePower.setAttribute('stroke', '#334155');
        nodePower.setAttribute('stroke-width', '1.5');
        powerTitle.setAttribute('fill', '#64748b');
        powerSub1.textContent = 'Power Relay: 대기';
        powerSub1.setAttribute('fill', '#64748b');
        powerSub2.textContent = '차단 신호 대기 중';
        powerSub2.setAttribute('fill', '#64748b');
      }

      if (s.lockActive) {
        pathLock.setAttribute('stroke', '#22c55e');
        pathLock.classList.add('safe');
        nodeLock.setAttribute('stroke', '#22c55e');
        nodeLock.setAttribute('stroke-width', '2');
        lockTitle.setAttribute('fill', '#22c55e');
        lockSub.textContent = '기구부 기립 록 (안전)';
        lockSub.setAttribute('fill', '#22c55e');
      } else {
        pathLock.setAttribute('stroke', '#334155');
        pathLock.classList.remove('safe');
        nodeLock.setAttribute('stroke', '#334155');
        nodeLock.setAttribute('stroke-width', '1.5');
        lockTitle.setAttribute('fill', '#64748b');
        lockSub.textContent = '정상 동작 중';
        lockSub.setAttribute('fill', '#64748b');
      }

      document.getElementById('metricResult').textContent = s.metrics[0];
      document.getElementById('metricRobot').textContent = s.metrics[1];
      document.getElementById('metricAdvice').textContent = s.metrics[2];

      document.getElementById('prevBtn').disabled = (currentStep === 1);
      document.getElementById('nextBtn').textContent = (currentStep === totalSteps) ? '↺ 처음으로' : '⏭ 다음 스텝';

      reportHeight();
    }

    function nextStep() {
      if (currentStep < totalSteps) {
        renderStep(currentStep + 1);
      } else {
        renderStep(1);
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        renderStep(currentStep - 1);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const playBtn = document.getElementById('playBtn');
      if (isPlaying) {
        playBtn.textContent = '⏸ 정지';
        playBtn.classList.remove('primary');
        playLoop();
      } else {
        playBtn.textContent = '▶ 재생';
        playBtn.classList.add('primary');
        if (playTimer) clearTimeout(playTimer);
      }
    }

    function playLoop() {
      if (!isPlaying) return;
      if (currentStep < totalSteps) {
        renderStep(currentStep + 1);
        playTimer = setTimeout(playLoop, 1600);
      } else {
        playTimer = setTimeout(() => {
          if (!isPlaying) return;
          renderStep(1);
          playTimer = setTimeout(playLoop, 1600);
        }, 2200);
      }
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(reportHeight).observe(document.body);
    }
  </script>
</body>
</html>
