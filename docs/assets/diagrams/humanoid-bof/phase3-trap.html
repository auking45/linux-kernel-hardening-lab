<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 3: Canary Trap Detonation</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"], (prefers-color-scheme: light) {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-yellow);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-badge {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .ctrl-btn {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ctrl-btn:hover:not(:disabled) {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--accent-yellow);
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .ctrl-btn.primary {
      background: var(--accent-yellow);
      color: #0b132b;
      border-color: var(--accent-yellow);
    }

    [data-theme="light"] .ctrl-btn.primary {
      color: #ffffff;
    }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--accent-yellow);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      color: var(--text-main);
      line-height: 1.4;
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .svg-canvas { width: 100%; height: 110px; display: block; }
    @keyframes flowDash { to { stroke-dashoffset: -48; } }

    .flow-path.intercept {
      stroke: var(--accent-yellow);
      stroke-dasharray: 6 4;
      animation: flowDash 0.6s linear infinite;
    }

    @keyframes rippleExpand {
      0% { r: 6px; opacity: 1; }
      100% { r: 36px; opacity: 0; }
    }
    .trap-ripple {
      animation: rippleExpand 1.4s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .metric-item {
      background: rgba(11, 19, 43, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 5px;
      padding: 5px 8px;
    }
    .metric-name { font-size: 0.68rem; color: var(--text-muted); }
    .metric-val { font-size: 0.82rem; font-weight: 700; color: var(--accent-yellow); font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div class="badge-title">
        <span>⛔ Phase 3: 스택 카나리 검증 차단 (Canary Trap Detonation)</span>
        <span class="step-badge" id="stepBadge">Step 1/3: 에필로그 검증 시작</span>
      </div>
      <div class="btn-group">
        <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">▶ 재생</button>
        <button class="ctrl-btn" id="prevBtn" onclick="prevStep()" disabled>⏮ 이전</button>
        <button class="ctrl-btn" id="nextBtn" onclick="nextStep()">⏭ 다음 스텝</button>
        <button class="ctrl-btn" id="resetBtn" onclick="resetSim()">↺ 리셋</button>
      </div>
    </div>

    <div class="step-desc-bar" id="stepDesc">
      <span>함수 반환(ret) 직전, 스택에 저장된 카나리 값을 로드하여 마스터 가드(%gs:40)와 비교 준비.</span>
    </div>

    <svg class="svg-canvas" viewBox="0 0 850 110">
      <rect id="nodeCheck" x="20" y="20" width="220" height="70" rx="8" fill="#1c2541" stroke="#38bdf8" stroke-width="2"/>
      <text x="130" y="48" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">🔍 에필로그 카나리 검증</text>
      <text id="checkSub" x="130" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">Stack[Canary] 로드 진행 중</text>

      <path id="pathIntercept" d="M 240 55 L 420 55" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4"/>

      <!-- Mismatch Intercept Point -->
      <circle id="nodeBarrier" cx="420" cy="55" r="14" fill="#1c2541" stroke="#334155" stroke-width="2"/>
      <text id="barrierIcon" x="420" y="60" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">대기</text>

      <path id="pathDetonation" d="M 434 55 L 610 55" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Trap Handler Node -->
      <rect id="nodePanic" x="610" y="15" width="220" height="80" rx="8" fill="#1c2541" stroke="#334155" stroke-width="1.5"/>
      <text id="panicTitle" x="720" y="44" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">__stack_chk_fail() 대기</text>
      <text id="panicSub1" x="720" y="62" fill="#64748b" font-size="10" text-anchor="middle">리턴 주소 분기 검사 중</text>
      <text id="panicSub2" x="720" y="78" fill="#64748b" font-size="9" text-anchor="middle">정상 동작 시 대기</text>

      <circle id="rip1" cx="610" cy="55" r="8" fill="none" stroke="#f59e0b" stroke-width="2" class="trap-ripple" style="display: none;"/>
      <circle id="rip2" cx="610" cy="55" r="14" fill="none" stroke="#ef4444" stroke-width="2" class="trap-ripple" style="display: none; animation-delay: 0.4s;"/>
    </svg>

    <div class="metric-grid">
      <div class="metric-item">
        <div class="metric-name">검증 연산</div>
        <div class="metric-val" id="metricOp">LOAD (%rsp, Canary)</div>
      </div>
      <div class="metric-item">
        <div class="metric-name">예외 처리 핸들러</div>
        <div class="metric-val" id="metricHandler">대기 상태</div>
      </div>
      <div class="metric-item">
        <div class="metric-name">하이재킹 저지율</div>
        <div class="metric-val" id="metricRate">검증 진행 중</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 3;
    let isPlaying = false;
    let playTimer = null;

    const steps = [
      {
        badge: "Step 1/3: 에필로그 검증 시작",
        desc: "함수 반환(ret) 직전, 스택에 저장된 카나리 값을 로드하여 마스터 가드(%gs:40)와 비교 준비.",
        checkSub: "Stack[Canary] 로드 진행 중",
        barrierState: "ready",
        panicActive: false,
        metrics: ["LOAD (%rsp, Canary)", "대기 상태", "검증 진행 중"]
      },
      {
        badge: "Step 2/3: XOR 불일치 감지!",
        desc: "XOR (%gs:40, Canary) != 0 감지! 카나리가 0x4141...로 오염되어 불일치가 발생, 즉시 jne 트랩 분기 발동.",
        checkSub: "불일치 감지! (MISMATCH)",
        barrierState: "blocked",
        panicActive: false,
        metrics: ["XOR != 0 (불일치!)", "트랩 핸들러 분기", "침투 가로챔"]
      },
      {
        badge: "Step 3/3: __stack_chk_fail 트랩 발동",
        desc: "악성 RIP로의 반환(ret)을 100% 원천 차단하고 __stack_chk_fail()을 호출하여 프로세스를 즉시 패닉 종료함.",
        checkSub: "불일치 감지 (차단 완료)",
        barrierState: "blocked",
        panicActive: true,
        metrics: ["XOR Mismatch", "__stack_chk_fail (Panic)", "100% 원천 봉쇄"]
      }
    ];

    function renderStep(idx) {
      currentStep = idx;
      const s = steps[idx - 1];
      document.getElementById('stepBadge').textContent = s.badge;
      document.getElementById('stepDesc').innerHTML = `<span>${s.desc}</span>`;
      document.getElementById('checkSub').textContent = s.checkSub;

      const pathIntercept = document.getElementById('pathIntercept');
      const nodeBarrier = document.getElementById('nodeBarrier');
      const barrierIcon = document.getElementById('barrierIcon');
      const pathDetonation = document.getElementById('pathDetonation');
      const nodePanic = document.getElementById('nodePanic');
      const panicTitle = document.getElementById('panicTitle');
      const panicSub1 = document.getElementById('panicSub1');
      const panicSub2 = document.getElementById('panicSub2');
      const rip1 = document.getElementById('rip1');
      const rip2 = document.getElementById('rip2');

      if (s.barrierState === 'blocked') {
        pathIntercept.setAttribute('stroke', '#f59e0b');
        pathIntercept.classList.add('intercept');
        nodeBarrier.setAttribute('stroke', '#ef4444');
        nodeBarrier.setAttribute('fill', '#ef4444');
        barrierIcon.textContent = '⛔';
        barrierIcon.setAttribute('fill', '#ffffff');
      } else {
        pathIntercept.setAttribute('stroke', '#334155');
        pathIntercept.classList.remove('intercept');
        nodeBarrier.setAttribute('stroke', '#334155');
        nodeBarrier.setAttribute('fill', '#1c2541');
        barrierIcon.textContent = '대기';
        barrierIcon.setAttribute('fill', '#64748b');
      }

      if (s.panicActive) {
        pathDetonation.setAttribute('stroke', '#ef4444');
        pathDetonation.setAttribute('stroke-width', '3');
        nodePanic.setAttribute('stroke', '#ef4444');
        nodePanic.setAttribute('stroke-width', '2');
        panicTitle.textContent = '🚨 __stack_chk_fail() 즉시 호출';
        panicTitle.setAttribute('fill', '#ef4444');
        panicSub1.textContent = '리턴 주소 분기 원천 차단 완료';
        panicSub1.setAttribute('fill', '#f59e0b');
        panicSub2.textContent = '임의 코드 실행 0% 저지 성공';
        panicSub2.setAttribute('fill', '#22c55e');
        rip1.style.display = 'block';
        rip2.style.display = 'block';
      } else {
        pathDetonation.setAttribute('stroke', '#334155');
        pathDetonation.setAttribute('stroke-width', '2');
        nodePanic.setAttribute('stroke', '#334155');
        nodePanic.setAttribute('stroke-width', '1.5');
        panicTitle.textContent = '__stack_chk_fail() 대기';
        panicTitle.setAttribute('fill', '#64748b');
        panicSub1.textContent = '리턴 주소 분기 검사 중';
        panicSub1.setAttribute('fill', '#64748b');
        panicSub2.textContent = '정상 동작 시 대기';
        panicSub2.setAttribute('fill', '#64748b');
        rip1.style.display = 'none';
        rip2.style.display = 'none';
      }

      document.getElementById('metricOp').textContent = s.metrics[0];
      document.getElementById('metricHandler').textContent = s.metrics[1];
      document.getElementById('metricRate').textContent = s.metrics[2];

      document.getElementById('prevBtn').disabled = (currentStep === 1);
      document.getElementById('nextBtn').textContent = (currentStep === totalSteps) ? '↺ 처음으로' : '⏭ 다음 스텝';

      reportHeight();
    }

    function nextStep() {
      if (currentStep < totalSteps) {
        renderStep(currentStep + 1);
      } else {
        renderStep(1);
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        renderStep(currentStep - 1);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const playBtn = document.getElementById('playBtn');
      if (isPlaying) {
        playBtn.textContent = '⏸ 정지';
        playBtn.classList.remove('primary');
        playLoop();
      } else {
        playBtn.textContent = '▶ 재생';
        playBtn.classList.add('primary');
        if (playTimer) clearTimeout(playTimer);
      }
    }

    function playLoop() {
      if (!isPlaying) return;
      if (currentStep < totalSteps) {
        renderStep(currentStep + 1);
        playTimer = setTimeout(playLoop, 1600);
      } else {
        playTimer = setTimeout(() => {
          if (!isPlaying) return;
          renderStep(1);
          playTimer = setTimeout(playLoop, 1600);
        }, 2200);
      }
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) {
      new ResizeObserver(reportHeight).observe(document.body);
    }
  </script>
</body>
</html>
