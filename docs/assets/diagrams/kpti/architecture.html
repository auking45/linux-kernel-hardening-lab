<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPTI (Kernel Page Table Isolation) & Meltdown Mitigation Architecture</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --accent-yellow: #eab308;
      --perm-user: #f97316;
      --perm-kernel: #38bdf8;
      --perm-block: #ef4444;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-purple: #9333ea;
      --accent-yellow: #ca8a04;
      --perm-user: #ea580c;
      --perm-kernel: #0284c7;
      --perm-block: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: rgba(56, 189, 248, 0.2);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent-blue);
    }

    .scenario-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-blue);
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .view-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .view-container {
        grid-template-columns: 1fr;
      }
    }

    .diagram-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      min-height: 540px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .info-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .info-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-blue);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    .info-desc {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .metric-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      font-family: monospace;
    }

    .mem-layout {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ring-box {
      border: 2px dashed var(--card-border);
      border-radius: 10px;
      padding: 16px;
      position: relative;
      transition: all 0.3s;
    }

    .ring-box.kernel {
      background: rgba(56, 189, 248, 0.05);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .ring-box.user {
      background: rgba(249, 115, 22, 0.05);
      border-color: rgba(249, 115, 22, 0.4);
    }

    .ring-box.tramp {
      background: rgba(168, 85, 247, 0.05);
      border-color: rgba(168, 85, 247, 0.4);
    }

    .ring-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ring-box.kernel .ring-label { color: var(--accent-blue); }
    .ring-box.user .ring-label { color: var(--perm-user); }
    .ring-box.tramp .ring-label { color: var(--accent-purple); }

    .block-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      transition: all 0.25s;
    }

    .block-title {
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .block-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .block.danger {
      border-color: var(--accent-red);
      background: rgba(239, 68, 68, 0.12);
    }

    .block.safe {
      border-color: var(--accent-green);
      background: rgba(34, 197, 94, 0.12);
    }

    .block.warning {
      border-color: var(--accent-yellow);
      background: rgba(234, 179, 8, 0.12);
    }

    .block.highlight {
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .arrow-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.8rem;
    }

    .arrow-line {
      height: 2px;
      flex-grow: 1;
      background: var(--card-border);
    }

    .arrow-text {
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      font-family: monospace;
      font-size: 0.75rem;
    }

    .arrow-text.danger {
      color: var(--accent-red);
      border-color: var(--accent-red);
    }

    .arrow-text.safe {
      color: var(--accent-green);
      border-color: var(--accent-green);
    }

    .tag {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 700;
    }

    .tag.user { background: rgba(249, 115, 22, 0.2); color: var(--perm-user); }
    .tag.kernel { background: rgba(56, 189, 248, 0.2); color: var(--accent-blue); }
    .tag.blocked { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
    .tag.allowed { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
    .tag.tramp { background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        KPTI & Meltdown Mitigation
        <span class="badge">Kernel Hardening Lab</span>
      </h1>
      <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">☀️ 라이트 모드</button>
    </header>

    <div class="scenario-tabs">
      <button class="tab-btn active" onclick="setScenario(1)">1. 통합 페이지 테이블 (Pre-KPTI 취약 구조)</button>
      <button class="tab-btn" onclick="setScenario(2)">2. Meltdown 투기적 캐시 사이드채널 공격</button>
      <button class="tab-btn" onclick="setScenario(3)">3. KPTI 분리 페이지 테이블 방어 아키텍처</button>
      <button class="tab-btn" onclick="setScenario(4)">4. 컨텍스트 스위칭 & 하드웨어 CR3/TTBR 전환</button>
    </div>

    <div class="view-container">
      <div class="diagram-panel" id="diagram-content">
        <!-- Injected via JavaScript -->
      </div>

      <div class="info-panel">
        <div class="info-title" id="info-title">시나리오 정보</div>
        <div class="info-desc" id="info-desc">시나리오 설명 로딩 중...</div>

        <div class="metric-box">
          <div class="metric-label">커널 페이지 테이블 격리 상태</div>
          <div class="metric-val" id="metric-isolation">-</div>
        </div>

        <div class="metric-box">
          <div class="metric-label">Meltdown 취약성 평가 (Sysfs)</div>
          <div class="metric-val" id="metric-meltdown">-</div>
        </div>

        <div class="metric-box">
          <div class="metric-label">하드웨어 제어 레지스터 (CR3 / TTBR)</div>
          <div class="metric-val" id="metric-register">-</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const scenarios = {
      1: {
        title: "통합 페이지 테이블 (Pre-KPTI 취약 구조)",
        desc: "KPTI가 적용되기 전 전통적인 리눅스 가상 메모리 모델에서는 유저 프로세스가 실행 중일 때도 동일한 PGD(페이지 글로벌 디렉터리) 내에 커널 코드와 데이터(0xffff8000...) 전체가 물리적으로 매핑되어 있었습니다. 비록 페이지 테이블 엔트리(PTE)의 User/Supervisor 플래그가 '0'(Supervisor 전용)으로 설정되어 일반 실행에서는 차단되지만, MMU 매핑 자체는 상주하여 하드웨어 분기 예측 및 투기적 실행의 직접적 공격 표면이 되었습니다.",
        isolation: "UNIFIED (통합 공유 테이블)",
        meltdown: "Vulnerable (Meltdown 탈취 위험 노출)",
        register: "Single CR3 / Shared TTBR0/1",
        render: `
          <div class="mem-layout">
            <div class="ring-box kernel">
              <div class="ring-label">
                <span>🛡️ 커널 주소 공간 (Kernel Space, 0xffff...)</span>
                <span class="tag kernel">Supervisor Ring 0 / EL1</span>
              </div>
              <div class="block-grid">
                <div class="block danger">
                  <div class="block-title">커널 텍스트 & 시스템 콜 <span class="tag blocked">U=0 (Kernel)</span></div>
                  <div class="block-sub">0xffffffff81000000 (vmlinux code)</div>
                </div>
                <div class="block danger">
                  <div class="block-title">기밀 데이터 & cred 구조체 <span class="tag blocked">U=0 (Secret)</span></div>
                  <div class="block-sub">0xffff8880... (KPTI_SECRET_DATA)</div>
                </div>
              </div>
            </div>

            <div class="arrow-container">
              <div class="arrow-line"></div>
              <div class="arrow-text danger">단일 PGD 공유 (동일한 CR3 가상 주소 공간에 완전 매핑)</div>
              <div class="arrow-line"></div>
            </div>

            <div class="ring-box user">
              <div class="ring-label">
                <span>👤 유저 주소 공간 (User Space, 0x0000...)</span>
                <span class="tag user">Ring 3 / EL0</span>
              </div>
              <div class="block-grid">
                <div class="block warning">
                  <div class="block-title">유저 프로세스 코드 & 스택 <span class="tag user">U=1 (User RWX)</span></div>
                  <div class="block-sub">0x00007f... (libc / application)</div>
                </div>
                <div class="block warning">
                  <div class="block-title">공격자 프로브 버퍼 <span class="tag user">U=1 (Probe Array)</span></div>
                  <div class="block-sub">0x00007f... (256 * 4096 bytes)</div>
                </div>
              </div>
            </div>
          </div>
        `
      },
      2: {
        title: "Meltdown 투기적 캐시 사이드채널 공격 (CVE-2017-5754)",
        desc: "CPU의 고성능 파이프라인은 명령어 의존성을 해결하기 위해 예외 발생 여부와 관계없이 명령어들을 투기적으로(out-of-order) 선행 실행합니다. 공격자 코드가 유저 모드에서 커널 기밀 주소를 직접 역참조하면, MMU 권한 예외(#PF)가 커밋되기 전에 CPU가 기밀 바이트를 읽어와 유저 배열의 인덱스로 참조(L1D 캐시 라인 로드)합니다. 예외 발생 후 파이프라인은 롤백되지만 L1D 캐시 상태는 보존되며, 공격자는 Flush+Reload 시간 측정으로 커널 기밀을 바이트 단위로 복원합니다.",
        isolation: "BYPASSED (투기적 권한 검사 우회)",
        meltdown: "EXPLOITED (L1D Cache Timing Leak)",
        register: "CR3 Kernel Mappings Present",
        render: `
          <div class="mem-layout">
            <div class="ring-box kernel">
              <div class="ring-label">
                <span>🎯 공격 타깃: 커널 기밀 메모리 (0xffff...)</span>
                <span class="tag blocked">U=0 Privileged</span>
              </div>
              <div class="block danger highlight">
                <div class="block-title">Secret Byte = *(kernel_ptr) <span class="tag blocked">Rogue Data Load</span></div>
                <div class="block-sub">비순차 투기적 실행으로 CPU 내부 레지스터에 일시 로드됨</div>
              </div>
            </div>

            <div class="arrow-container">
              <div class="arrow-line"></div>
              <div class="arrow-text danger">⚡ Transient Execution: probe_array[secret_byte * 4096] 로드</div>
              <div class="arrow-line"></div>
            </div>

            <div class="ring-box user">
              <div class="ring-label">
                <span>🕵️ 유저 공격자 프로세스 (Meltdown Exploit)</span>
                <span class="tag user">Ring 3 / EL0</span>
              </div>
              <div class="block-grid">
                <div class="block danger">
                  <div class="block-title">1. Flush+Reload 프로브 배열</div>
                  <div class="block-sub">특정 오프셋(secret * 4096) 캐시 라인만 Warm 상태로 변환</div>
                </div>
                <div class="block safe">
                  <div class="block-title">2. 캐시 타이밍 측정 (RDTSC)</div>
                  <div class="block-sub">접근 시간 &lt; 80 사이클인 인덱스 = 유출된 커널 바이트</div>
                </div>
              </div>
            </div>
          </div>
        `
      },
      3: {
        title: "KPTI 분리 페이지 테이블 방어 아키텍처",
        desc: "KPTI(Kernel Page Table Isolation)는 근본적인 하드웨어 격리를 달성하기 위해 각 프로세스마다 두 개의 완전 분리된 PGD를 유지합니다. 유저 모드 PGD(CR3 bit 12=1)에서는 유저 공간 매핑과 유저 모드로 복귀/진입하기 위한 최소한의 트램펄린(IDT, Entry Stubs)만 남기고 나머지 모든 커널 매핑을 완전히 언매핑(Unmapped / Not-Present)합니다. 투기적 실행이 발생하더라도 페이지 테이블에 물리 주소 변환 엔트리 자체가 없으므로 데이터 로드 자체가 불가능해집니다.",
        isolation: "ISOLATED (완전 분리된 듀얼 PGD)",
        meltdown: "Mitigation: PTI (물리적 원천 차단)",
        register: "Dual CR3 (User PGD vs Kernel PGD)",
        render: `
          <div class="mem-layout">
            <div class="ring-box kernel">
              <div class="ring-label">
                <span>👑 커널 모드 전용 PGD (CR3 bit 12 = 0 / swapper_pg_dir)</span>
                <span class="tag kernel">커널 실행 시에만 활성화</span>
              </div>
              <div class="block-grid">
                <div class="block safe">
                  <div class="block-title">완전한 커널 공간 (전체 메모리) <span class="tag allowed">Full Kernel PGD</span></div>
                  <div class="block-sub">시스템 콜 및 인터럽트 처리기에서만 CR3 전환 후 접근</div>
                </div>
                <div class="block safe">
                  <div class="block-title">유저 프로세스 가상 메모리 <span class="tag user">User Space Mappings</span></div>
                  <div class="block-sub">유저 카피(copy_to/from_user) 지원용 매핑 유지</div>
                </div>
              </div>
            </div>

            <div class="arrow-container">
              <div class="arrow-line"></div>
              <div class="arrow-text safe">🛡️ 완전 격리 경계 (유저 모드 PGD에는 커널 엔트리가 아예 없음)</div>
              <div class="arrow-line"></div>
            </div>

            <div class="ring-box user">
              <div class="ring-label">
                <span>👤 유저 모드 PGD (CR3 bit 12 = 1 / Trampoline Vectors)</span>
                <span class="tag user">유저 코드 실행 시 활성화</span>
              </div>
              <div class="block-grid">
                <div class="block warning">
                  <div class="block-title">유저 메모리 (바이너리/힙/스택) <span class="tag allowed">User Mappings</span></div>
                  <div class="block-sub">프로세스 고유 주소 공간 정상 작동</div>
                </div>
                <div class="block tramp">
                  <div class="block-title">최소 트램펄린 진입 코드 <span class="tag tramp">Trampoline Only</span></div>
                  <div class="block-sub">커널 진입을 위한 SYSCALL/IDT 스텁만 유일하게 노출</div>
                </div>
              </div>
            </div>
          </div>
        `
      },
      4: {
        title: "컨텍스트 스위칭 & 하드웨어 CR3/TTBR 전환 (성능 및 PCID)",
        desc: "유저 공간과 커널 공간 간의 모든 시스템 콜(SYSCALL / SYSRET), 인터럽트, 예외 진입 시 CPU는 트램펄린 벡터를 통해 CR3 레지스터의 12번 비트(PTI_USER_PGTABLE_BIT, 4096바이트 오프셋)를 반전시켜 페이지 테이블을 전환합니다. 과거에는 CR3 변경 시 TLB가 전면 플러시되어 5~30% 성능 저하가 발생했으나, 하드웨어 PCID(Process Context Identifiers) 및 ARM64 ASID 태깅을 접목하여 TLB 무효화 없이 마이크로초 단위의 제로에 가까운 오버헤드로 전환할 수 있습니다.",
        isolation: "ISOLATED + PCID (하드웨어 고속 전환)",
        meltdown: "Mitigation: PTI (PCID 가속 적용)",
        register: "CR3 Flip Bit 12 (0x1000) / TTBR1 Tramp",
        render: `
          <div class="mem-layout">
            <div class="ring-box kernel">
              <div class="ring-label">
                <span>⚙️ 커널 공간 진입 (Ring 3 ➔ Ring 0 / EL0 ➔ EL1)</span>
                <span class="tag kernel">SWITCH_TO_KERNEL_CR3</span>
              </div>
              <div class="block-grid">
                <div class="block safe">
                  <div class="block-title">1. 트램펄린 진입 스텁 실행</div>
                  <div class="block-sub">IDT / SYSCALL 진입 벡터 (유저 PGD에 유일하게 매핑됨)</div>
                </div>
                <div class="block safe">
                  <div class="block-title">2. CR3 레지스터 갱신</div>
                  <div class="block-sub">btr $12, %cr3 (커널 PGD 활성화, 커널 전체 주소 공간 복원)</div>
                </div>
              </div>
            </div>

            <div class="arrow-container">
              <div class="arrow-line"></div>
              <div class="arrow-text safe">PCID/ASID 유지 (TLB Flush 최소화로 성능 오버헤드 1~2%로 억제)</div>
              <div class="arrow-line"></div>
            </div>

            <div class="ring-box user">
              <div class="ring-label">
                <span>🔄 유저 공간 복귀 (Ring 0 ➔ Ring 3 / EL1 ➔ EL0)</span>
                <span class="tag user">SWITCH_TO_USER_CR3</span>
              </div>
              <div class="block-grid">
                <div class="block warning">
                  <div class="block-title">3. CR3 레지스터 유저 반전</div>
                  <div class="block-sub">bts $12, %cr3 (유저 PGD로 전환, 커널 매핑 즉시 소멸)</div>

                <div class="block warning">
                  <div class="block-title">4. SYSRET / ERET 유저 복귀</div>
                  <div class="block-sub">유저 공간에서는 커널 기밀 메모리에 절대 도달 불가</div>
                </div>
              </div>
            </div>
          </div>
        `
      }
    };

    let currentScenario = 1;
    let isLight = false;

    function renderScenario() {
      const data = scenarios[currentScenario];
      document.getElementById('diagram-content').innerHTML = data.render;
      document.getElementById('info-title').textContent = data.title;
      document.getElementById('info-desc').textContent = data.desc;
      document.getElementById('metric-isolation').textContent = data.isolation;
      document.getElementById('metric-meltdown').textContent = data.meltdown;
      document.getElementById('metric-register').textContent = data.register;

      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        if (idx + 1 === currentScenario) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function setScenario(num) {
      currentScenario = num;
      renderScenario();
    }

    function toggleTheme() {
      isLight = !isLight;
      if (isLight) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('theme-btn').textContent = '🌙 다크 모드';
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('theme-btn').textContent = '☀️ 라이트 모드';
      }
    }

    // Initial render
    renderScenario();
  </script>
</body>
</html>
