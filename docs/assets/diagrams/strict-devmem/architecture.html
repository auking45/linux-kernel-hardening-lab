<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Strict Devmem Architecture Simulator</title>
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-card: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
    --accent-blue: #38bdf8;
    --accent-green: #34d399;
    --accent-red: #f87171;
    --accent-amber: #fbbf24;
    --accent-purple: #c084fc;
    --token-fill: #38bdf8;
    --led-glow: rgba(52, 211, 153, 0.6);
  }

  body.light-mode {
    --bg-primary: #f8fafc;
    --bg-card: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --border-color: #cbd5e1;
    --accent-blue: #0284c7;
    --accent-green: #059669;
    --accent-red: #dc2626;
    --accent-amber: #d97706;
    --accent-purple: #7c3aed;
    --token-fill: #0284c7;
    --led-glow: rgba(5, 150, 105, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 100vh;
  }

  .sim-container {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
  }

  .sim-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sim-title {
    font-size: 1.15rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .led-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: var(--accent-green);
    box-shadow: 0 0 10px var(--led-glow);
    transition: background-color 0.3s, box-shadow 0.3s;
  }
  .led-indicator.permissive {
    background-color: var(--accent-amber);
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
  }
  .led-indicator.violation {
    background-color: var(--accent-red);
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.8);
  }

  .sim-toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
  }

  .btn {
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn:hover {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .btn.active {
    background: var(--accent-blue);
    color: #ffffff;
    border-color: var(--accent-blue);
  }

  .status-bar {
    font-family: monospace;
    font-size: 0.85rem;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 10px 14px;
    margin-top: 12px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .svg-box {
    fill: var(--bg-primary);
    stroke: var(--border-color);
    stroke-width: 1.5;
    rx: 8;
  }
  .svg-text-title {
    fill: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
  }
  .svg-text-desc {
    fill: var(--text-secondary);
    font-size: 11px;
    font-family: monospace;
  }

  #token {
    fill: var(--token-fill);
    filter: drop-shadow(0 0 6px var(--accent-blue));
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
</style>
</head>
<body>

<div class="sim-container">
  <div class="sim-header">
    <div class="sim-title">
      <div id="led" class="led-indicator"></div>
      Linux Strict Devmem & Strict I/O Devmem Architecture Simulator
    </div>
    <div style="font-family:monospace; font-size:0.8rem; color:var(--text-secondary);">
      CONFIG_STRICT_DEVMEM=y & CONFIG_IO_STRICT_DEVMEM=y
    </div>
  </div>

  <div class="sim-toolbar">
    <button id="btn-target-ram" class="btn active" onclick="selectScenario('ram')">Physical System RAM</button>
    <button id="btn-target-io" class="btn" onclick="selectScenario('io')">Active Driver MMIO</button>
    <button id="btn-target-rom" class="btn" onclick="selectScenario('rom')">Legacy ROM / VGA</button>
    <div style="flex-grow:1;"></div>
    <button id="btn-mode" class="btn" onclick="cycleMode()">Mode: Strict RAM + I/O (2)</button>
    <button id="btn-step" class="btn" onclick="stepSimulation()">Next Step ⏭</button>
    <button id="btn-play" class="btn" onclick="togglePlay()">Auto Play ▶</button>
    <button id="btn-reset" class="btn" onclick="resetSimulation()">Reset ↺</button>
    <button class="btn" onclick="toggleTheme()">Theme 🌓</button>
  </div>

  <svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--text-secondary)"/>
      </marker>
    </defs>

    <!-- Column 1: Userspace /dev/mem Request -->
    <g id="col-user">
      <rect x="20" y="20" width="220" height="340" fill="none" stroke="var(--border-color)" stroke-dasharray="4" rx="8"/>
      <text class="svg-text-title" x="35" y="45">Userspace /dev/mem Access</text>

      <!-- System RAM Target -->
      <g id="box-target-ram" transform="translate(30, 60)">
        <rect class="svg-box" width="200" height="75"/>
        <text class="svg-text-title" x="12" y="24">Target: System RAM</text>
        <text class="svg-text-desc" x="12" y="44">Phys: 0x40000000 - 0x7fffffff</text>
        <text class="svg-text-desc" x="12" y="62" fill="var(--accent-red)">Kernel text, creds, page tables</text>
      </g>

      <!-- Active Driver MMIO Target -->
      <g id="box-target-io" transform="translate(30, 155)">
        <rect class="svg-box" width="200" height="85"/>
        <text class="svg-text-title" x="12" y="24">Target: Claimed Driver MMIO</text>
        <text class="svg-text-desc" x="12" y="44">PCI BARs / NVMe DMA</text>
        <text class="svg-text-desc" x="12" y="60">Claimed by active kernel driver</text>
        <text class="svg-text-desc" x="12" y="76" fill="var(--accent-amber)">High DMA hijacking risk</text>
      </g>

      <!-- Legacy ROM Target -->
      <g id="box-target-rom" transform="translate(30, 260)">
        <rect class="svg-box" width="200" height="85"/>
        <text class="svg-text-title" x="12" y="24">Target: Unclaimed ROM</text>
        <text class="svg-text-desc" x="12" y="44">BIOS ROM / VGA 0xa0000</text>
        <text class="svg-text-desc" x="12" y="60">Not claimed by drivers</text>
        <text class="svg-text-desc" x="12" y="76" fill="var(--accent-green)">Legacy X.org / Display access</text>
      </g>
    </g>

    <!-- Column 2: Kernel Physical Memory Gatekeeper -->
    <g id="col-kernel" transform="translate(280, 20)">
      <rect class="svg-box" width="300" height="340"/>
      <text class="svg-text-title" x="20" y="32">Kernel Physical Memory Filter</text>
      <text id="svg-mode-text" class="svg-text-desc" x="20" y="52" fill="var(--accent-blue)">
        CONFIG_STRICT_DEVMEM=y & IO_STRICT=y
      </text>

      <!-- devmem_is_allowed -->
      <g transform="translate(15, 70)">
        <rect width="270" height="110" fill="var(--bg-card)" stroke="var(--border-color)" rx="6"/>
        <text class="svg-text-title" x="15" y="28">devmem_is_allowed(pfn)</text>
        <text class="svg-text-desc" x="15" y="50">Checks page against /proc/iomem</text>
        <text class="svg-text-desc" x="15" y="70">If PFN in System RAM -> return 0</text>
        <text class="svg-text-desc" x="15" y="90" fill="var(--accent-purple)">Prevents Ring 0 memory exposure</text>
      </g>

      <!-- devmem_is_unconsumed -->
      <g transform="translate(15, 200)">
        <rect width="270" height="120" fill="var(--bg-card)" stroke="var(--border-color)" rx="6"/>
        <text class="svg-text-title" x="15" y="26">devmem_is_unconsumed(pfn)</text>
        <text class="svg-text-desc" x="15" y="48">Checks I/O resource collision</text>
        <text class="svg-text-desc" x="15" y="70">If MMIO claimed by driver -> return 0</text>
        <text class="svg-text-desc" x="15" y="92">Unclaimed ROM -> return 1</text>
        <text id="decision-text" class="svg-text-desc" x="15" y="112" fill="var(--accent-green)">Status: Full physical protection</text>
      </g>
    </g>

    <!-- Column 3: Outcome -->
    <g id="col-outcome" transform="translate(620, 20)">
      <rect x="0" y="0" width="220" height="340" fill="none" stroke="var(--border-color)" stroke-dasharray="4" rx="8"/>
      <text class="svg-text-title" x="20" y="32">Mapping Outcome</text>

      <!-- Allowed Box -->
      <g id="box-outcome-allow" transform="translate(10, 60)">
        <rect class="svg-box" width="200" height="110"/>
        <text id="allow-title" class="svg-text-title" x="15" y="28" fill="var(--accent-green)">MMAP GRANTED</text>
        <text class="svg-text-desc" x="15" y="50">Return: valid virtual pointer</text>
        <text class="svg-text-desc" x="15" y="72">Userspace PTE established</text>
        <text class="svg-text-desc" x="15" y="94" fill="var(--accent-green)">Legitimate display/ROM access</text>
      </g>

      <!-- Denied Box -->
      <g id="box-outcome-deny" transform="translate(10, 190)">
        <rect class="svg-box" width="200" height="130"/>
        <text id="deny-title" class="svg-text-title" x="15" y="28" fill="var(--accent-red)">BLOCKED: -EPERM</text>
        <text id="deny-desc1" class="svg-text-desc" x="15" y="50">mmap() returned MAP_FAILED</text>
        <text id="deny-desc2" class="svg-text-desc" x="15" y="72">errno = EPERM (1)</text>
        <text id="deny-desc3" class="svg-text-desc" x="15" y="92" fill="var(--accent-red)">Physical RAM isolated</text>
        <text class="svg-text-desc" x="15" y="112" fill="var(--text-secondary)">Rootkit tamper defeated</text>
      </g>
    </g>

    <!-- Connecting Pathways -->
    <path d="M 230 100 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 230 200 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 230 300 L 280 120" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <path d="M 580 120 L 630 115" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <path d="M 580 150 L 630 255" stroke="var(--border-color)" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- Animated Token -->
    <circle id="token" cx="130" cy="100" r="10"/>
  </svg>

  <div class="status-bar">
    <div id="status-text">Ready. Choose a scenario: Physical System RAM, Active Driver MMIO, or Legacy ROM.</div>
    <div id="step-badge" style="font-weight:700; color:var(--accent-blue);">Step: 0/4</div>
  </div>
</div>

<script>
  let currentScenario = 'ram'; // 'ram', 'io', 'rom'
  let currentMode = 2;         // 0: Permissive, 1: Strict RAM, 2: Strict RAM + I/O
  let currentStep = 0;
  let isPlaying = false;
  let playInterval = null;

  const positions = {
    ram: [
      { cx: 130, cy: 100, text: "Step 1: Attacker/Root attempts mmap(/dev/mem) targeting physical System RAM." },
      { cx: 430, cy: 125, text: "Step 2: devmem_is_allowed(pfn) validates target address against page allocator." },
      { cx: 430, cy: 260, text: "Step 3: Target is inside System RAM. Permitted only if Mode == 0 (Permissive)." },
      { cx: 730, cy: 255, text: "" } // Handled dynamically
    ],
    io: [
      { cx: 130, cy: 200, text: "Step 1: Process attempts mmap(/dev/mem) on PCI MMIO claimed by NVMe/NIC driver." },
      { cx: 430, cy: 125, text: "Step 2: devmem_is_allowed() succeeds (not RAM); devmem_is_unconsumed() called." },
      { cx: 430, cy: 260, text: "Step 3: Resource is actively claimed by driver. Permitted only if Mode < 2." },
      { cx: 730, cy: 255, text: "" } // Handled dynamically
    ],
    rom: [
      { cx: 130, cy: 300, text: "Step 1: X.org server attempts mmap(/dev/mem) on unclaimed legacy VGA text buffer." },
      { cx: 430, cy: 125, text: "Step 2: devmem_is_allowed() checks target: outside System RAM." },
      { cx: 430, cy: 260, text: "Step 3: devmem_is_unconsumed() checks target: region unclaimed by drivers." },
      { cx: 730, cy: 115, text: "Step 4: Result: MMAP GRANTED. Legacy graphics access allowed." }
    ]
  };

  function selectScenario(scenario) {
    currentScenario = scenario;
    document.getElementById('btn-target-ram').classList.toggle('active', scenario === 'ram');
    document.getElementById('btn-target-io').classList.toggle('active', scenario === 'io');
    document.getElementById('btn-target-rom').classList.toggle('active', scenario === 'rom');
    resetSimulation();
  }

  function cycleMode() {
    currentMode = (currentMode + 1) % 3;
    const btn = document.getElementById('btn-mode');
    const svgText = document.getElementById('svg-mode-text');
    const decText = document.getElementById('decision-text');

    if (currentMode === 0) {
      btn.innerText = "Mode: Permissive (0)";
      svgText.textContent = "CONFIG_STRICT_DEVMEM=n (Permissive)";
      decText.textContent = "Status: All physical memory exposed!";
    } else if (currentMode === 1) {
      btn.innerText = "Mode: Strict RAM (1)";
      svgText.textContent = "CONFIG_STRICT_DEVMEM=y (RAM protected)";
      decText.textContent = "Status: System RAM protected, I/O unblocked";
    } else {
      btn.innerText = "Mode: Strict RAM + I/O (2)";
      svgText.textContent = "CONFIG_STRICT_DEVMEM=y & IO_STRICT=y";
      decText.textContent = "Status: Full physical protection active";
    }
    updateDisplay();
  }

  function toggleTheme() {
    document.body.classList.toggle('light-mode');
  }

  function updateDisplay() {
    const token = document.getElementById('token');
    const statusText = document.getElementById('status-text');
    const stepBadge = document.getElementById('step-badge');
    const led = document.getElementById('led');
    const denyTitle = document.getElementById('deny-title');
    const denyDesc1 = document.getElementById('deny-desc1');
    const denyDesc3 = document.getElementById('deny-desc3');

    const posList = positions[currentScenario];
    const pos = posList[currentStep];

    token.setAttribute('cx', pos.cx);
    token.setAttribute('cy', pos.cy);
    stepBadge.innerText = `Step: ${currentStep + 1}/4`;

    let willBlock = false;
    if (currentScenario === 'ram' && currentMode >= 1) willBlock = true;
    if (currentScenario === 'io' && currentMode >= 2) willBlock = true;

    if (currentStep === 3) {
      if (willBlock) {
        token.setAttribute('cx', 730);
        token.setAttribute('cy', 255);
        token.style.fill = "var(--accent-red)";
        led.className = "led-indicator violation";

        if (currentScenario === 'ram') {
          denyTitle.textContent = "BLOCKED: -EPERM";
          denyDesc1.textContent = "devmem_is_allowed() = 0";
          denyDesc3.textContent = "System RAM tampering blocked!";
          statusText.innerText = "Step 4: [BLOCKED] System RAM mapping rejected with -EPERM! Kernel memory secure.";
        } else {
          denyTitle.textContent = "BLOCKED: -EPERM";
          denyDesc1.textContent = "devmem_is_unconsumed() = 0";
          denyDesc3.textContent = "Active driver MMIO protected!";
          statusText.innerText = "Step 4: [BLOCKED] Active driver MMIO rejected with -EPERM! DMA hijack thwarted.";
        }
      } else {
        token.setAttribute('cx', 730);
        token.setAttribute('cy', 115);
        token.style.fill = (currentScenario === 'rom') ? "var(--accent-green)" : "var(--accent-amber)";
        led.className = (currentMode === 0) ? "led-indicator permissive" : "led-indicator";
        statusText.innerText = "Step 4: [GRANTED] Physical memory mapped to userspace page.";
      }
    } else {
      if (currentScenario === 'rom') {
        token.style.fill = "var(--accent-green)";
        led.className = "led-indicator";
      } else if (currentScenario === 'ram') {
        token.style.fill = (currentMode >= 1) ? "var(--accent-red)" : "var(--accent-amber)";
        led.className = (currentMode >= 1) ? "led-indicator violation" : "led-indicator permissive";
      } else {
        token.style.fill = (currentMode >= 2) ? "var(--accent-red)" : "var(--accent-amber)";
        led.className = (currentMode >= 2) ? "led-indicator violation" : "led-indicator permissive";
      }
      statusText.innerText = pos.text;
    }
  }

  function stepSimulation() {
    currentStep = (currentStep + 1) % 4;
    updateDisplay();
  }

  function togglePlay() {
    const btn = document.getElementById('btn-play');
    if (isPlaying) {
      clearInterval(playInterval);
      isPlaying = false;
      btn.innerText = "Auto Play ▶";
    } else {
      isPlaying = true;
      btn.innerText = "Pause ⏸";
      playInterval = setInterval(() => {
        stepSimulation();
      }, 1400);
    }
  }

  function resetSimulation() {
    if (isPlaying) togglePlay();
    currentStep = 0;
    updateDisplay();
  }

  // Initialize
  updateDisplay();
</script>
</body>
</html>
