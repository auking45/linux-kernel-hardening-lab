<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario 04 - Phase 3: SLAB Freelist Hardening & KFENCE Trap</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    [data-theme="light"] .step-desc-bar {
      background: #f8fafc;
      color: #0f172a;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .metric-item {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .svg-canvas rect {
      fill: #ffffff !important;
    }

    [data-theme="light"] .svg-canvas text[fill="#94a3b8"] {
      fill: #64748b !important;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-yellow);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 6px;
    }

    .phase-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-yellow);
      border: 1px solid var(--accent-yellow);
    }

    .controls { display: flex; gap: 6px; align-items: center; }
    .btn {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(245, 158, 11, 0.25); border-color: var(--accent-yellow); }
    .btn.primary { background: var(--accent-yellow); color: #0b132b; }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diagram-viewport {
      width: 100%;
      height: 250px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: rgba(11, 19, 43, 0.4);
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .svg-canvas { width: 100%; height: 100%; }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .metric-item {
      background: rgba(11, 19, 43, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      text-align: center;
    }

    .metric-title { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
    .metric-val { font-size: 0.85rem; font-weight: 700; color: var(--accent-yellow); }

    .status-ok { color: var(--accent-green) !important; }
    .status-alert { color: var(--accent-red) !important; }

    @keyframes shield-pulse {
      0% { filter: drop-shadow(0 0 2px var(--accent-yellow)); }
      50% { filter: drop-shadow(0 0 10px var(--accent-yellow)); }
      100% { filter: drop-shadow(0 0 2px var(--accent-yellow)); }
    }
    .pulse-shield { animation: shield-pulse 1.5s infinite; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="phase-badge">Phase 3: Freelist Hardening XOR 쿠키 검증 &amp; KFENCE 트랩</span>
        <span style="font-size:0.75rem; color:var(--text-muted);" id="stepIndicator">단계 1 / 4</span>
      </div>
      <div class="controls">
        <button class="btn" onclick="prevStep()">◀ 이전</button>
        <button class="btn" onclick="nextStep()">다음 ▶</button>
        <button class="btn primary" id="playBtn" onclick="togglePlay()">자동 재생</button>
        <button class="btn" onclick="resetSim()">초기화</button>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️ 라이트</button>
      </div>
    </div>

    <div class="step-desc-bar" id="descBar">
      <span id="descIcon">🛡️</span>
      <span id="descText">CONFIG_SLAB_FREELIST_HARDENED 활성화: freepointer는 ptr ^ s->random ^ swab64(addr) 공식으로 상시 암호화되어 보관됨.</span>
    </div>

    <div class="diagram-viewport">
      <svg class="svg-canvas" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-yellow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
          </marker>
          <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#ef4444" />
          </marker>
        </defs>

        <!-- Hardened Cache Controller -->
        <g id="kmemCacheBox">
          <rect x="20" y="25" width="170" height="85" rx="6" fill="#1c2541" stroke="#f59e0b" stroke-width="1.5"/>
          <text x="30" y="45" font-size="11" font-weight="700" fill="#f59e0b">Hardened kmem_cache</text>
          <text x="30" y="62" font-size="9" fill="#94a3b8">s->random: 0x9AF03C28...</text>
          <text x="30" y="78" font-size="8.5" fill="#38bdf8">XOR swab(addr) Obfuscation</text>
          <text x="30" y="96" font-size="9.5" font-weight="600" fill="#f8fafc" id="cHeadText">freelist: Chunk 1</text>
        </g>

        <!-- Chunk 0 & Overflow Attempt -->
        <g id="chunk0">
          <rect x="215" y="25" width="125" height="175" rx="6" fill="#1c2541" stroke="#ef4444" stroke-width="1.2"/>
          <text x="225" y="48" font-size="11" font-weight="700" fill="#ef4444">Chunk 0 [Overflow]</text>
          <text x="225" y="66" font-size="9" fill="#94a3b8">Addr: 0xFFFF...8288</text>
          <line x1="215" y1="75" x2="340" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="223" y="85" width="109" height="42" rx="4" fill="rgba(239,68,68,0.1)"/>
          <text x="230" y="102" font-size="8.5" fill="#ef4444">Raw Target Injected:</text>
          <text x="230" y="118" font-size="9" font-weight="700" fill="#ef4444">0xFFFF...12345678</text>
          <text x="225" y="152" font-size="8.5" fill="#94a3b8">Overwrites Slot 1</text>
          <text x="225" y="180" font-size="9" font-weight="600" fill="#f59e0b">ATTACK INJECTED</text>
        </g>

        <!-- Chunk 1 (Trap Slot) -->
        <g id="chunk1">
          <rect x="360" y="25" width="150" height="175" rx="6" fill="#1c2541" stroke="#f59e0b" stroke-width="1.5" id="c1Box"/>
          <text x="370" y="48" font-size="11" font-weight="700" fill="#f59e0b" id="c1Title">Chunk 1 [Hardened Slot]</text>
          <text x="370" y="66" font-size="9" fill="#94a3b8">Addr: 0xFFFF...8308</text>
          <line x1="360" y1="75" x2="510" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="368" y="85" width="134" height="48" rx="4" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" id="c1PtrBox"/>
          <text x="375" y="100" font-size="8.5" fill="#94a3b8">Stored Corrupted Val:</text>
          <text x="375" y="114" font-size="8.5" font-weight="600" fill="#ef4444" id="c1Stored">0xFFFF...12345678</text>
          <text x="375" y="126" font-size="8.5" font-weight="700" fill="#f59e0b" id="c1Decoded">Dec: Pending...</text>
          <text x="370" y="152" font-size="8.5" fill="#94a3b8" id="c1Eval">XOR Verification</text>
          <text x="370" y="180" font-size="9" font-weight="700" fill="#f59e0b" id="c1Status">STATE: VERIFYING</text>
        </g>

        <!-- Kernel Integrity Enforcement Box / KFENCE Trap -->
        <g id="trapBox" class="pulse-shield">
          <rect x="535" y="25" width="245" height="175" rx="6" fill="#1c2541" stroke="#f59e0b" stroke-width="1.8" id="trapRect"/>
          <text x="548" y="48" font-size="11" font-weight="700" fill="#f59e0b" id="trapTitle">Kernel Integrity Trap</text>
          <text x="548" y="66" font-size="9" fill="#94a3b8">SLUB &amp; KFENCE Guard Engine</text>
          <line x1="535" y1="75" x2="780" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="545" y="85" width="225" height="52" rx="4" fill="rgba(245,158,11,0.12)" id="trapMsgBox"/>
          <text x="552" y="102" font-size="9" font-weight="700" fill="#f59e0b" id="trapLine1">Decoded Freepointer:</text>
          <text x="552" y="117" font-size="8.5" font-family="monospace" fill="#ef4444" id="trapLine2">0x756acb91f00cb3ce</text>
          <text x="552" y="130" font-size="8.5" fill="#94a3b8" id="trapLine3">(Non-canonical entropy garbage)</text>
          <rect x="545" y="148" width="225" height="38" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444" id="panicBox"/>
          <text x="555" y="166" font-size="9.5" font-weight="700" fill="#ef4444" id="panicTitle">🛡️ kmem_cache_alloc Trap</text>
          <text x="555" y="179" font-size="8.5" fill="#f8fafc" id="panicSub">Kernel Panic triggered / Write blocked</text>
        </g>

        <!-- Arrow from Slot 1 to Trap Box -->
        <path id="trapArrow" d="M 510 106 L 535 106" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-yellow)"/>
      </svg>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-title">XOR 쿠키 암호화</div>
        <div class="metric-val status-ok">ENABLED (CSPRNG)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">복호화된 포인터</div>
        <div class="metric-val status-alert" id="mDec">0x756acb91...</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">공격 성공률</div>
        <div class="metric-val status-ok" id="mSucc">0% (차단됨)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">커널 대응 조치</div>
        <div class="metric-val status-alert" id="mAct">Oops / Panic Trap</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 4;
    let isPlaying = false;
    let playTimer = null;

    const stepData = [
      {
        step: 1,
        desc: "CONFIG_SLAB_FREELIST_HARDENED 활성화: freepointer는 ptr ^ s->random ^ swab64(addr) 공식으로 상시 암호화되어 보관됨.",
        dec: "정상 암호문 보관",
        succ: "0% (대기)",
        act: "정상 감시 중",
        action: () => {
          document.getElementById('c1Stored').textContent = "0x9AF03C... (암호화됨)";
          document.getElementById('c1Stored').setAttribute('fill', '#f59e0b');
          document.getElementById('c1Decoded').textContent = "Dec: &Chunk 2 (정상)";
          document.getElementById('c1Decoded').setAttribute('fill', '#22c55e');
          document.getElementById('c1Status').textContent = "STATE: HARDENED_SAFE";
          document.getElementById('c1Status').setAttribute('fill', '#22c55e');
          document.getElementById('trapLine2').textContent = "대기 중...";
          document.getElementById('trapLine2').setAttribute('fill', '#94a3b8');
          document.getElementById('trapLine3').textContent = "할당 요청 시 XOR 복호화 검증";
          document.getElementById('panicTitle').textContent = "보안 모니터링 활성";
          document.getElementById('panicTitle').setAttribute('fill', '#22c55e');
          document.getElementById('panicBox').setAttribute('fill', 'rgba(34,197,94,0.15)');
          document.getElementById('panicBox').setAttribute('stroke', '#22c55e');
        }
      },
      {
        step: 2,
        desc: "공격자가 힙 오버플로우를 감행하여 평문 공격 대상 주소(0xFFFF888012345678)를 미할당 청크의 freepointer 위치에 덮어씀.",
        dec: "0xFFFF...12345678",
        succ: "검증 단계 돌입",
        act: "복호화 인터셉트",
        action: () => {
          document.getElementById('c1Stored').textContent = "0xFFFF...12345678";
          document.getElementById('c1Stored').setAttribute('fill', '#ef4444');
          document.getElementById('c1Decoded').textContent = "Dec: 연산 트리거";
          document.getElementById('c1Decoded').setAttribute('fill', '#f59e0b');
          document.getElementById('c1Status').textContent = "STATE: POISON_INJECTED";
          document.getElementById('c1Status').setAttribute('fill', '#ef4444');
        }
      },
      {
        step: 3,
        desc: "커널이 kmalloc-128 할당을 위해 freepointer를 복호화하는 순간, 암호화 쿠키 역연산으로 인해 '0x756acb91f00cb3ce' 엔트로피 쓰레기 주소가 산출됨!",
        dec: "0x756acb91f00cb3ce",
        succ: "0% (주소 파괴)",
        act: "무결성 위반 감지",
        action: () => {
          document.getElementById('c1Decoded').textContent = "Dec: 0x756acb91... (Garbage)";
          document.getElementById('c1Decoded').setAttribute('fill', '#ef4444');
          document.getElementById('trapLine2').textContent = "0x756acb91f00cb3ce";
          document.getElementById('trapLine2').setAttribute('fill', '#ef4444');
          document.getElementById('trapLine3').textContent = "위반: 슬랩 정렬 및 캐노니컬 범위 이탈";
        }
      },
      {
        step: 4,
        desc: "비정상 포인터 검증 즉각 포착! 커널 Oops/Panic을 유발하여 공격자의 임의 메모리 할당 및 물리 로봇 탈취 시도를 0%로 완벽 차단함.",
        dec: "TRAPPED",
        succ: "0% BLOCKED",
        act: "Panic / Oops Trap",
        action: () => {
          document.getElementById('panicTitle').textContent = "🛡️ kmem_cache_alloc Trap!";
          document.getElementById('panicTitle').setAttribute('fill', '#ef4444');
          document.getElementById('panicSub').textContent = "SLUB Freelist Corruption / 임의 쓰기 차단";
          document.getElementById('panicBox').setAttribute('fill', 'rgba(239,68,68,0.25)');
          document.getElementById('panicBox').setAttribute('stroke', '#ef4444');
        }
      }
    ];

    function renderStep(idx) {
      currentStep = idx;
      const data = stepData[idx - 1];
      document.getElementById('stepIndicator').textContent = `단계 ${data.step} / ${totalSteps}`;
      document.getElementById('descText').textContent = data.desc;
      document.getElementById('mDec').textContent = data.dec;
      document.getElementById('mSucc').textContent = data.succ;
      document.getElementById('mAct').textContent = data.act;
      data.action();
      reportHeight();
    }

    function nextStep() {
      if (currentStep < totalSteps) renderStep(currentStep + 1);
      else renderStep(1);
    }

    function prevStep() {
      if (currentStep > 1) renderStep(currentStep - 1);
      else renderStep(totalSteps);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        btn.textContent = "일시정지";
        btn.style.background = "#e2e8f0";
        btn.style.color = "#0f172a";
        playLoop();
      } else {
        btn.textContent = "자동 재생";
        btn.style.background = "var(--accent-yellow)";
        btn.style.color = "#0b132b";
        clearTimeout(playTimer);
      }
    }

    function playLoop() {
      if (!isPlaying) return;
      nextStep();
      playTimer = setTimeout(playLoop, 2600);
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    function toggleTheme(forcedTheme) {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const target = forcedTheme || (current === 'light' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', target);
      try { localStorage.setItem('diagram-theme', target); } catch(e){}
      updateThemeBtn(target);
      try {
        window.parent.postMessage({ type: 'diagram-theme-change', theme: target }, '*');
      } catch(e){}
    }

    function updateThemeBtn(theme) {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = theme === 'light' ? '🌙 다크' : '☀️ 라이트';
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'set-diagram-theme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        updateThemeBtn(e.data.theme);
      }
    });

    (function() {
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('diagram-theme'); } catch(e){}
      if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        savedTheme = 'light';
      }
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);
      }
    })();

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
      playTimer = setTimeout(playLoop, 2000);
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  </script>
</body>
</html>
