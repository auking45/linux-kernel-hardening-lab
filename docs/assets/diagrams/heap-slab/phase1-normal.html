<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario 04 - Phase 1: Normal SLUB Allocation & Freelist Traversal</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-border: #3a506b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-purple: #a855f7;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #9333ea;
    }

    [data-theme="light"] .step-desc-bar {
      background: #f8fafc;
      color: #0f172a;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .metric-item {
      background: #f8fafc;
      border-color: #e2e8f0;
    }

    [data-theme="light"] .svg-canvas rect {
      fill: #ffffff !important;
    }

    [data-theme="light"] .svg-canvas text[fill="#94a3b8"] {
      fill: #64748b !important;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { background: transparent; color: var(--text-main); overflow: hidden; padding: 4px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--accent-blue);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.15);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
      gap: 6px;
    }

    .phase-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
    }

    .controls { display: flex; gap: 6px; align-items: center; }
    .btn {
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(56, 189, 248, 0.25); border-color: var(--accent-blue); }
    .btn.primary { background: var(--accent-blue); color: #0b132b; }

    .step-desc-bar {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diagram-viewport {
      width: 100%;
      height: 250px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: rgba(11, 19, 43, 0.4);
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .svg-canvas { width: 100%; height: 100%; }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .metric-item {
      background: rgba(11, 19, 43, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      text-align: center;
    }

    .metric-title { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
    .metric-val { font-size: 0.85rem; font-weight: 700; color: var(--accent-blue); }

    .status-ok { color: var(--accent-green) !important; }
    .status-alert { color: var(--accent-red) !important; }

    @keyframes pulse-node {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px var(--accent-blue)); }
      50% { transform: scale(1.02); filter: drop-shadow(0 0 8px var(--accent-blue)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 2px var(--accent-blue)); }
    }
    .pulse { animation: pulse-node 1.6s infinite ease-in-out; }
  </style>
</head>
<body>
  <div class="card">
    <div class="toolbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="phase-badge">Phase 1: 정상 SLUB 메모리 할당 및 Freelist 순회</span>
        <span style="font-size:0.75rem; color:var(--text-muted);" id="stepIndicator">단계 1 / 4</span>
      </div>
      <div class="controls">
        <button class="btn" onclick="prevStep()">◀ 이전</button>
        <button class="btn" onclick="nextStep()">다음 ▶</button>
        <button class="btn primary" id="playBtn" onclick="togglePlay()">자동 재생</button>
        <button class="btn" onclick="resetSim()">초기화</button>
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️ 라이트</button>
      </div>
    </div>

    <div class="step-desc-bar" id="descBar">
      <span id="descIcon">ℹ️</span>
      <span id="descText">kmem_cache_cpu의 freelist 헤드가 첫 번째 가용 객체(Chunk 0)를 가리키며, 각 객체의 freepointer가 다음 가용 청크를 연속적으로 연결함.</span>
    </div>

    <div class="diagram-viewport">
      <svg class="svg-canvas" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
          </marker>
          <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#22c55e" />
          </marker>
          <linearGradient id="grad-active" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
            <stop offset="1%" stop-color="#22c55e" stop-opacity="0.2"/>
          </linearGradient>
        </defs>

        <!-- Kernel kmem_cache Header Box -->
        <g id="kmemCacheBox">
          <rect x="20" y="25" width="160" height="75" rx="6" fill="#1c2541" stroke="#38bdf8" stroke-width="1.5"/>
          <text x="30" y="45" font-size="11" font-weight="700" fill="#38bdf8">kmem_cache (kmalloc-128)</text>
          <text x="30" y="65" font-size="9.5" fill="#94a3b8">s->random: 0x9AF03C... [XOR]</text>
          <text x="30" y="83" font-size="10" font-weight="600" fill="#f8fafc" id="cacheHeadText">freelist: Chunk 0 (0x...8288)</text>
        </g>

        <!-- Slab Page Chunk Blocks -->
        <!-- Chunk 0 -->
        <g id="chunk0" class="pulse">
          <rect x="230" y="25" width="125" height="175" rx="6" fill="#1c2541" stroke="#38bdf8" stroke-width="1.5" id="c0Rect"/>
          <text x="240" y="48" font-size="11" font-weight="700" fill="#38bdf8" id="c0Title">Chunk 0 [Free Slot]</text>
          <text x="240" y="66" font-size="9" fill="#94a3b8">Addr: 0xFFFF...8288</text>
          <line x1="230" y1="75" x2="355" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="238" y="85" width="109" height="42" rx="4" fill="rgba(56,189,248,0.1)" stroke="#38bdf8" stroke-dasharray="3,2" id="c0PtrBox"/>
          <text x="245" y="102" font-size="9" fill="#94a3b8">freelist_ptr (Encoded):</text>
          <text x="245" y="118" font-size="9.5" font-weight="700" fill="#38bdf8" id="c0PtrVal">&amp;Chunk 1 (0x...8308)</text>
          <text x="240" y="152" font-size="8.5" fill="#94a3b8" id="c0Payload">Payload: (Unallocated)</text>
          <text x="240" y="180" font-size="9" font-weight="600" fill="#22c55e" id="c0State">STATE: NEXT_ALLOC</text>
        </g>

        <!-- Chunk 1 -->
        <g id="chunk1">
          <rect x="375" y="25" width="125" height="175" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1.2" id="c1Rect"/>
          <text x="385" y="48" font-size="11" font-weight="700" fill="#94a3b8" id="c1Title">Chunk 1 [Free Slot]</text>
          <text x="385" y="66" font-size="9" fill="#94a3b8">Addr: 0xFFFF...8308</text>
          <line x1="375" y1="75" x2="500" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="383" y="85" width="109" height="42" rx="4" fill="rgba(255,255,255,0.03)" stroke="#3a506b"/>
          <text x="390" y="102" font-size="9" fill="#94a3b8">freelist_ptr (Encoded):</text>
          <text x="390" y="118" font-size="9.5" font-weight="600" fill="#94a3b8">&amp;Chunk 2 (0x...8388)</text>
          <text x="385" y="152" font-size="8.5" fill="#94a3b8">Payload: (Unallocated)</text>
          <text x="385" y="180" font-size="9" font-weight="600" fill="#94a3b8">STATE: FREE</text>
        </g>

        <!-- Chunk 2 -->
        <g id="chunk2">
          <rect x="520" y="25" width="125" height="175" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1.2"/>
          <text x="530" y="48" font-size="11" font-weight="700" fill="#94a3b8">Chunk 2 [Free Slot]</text>
          <text x="530" y="66" font-size="9" fill="#94a3b8">Addr: 0xFFFF...8388</text>
          <line x1="520" y1="75" x2="645" y2="75" stroke="#3a506b" stroke-width="1"/>
          <rect x="528" y="85" width="109" height="42" rx="4" fill="rgba(255,255,255,0.03)" stroke="#3a506b"/>
          <text x="535" y="102" font-size="9" fill="#94a3b8">freelist_ptr (Encoded):</text>
          <text x="535" y="118" font-size="9.5" font-weight="600" fill="#94a3b8">&amp;Chunk 3 (0x...8408)</text>
          <text x="530" y="152" font-size="8.5" fill="#94a3b8">Payload: (Unallocated)</text>
          <text x="530" y="180" font-size="9" font-weight="600" fill="#94a3b8">STATE: FREE</text>
        </g>

        <!-- Robot Control Module Box -->
        <g id="robotModuleBox">
          <rect x="665" y="25" width="120" height="175" rx="6" fill="#1c2541" stroke="#22c55e" stroke-width="1.2"/>
          <text x="675" y="48" font-size="10.5" font-weight="700" fill="#22c55e">Gait Stabilizer</text>
          <text x="675" y="66" font-size="9" fill="#94a3b8">PID Telemetry</text>
          <line x1="665" y1="75" x2="785" y2="75" stroke="#3a506b" stroke-width="1"/>
          <text x="675" y="98" font-size="9" fill="#f8fafc" id="pidKp">Kp: 150.0 (Pitch)</text>
          <text x="675" y="120" font-size="9" fill="#f8fafc" id="pidKd">Kd: 12.0 (Damp)</text>
          <text x="675" y="142" font-size="9" fill="#f8fafc" id="pidYaw">Yaw: 1.2 rad/s</text>
          <rect x="673" y="158" width="104" height="28" rx="4" fill="rgba(34,197,94,0.15)" stroke="#22c55e"/>
          <text x="682" y="176" font-size="9" font-weight="700" fill="#22c55e">BALANCE OK</text>
        </g>

        <!-- Freelist Pointer Arrows -->
        <path id="arrowHeadTo0" d="M 180 62 L 222 62" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <path id="arrow0To1" d="M 347 106 L 367 106" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
        <path id="arrow1To2" d="M 492 106 L 512 106" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </svg>
    </div>

    <div class="metrics-row">
      <div class="metric-item">
        <div class="metric-title">SLUB Cache</div>
        <div class="metric-val">kmalloc-128</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">Freelist Head</div>
        <div class="metric-val" id="metricHead">Chunk 0 (0x...8288)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">Freelist 무결성</div>
        <div class="metric-val status-ok" id="metricIntegrity">정상 (VALID)</div>
      </div>
      <div class="metric-item">
        <div class="metric-title">로봇 보행 안정성</div>
        <div class="metric-val status-ok" id="metricBalance">안정 (Nominal Kp=150)</div>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 4;
    let isPlaying = false;
    let playTimer = null;

    const stepData = [
      {
        step: 1,
        desc: "kmem_cache_cpu의 freelist 헤드가 첫 번째 가용 객체(Chunk 0)를 가리키며, 각 객체의 freepointer가 다음 가용 청크를 연속적으로 연결함.",
        head: "Chunk 0 (0x...8288)",
        integrity: "정상 (VALID)",
        balance: "대기 (Unassigned)",
        action: () => {
          document.getElementById('cacheHeadText').textContent = "freelist: Chunk 0 (0x...8288)";
          document.getElementById('arrowHeadTo0').setAttribute('d', 'M 180 62 L 222 62');
          document.getElementById('c0Rect').setAttribute('stroke', '#38bdf8');
          document.getElementById('c0Title').textContent = "Chunk 0 [Free Slot]";
          document.getElementById('c0Title').setAttribute('fill', '#38bdf8');
          document.getElementById('c0State').textContent = "STATE: NEXT_ALLOC";
          document.getElementById('c0State').setAttribute('fill', '#22c55e');
          document.getElementById('c0Payload').textContent = "Payload: (Unallocated)";
        }
      },
      {
        step: 2,
        desc: "kmalloc(128) 시스템 콜 호출: 커널 할당자가 freelist 헤드인 Chunk 0을 추출(pop)하여 요청 드라이버에 반환함.",
        head: "Chunk 0 -> Driver",
        integrity: "정상 (ALLOCATING)",
        balance: "초기화 진행 중",
        action: () => {
          document.getElementById('c0Rect').setAttribute('fill', 'url(#grad-active)');
          document.getElementById('c0Rect').setAttribute('stroke', '#22c55e');
          document.getElementById('c0Title').textContent = "Chunk 0 [ACTIVE ALLOC]";
          document.getElementById('c0Title').setAttribute('fill', '#22c55e');
          document.getElementById('c0State').textContent = "STATE: IN-USE";
          document.getElementById('c0Payload').textContent = "robot_gait_config_t bind";
        }
      },
      {
        step: 3,
        desc: "Chunk 0 내부 freepointer를 안전하게 디코딩하여 다음 가용 객체(Chunk 1)를 캐시 freelist 헤드로 승격: freelist = Chunk 1.",
        head: "Chunk 1 (0x...8308)",
        integrity: "정상 (PROMOTED)",
        balance: "안정화 준비",
        action: () => {
          document.getElementById('cacheHeadText').textContent = "freelist: Chunk 1 (0x...8308)";
          document.getElementById('arrowHeadTo0').setAttribute('d', 'M 180 45 Q 280 10, 367 45');
          document.getElementById('arrowHeadTo0').setAttribute('stroke', '#22c55e');
          document.getElementById('c1Rect').setAttribute('stroke', '#38bdf8');
          document.getElementById('c1Title').setAttribute('fill', '#38bdf8');
          document.getElementById('c1Title').textContent = "Chunk 1 [NEXT HEAD]";
        }
      },
      {
        step: 4,
        desc: "Chunk 0에 로봇 보행 균형 제어 파라미터(Kp=150.0, Kd=12.0)가 정상 기록되어 1kHz 주기 제어 루프가 완벽히 안정적으로 기동함.",
        head: "Chunk 1 (Head)",
        integrity: "정상 (STABLE)",
        balance: "안정 (Nominal Kp=150)",
        action: () => {
          document.getElementById('pidKp').textContent = "Kp: 150.0 (Nominal)";
          document.getElementById('pidKd').textContent = "Kd: 12.0 (Damp)";
          document.getElementById('c0Payload').textContent = "PID: Pitch=150, Kd=12";
        }
      }
    ];

    function renderStep(idx) {
      currentStep = idx;
      const data = stepData[idx - 1];
      document.getElementById('stepIndicator').textContent = `단계 ${data.step} / ${totalSteps}`;
      document.getElementById('descText').textContent = data.desc;
      document.getElementById('metricHead').textContent = data.head;
      document.getElementById('metricIntegrity').textContent = data.integrity;
      document.getElementById('metricBalance').textContent = data.balance;
      data.action();
      reportHeight();
    }

    function nextStep() {
      if (currentStep < totalSteps) renderStep(currentStep + 1);
      else renderStep(1);
    }

    function prevStep() {
      if (currentStep > 1) renderStep(currentStep - 1);
      else renderStep(totalSteps);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        btn.textContent = "일시정지";
        btn.style.background = "#e2e8f0";
        btn.style.color = "#0f172a";
        playLoop();
      } else {
        btn.textContent = "자동 재생";
        btn.style.background = "var(--accent-blue)";
        btn.style.color = "#0b132b";
        clearTimeout(playTimer);
      }
    }

    function playLoop() {
      if (!isPlaying) return;
      nextStep();
      playTimer = setTimeout(playLoop, 2600);
    }

    function resetSim() {
      if (isPlaying) togglePlay();
      renderStep(1);
    }

    function reportHeight() {
      const card = document.querySelector('.card');
      const h = card ? Math.ceil(card.getBoundingClientRect().height + 16) : Math.ceil(document.body.scrollHeight + 10);
      window.parent.postMessage({ type: 'diagram-resize', height: h }, '*');
    }

    function toggleTheme(forcedTheme) {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const target = forcedTheme || (current === 'light' ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', target);
      try { localStorage.setItem('diagram-theme', target); } catch(e){}
      updateThemeBtn(target);
      try {
        window.parent.postMessage({ type: 'diagram-theme-change', theme: target }, '*');
      } catch(e){}
    }

    function updateThemeBtn(theme) {
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = theme === 'light' ? '🌙 다크' : '☀️ 라이트';
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'set-diagram-theme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        updateThemeBtn(e.data.theme);
      }
    });

    (function() {
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('diagram-theme'); } catch(e){}
      if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        savedTheme = 'light';
      }
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);
      }
    })();

    window.addEventListener('load', () => {
      renderStep(1);
      reportHeight();
      playTimer = setTimeout(playLoop, 2000);
    });
    window.addEventListener('resize', reportHeight);
    if (window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  </script>
</body>
</html>
