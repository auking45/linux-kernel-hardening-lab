<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 328" width="100%" height="328" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="836" height="324" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Symbol Stripping: .symtab Removal vs .dynsym Retention</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ readelf -S auth_demo | grep -E &#x27;\.symtab|\.dynsym&#x27;</tspan>
  </text>
  <text x="24" y="82" fill="#34d399" font-size="12" xml:space="preserve">  [ 6] .dynsym           DYNSYM           00000000000003d8  000003d8  (Dynamic Symbols)</text>
  <text x="24" y="102" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">  [28] .symtab           SYMTAB           0000000000000000  00003040  (Static Debug Symbols)</text>
  <text x="24" y="142" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ strip --strip-all auth_demo -o auth_demo_stripped</tspan>
  </text>
  <text x="24" y="162" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ readelf -S auth_demo_stripped | grep -E &#x27;\.symtab|\.dynsym&#x27;</tspan>
  </text>
  <text x="24" y="182" fill="#34d399" font-size="12" xml:space="preserve">  [ 6] .dynsym           DYNSYM           00000000000003d8  000003d8  (Preserved!)</text>
  <text x="24" y="202" fill="#64748b" font-size="12" xml:space="preserve">  # Note: .symtab is completely eliminated to reduce size and obfuscate binaries.</text>
  <text x="24" y="242" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ ./auth_demo_stripped</tspan>
  </text>
  <text x="24" y="262" fill="#34d399" font-size="12" xml:space="preserve">[+] Token verification result : VALID (g_auth_counter=1)</text>
  <text x="24" y="282" fill="#34d399" font-size="12" xml:space="preserve">[+] Calling auth_event_logger : [DEFAULT-WEAK-LOGGER] Cycle completed</text>
  <text x="24" y="302" fill="#64748b" font-size="12" xml:space="preserve">--&gt; Binary executes flawlessly! Runtime loader relies strictly on .dynsym.</text>
</svg>