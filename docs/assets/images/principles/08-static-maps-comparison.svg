  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">AArch64 Static Binary: PT_LOAD Segments &amp; Kernel Direct Loading</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ aarch64-linux-gnu-readelf -l secvault_static | grep -A 1 LOAD</tspan>
  </text>
  <text x="24" y="82" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">  LOAD           0x0000000000000000 0x0000000000400000 0x0000000000400000</text>
  <text x="24" y="102" fill="#cbd5e1" font-size="12" xml:space="preserve">                 0x0000000000085188 0x0000000000085188  R E    0x10000 (Code: RX)</text>
  <text x="24" y="122" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">  LOAD           0x0000000000090000 0x00000000004a0000 0x00000000004a0000</text>
  <text x="24" y="142" fill="#cbd5e1" font-size="12" xml:space="preserve">                 0x00000000000089e8 0x000000000000f680  RW     0x10000 (Data: RW)</text>
  <text x="24" y="182" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ aarch64-linux-gnu-readelf -l secvault_static | grep INTERP</tspan>
  </text>
  <text x="24" y="202" fill="#fbbf24" font-size="12" xml:space="preserve">[+] PT_INTERP is absent! Kernel / Loader directly branches to e_entry (0x400700).</text>
  <text x="24" y="242" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ qemu-aarch64 -L /usr/aarch64-linux-gnu ./secvault_static</tspan>
  </text>
  <text x="24" y="262" fill="#34d399" font-size="12" xml:space="preserve">============================================================</text>
  <text x="24" y="282" fill="#34d399" font-size="12" xml:space="preserve"> Security Vault Service (PID: 80274 on AArch64)</text>
  <text x="24" y="302" fill="#34d399" font-size="12" xml:space="preserve">[+] Token validation: PASSED | Computed MAC: 0x651E2B18</text>
  <text x="24" y="322" fill="#34d399" font-size="12" xml:space="preserve">============================================================</text>
