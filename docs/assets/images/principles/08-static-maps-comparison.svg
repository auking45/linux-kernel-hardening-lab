<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 348" width="100%" height="348" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="836" height="344" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">PT_LOAD Segments vs /proc/&lt;pid&gt;/maps 1:1 Memory Mapping</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ readelf -l secvault_static | grep -A 1 LOAD</tspan>
  </text>
  <text x="24" y="82" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">  LOAD           0x0000000000000000 0x0000000000400000 0x0000000000400000</text>
  <text x="24" y="102" fill="#cbd5e1" font-size="12" xml:space="preserve">                 0x000000000001b448 0x000000000001b448  R      0x1000</text>
  <text x="24" y="122" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">  LOAD           0x000000000001c000 0x000000000041c000 0x000000000041c000</text>
  <text x="24" y="142" fill="#cbd5e1" font-size="12" xml:space="preserve">                 0x000000000006f521 0x00000000006f521  R E    0x1000</text>
  <text x="24" y="162" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">  LOAD           0x000000000008c000 0x000000000048c000 0x000000000048c000</text>
  <text x="24" y="182" fill="#cbd5e1" font-size="12" xml:space="preserve">                 0x0000000000024068 0x00000000000282b8  RW     0x1000</text>
  <text x="24" y="222" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ cat /proc/$(pidof secvault_static)/maps</tspan>
  </text>
  <text x="24" y="242" fill="#34d399" font-size="12" xml:space="preserve">00400000-0041c000 r--p 00000000 08:01 1234567    /secvault_static  &lt;-- [LOAD 1: R--]</text>
  <text x="24" y="262" fill="#34d399" font-size="12" xml:space="preserve">0041c000-0048c000 r-xp 0001c000 08:01 1234567    /secvault_static  &lt;-- [LOAD 2: R-X]</text>
  <text x="24" y="282" fill="#34d399" font-size="12" xml:space="preserve">0048c000-004b1000 rw-p 0008c000 08:01 1234567    /secvault_static  &lt;-- [LOAD 3: RW-]</text>
  <text x="24" y="302" fill="#64748b" font-size="12" xml:space="preserve">004b1000-004d4000 rw-p 00000000 00:00 0          [heap]</text>
  <text x="24" y="322" fill="#64748b" font-size="12" xml:space="preserve">7ffdb4a1e000-7ffdb4a3f000 rw-p 00000000 00:00 0  [stack]</text>
</svg>