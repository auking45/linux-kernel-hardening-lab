<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 428" width="100%" height="428" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="836" height="424" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">AArch64 Compiler Pipeline: Intermediate Files (aarch64-linux-gnu-gcc)</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ aarch64-linux-gnu-gcc -v --save-temps -O2 -g vault_core.c -o vault_core</tspan>
  </text>
  <text x="24" y="82" fill="#64748b" font-size="12" xml:space="preserve"># [Pass 1] C Preprocessor (cpp) -&gt; Header Inlining &amp; Macro Expansion</text>
  <text x="24" y="102" fill="#cbd5e1" font-size="12" xml:space="preserve">[+] Generated: vault_core.i (Preprocessed C source: 55,630 lines)</text>
  <text x="24" y="122" fill="#64748b" font-size="12" xml:space="preserve"># [Pass 2] Compiler Engine (cc1 -O2) -&gt; AArch64 Register Allocation (x0-x30)</text>
  <text x="24" y="142" fill="#cbd5e1" font-size="12" xml:space="preserve">[+] Generated: vault_core.s (GNU AArch64 Assembly text: 280 lines)</text>
  <text x="24" y="162" fill="#64748b" font-size="12" xml:space="preserve"># [Pass 3] Assembler (as) -&gt; 32-bit Fixed Instruction Encoding (A64)</text>
  <text x="24" y="182" fill="#cbd5e1" font-size="12" xml:space="preserve">[+] Generated: vault_core.o (ELF 64-bit Relocatable Object, ARM aarch64)</text>
  <text x="24" y="202" fill="#64748b" font-size="12" xml:space="preserve"># [Pass 4] Linker (collect2 / ld) -&gt; Symbol Resolution &amp; Segment Packaging</text>
  <text x="24" y="222" fill="#34d399" font-size="12" xml:space="preserve">[+] Generated: vault_core   (ELF 64-bit PIE Executable, ARM aarch64)</text>
  <text x="24" y="262" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ file vault_core.* vault_core</tspan>
  </text>
  <text x="24" y="282" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve">vault_core.i: C source, Unicode text, UTF-8 text</text>
  <text x="24" y="302" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve">vault_core.s: assembler source, ASCII text (AArch64 GAS)</text>
  <text x="24" y="322" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">vault_core.o: ELF 64-bit LSB relocatable, ARM aarch64, version 1 (SYSV)</text>
  <text x="24" y="342" fill="#34d399" font-size="12" xml:space="preserve">vault_core:   ELF 64-bit LSB pie executable, ARM aarch64, dynamically linked</text>
  <text x="24" y="382" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ qemu-aarch64 -L /usr/aarch64-linux-gnu ./vault_core</tspan>
  </text>
  <text x="24" y="402" fill="#34d399" font-size="12" xml:space="preserve">=== Security Vault Service Online === (HSM Token Active on AArch64)</text>
</svg>