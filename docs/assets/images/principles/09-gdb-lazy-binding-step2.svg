<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 368" width="100%" height="368" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="836" height="364" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">AArch64 Dynamic Execution: Lazy Binding &amp; Direct Branching (QEMU)</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ qemu-aarch64 -L /usr/aarch64-linux-gnu -E LD_LIBRARY_PATH=. ./secvault_dyn</tspan>
  </text>
  <text x="24" y="82" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">============================================================</text>
  <text x="24" y="102" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve"> PLT / GOT Lazy Binding Demonstration (AArch64 Emulation)</text>
  <text x="24" y="122" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">============================================================</text>
  <text x="24" y="142" fill="#fbbf24" font-size="12" xml:space="preserve">[*] [Call 1] Invoking verify_token() for the first time...</text>
  <text x="24" y="162" fill="#64748b" font-size="12" xml:space="preserve">    -&gt; Triggers AArch64 adrp/ldr into GOT -&gt; branches to .plt0 trampoline</text>
  <text x="24" y="182" fill="#64748b" font-size="12" xml:space="preserve">    -&gt; _dl_runtime_resolve updates GOT slot with libsecure.so address</text>
  <text x="24" y="202" fill="#34d399" font-size="12" xml:space="preserve">[+] [Call 1 Result] AUTHORIZED</text>
  <text x="24" y="242" fill="#34d399" font-size="12" xml:space="preserve">[*] [Call 2] Invoking verify_token() for the second time...</text>
  <text x="24" y="262" fill="#64748b" font-size="12" xml:space="preserve">    -&gt; adrp/ldr directly branches to cached address via &quot;br x17&quot;! (0 linker overhead)</text>
  <text x="24" y="282" fill="#34d399" font-size="12" xml:space="preserve">[+] [Call 2 Result] AUTHORIZED</text>
  <text x="24" y="322" fill="#64748b" font-size="12" xml:space="preserve"># [Security Note] Full RELRO (-Wl,-z,relro,-z,now) resolves symbols on startup</text>
  <text x="24" y="342" fill="#64748b" font-size="12" xml:space="preserve"># and marks the .got segment read-only (mprotect r--p) to block GOT Overwrite.</text>
</svg>