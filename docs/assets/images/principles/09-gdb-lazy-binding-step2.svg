  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">GDB Tracing Lazy Binding [Step 2]: GOT Overwritten with Target Function</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ continue  # (Executes 1st call to verify_token, invoking dynamic linker)</tspan>
  </text>
  <text x="24" y="82" fill="#cbd5e1" font-size="12" xml:space="preserve">[*] [Call 1] Invoking verify_token() for the first time...</text>
  <text x="24" y="102" fill="#34d399" font-size="12" xml:space="preserve">[+] [Call 1 Result] AUTHORIZED</text>
  <text x="24" y="122" fill="#cbd5e1" font-size="12" xml:space="preserve">Breakpoint 2, main () at secvault_dyn.c:28 (Before Call 2)</text>
  <text x="24" y="162" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">=== [Step 2: AFTER 1st Call to verify_token] ===</text>
  <text x="24" y="182" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ x/gx &amp;verify_token@got.plt</tspan>
  </text>
  <text x="24" y="202" fill="#34d399" font-size="12" xml:space="preserve">0x555555558020 &lt;verify_token@got.plt&gt;:    0x00007ffff7fb9119</text>
  <text x="24" y="242" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ info symbol 0x00007ffff7fb9119</tspan>
  </text>
  <text x="24" y="262" fill="#34d399" font-size="12" xml:space="preserve">verify_token in section .text of ./libsecure.so</text>
  <text x="24" y="302" fill="#64748b" font-size="12" xml:space="preserve"># Crucial Finding: _dl_runtime_resolve updated GOT with actual virtual address!</text>
  <text x="24" y="322" fill="#64748b" font-size="12" xml:space="preserve"># 2nd call to verify_token will branch DIRECTLY to 0x7ffff7fb9119 without linker intervention.</text>
