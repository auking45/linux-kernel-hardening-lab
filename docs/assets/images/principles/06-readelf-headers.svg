<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 448" width="100%" height="448" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="836" height="444" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">ELF Header Comparison: Relocatable (.o) vs Executable (readelf -h)</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ readelf -h vault_core.o</tspan>
  </text>
  <text x="24" y="82" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">ELF Header (Relocatable Object File):</text>
  <text x="24" y="102" fill="#cbd5e1" font-size="12" xml:space="preserve">  Magic:   7f 45 4c 46 02 01 01 00 00 00 00 00 00 00 00 00</text>
  <text x="24" y="122" fill="#cbd5e1" font-size="12" xml:space="preserve">  Class:                             ELF64</text>
  <text x="24" y="142" fill="#cbd5e1" font-size="12" xml:space="preserve">  Data:                              2&#x27;s complement, little endian</text>
  <text x="24" y="162" fill="#fbbf24" font-size="12" xml:space="preserve">  Type:                              REL (Relocatable file)</text>
  <text x="24" y="182" fill="#64748b" font-size="12" xml:space="preserve">  Entry point address:               0x0  &lt;-- [No entry point defined yet!]</text>
  <text x="24" y="202" fill="#64748b" font-size="12" xml:space="preserve">  Start of program headers:          0 (bytes into file) &lt;-- [No Program Headers!]</text>
  <text x="24" y="222" fill="#cbd5e1" font-size="12" xml:space="preserve">  Start of section headers:          9816 (bytes into file)</text>
  <text x="24" y="242" fill="#cbd5e1" font-size="12" xml:space="preserve">  Number of section headers:         24</text>
  <text x="24" y="282" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ readelf -h vault_core</tspan>
  </text>
  <text x="24" y="302" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">ELF Header (Position-Independent Executable):</text>
  <text x="24" y="322" fill="#cbd5e1" font-size="12" xml:space="preserve">  Magic:   7f 45 4c 46 02 01 01 00 00 00 00 00 00 00 00 00</text>
  <text x="24" y="342" fill="#34d399" font-size="12" xml:space="preserve">  Type:                              DYN (Position-Independent Executable file)</text>
  <text x="24" y="362" fill="#34d399" font-size="12" xml:space="preserve">  Entry point address:               0x1190  &lt;-- [_start in .text]</text>
  <text x="24" y="382" fill="#34d399" font-size="12" xml:space="preserve">  Start of program headers:          64 (bytes into file)  &lt;-- [13 Segments for Kernel Loader]</text>
  <text x="24" y="402" fill="#cbd5e1" font-size="12" xml:space="preserve">  Start of section headers:          16832 (bytes into file)</text>
  <text x="24" y="422" fill="#cbd5e1" font-size="12" xml:space="preserve">  Number of section headers:         39</text>
</svg>