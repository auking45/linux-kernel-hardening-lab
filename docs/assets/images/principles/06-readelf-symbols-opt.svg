  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Section &amp; Symbol Table Analysis: puts Optimization (readelf -s)</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ readelf -s vault_core.o</tspan>
  </text>
  <text x="24" y="82" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">Symbol table &#x27;.symtab&#x27; contains 24 entries:</text>
  <text x="24" y="102" fill="#64748b" font-size="12" xml:space="preserve">   Num:    Value          Size Type    Bind   Vis      Ndx Name</text>
  <text x="24" y="122" fill="#cbd5e1" font-size="12" xml:space="preserve">    18: 0000000000000000   272 FUNC    GLOBAL DEFAULT    6 main</text>
  <text x="24" y="142" fill="#fbbf24" font-size="12" xml:space="preserve">    19: 0000000000000000     0 NOTYPE  GLOBAL DEFAULT  UND puts  &lt;-- [Compiler Optimization!]</text>
  <text x="24" y="162" fill="#cbd5e1" font-size="12" xml:space="preserve">    20: 0000000000000000     8 OBJECT  GLOBAL DEFAULT    8 g_banner</text>
  <text x="24" y="182" fill="#64748b" font-size="12" xml:space="preserve">    21: 0000000000000000     0 NOTYPE  GLOBAL DEFAULT  UND __printf_chk</text>
  <text x="24" y="202" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve">  22: 0000000000000000   256 OBJECT  GLOBAL DEFAULT    3 g_session_token (Section 3: .bss)</text>
  <text x="24" y="222" fill="#34d399" font-size="12" xml:space="preserve">    23: 0000000000000000     4 OBJECT  GLOBAL DEFAULT    2 g_vault_status  (Section 2: .data)</text>
  <text x="24" y="262" fill="#64748b" font-size="12" xml:space="preserve"># Note: Compiler automatically converted printf(&quot;...\n&quot;) with constant string to puts()!</text>
  <text x="24" y="282" fill="#64748b" font-size="12" xml:space="preserve"># Uninitialized g_session_token (256B) placed into .bss; initialized g_vault_status in .data.</text>
