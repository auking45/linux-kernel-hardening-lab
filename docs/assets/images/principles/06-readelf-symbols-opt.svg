<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 348" width="100%" height="348" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="836" height="344" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">AArch64 Symbols &amp; Mapping Symbols ($x, $d, puts optimization)</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ aarch64-linux-gnu-readelf -s vault_core.o</tspan>
  </text>
  <text x="24" y="82" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">Symbol table &#x27;.symtab&#x27; contains 32 entries (AArch64):</text>
  <text x="24" y="102" fill="#64748b" font-size="12" xml:space="preserve">   Num:    Value          Size Type    Bind   Vis      Ndx Name</text>
  <text x="24" y="122" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve">   6: 0000000000000000     0 NOTYPE  LOCAL  DEFAULT    4 $d   &lt;-- [ARM Mapping Symbol: Data]</text>
  <text x="24" y="142" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve">   8: 0000000000000000     0 NOTYPE  LOCAL  DEFAULT    5 $x   &lt;-- [ARM Mapping Symbol: Code]</text>
  <text x="24" y="162" fill="#cbd5e1" font-size="12" xml:space="preserve">    25: 0000000000000000   168 FUNC    GLOBAL DEFAULT    5 main</text>
  <text x="24" y="182" fill="#fbbf24" font-size="12" xml:space="preserve">    26: 0000000000000000     0 NOTYPE  GLOBAL DEFAULT  UND puts  &lt;-- [AArch64 Optimization!]</text>
  <text x="24" y="202" fill="#64748b" font-size="12" xml:space="preserve">    27: 0000000000000000     0 NOTYPE  GLOBAL DEFAULT  UND __printf_chk</text>
  <text x="24" y="222" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve">  29: 0000000000000000   256 OBJECT  GLOBAL DEFAULT    3 g_session_token (Section: .bss)</text>
  <text x="24" y="242" fill="#cbd5e1" font-size="12" xml:space="preserve">    30: 0000000000000000     8 OBJECT  GLOBAL DEFAULT    7 g_banner</text>
  <text x="24" y="262" fill="#34d399" font-size="12" xml:space="preserve">    31: 0000000000000000     4 OBJECT  GLOBAL DEFAULT    2 g_vault_status  (Section: .data)</text>
  <text x="24" y="302" fill="#64748b" font-size="12" xml:space="preserve"># Note: ARM64 compiler uses Mapping Symbols ($x for A64 instructions, $d for literal pools).</text>
  <text x="24" y="322" fill="#64748b" font-size="12" xml:space="preserve"># printf() with constant string is automatically optimized to puts() symbol on AArch64.</text>
</svg>