<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 268" width="100%" height="268" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="836" height="264" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Linker Error: Multiple Definition Conflict (Rule 1 Violation)</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ gcc-13 auth_main.c token_validator.c token_conflict.c -o test_conflict</tspan>
  </text>
  <text x="24" y="82" fill="#f87171" font-size="12" font-weight="bold" xml:space="preserve">/usr/bin/ld: /tmp/ccuiQshk.o: in function &#x27;verify_auth_token&#x27;:</text>
  <text x="24" y="102" fill="#f87171" font-size="12" font-weight="bold" xml:space="preserve">token_conflict.c:(.text+0x0): multiple definition of &#x27;verify_auth_token&#x27;;</text>
  <text x="24" y="122" fill="#f87171" font-size="12" font-weight="bold" xml:space="preserve">/tmp/ccDJYFSi.o:token_validator.c:(.text+0x0): first defined here</text>
  <text x="24" y="142" fill="#f87171" font-size="12" font-weight="bold" xml:space="preserve">collect2: error: ld returned 1 exit status</text>
  <text x="24" y="182" fill="#64748b" font-size="12" xml:space="preserve"># [Root Cause Analysis]</text>
  <text x="24" y="202" fill="#fbbf24" font-size="12" xml:space="preserve">- Symbol: verify_auth_token (Type: FUNC, Bind: GLOBAL, Status: STRONG in both files)</text>
  <text x="24" y="222" fill="#cbd5e1" font-size="12" xml:space="preserve">- Rule 1 of Linker Symbol Resolution: Multiple strong symbols cannot coexist!</text>
  <text x="24" y="242" fill="#64748b" font-size="12" xml:space="preserve">- Fix: Mark one implementation as static (LOCAL) or declare as __attribute__((weak)).</text>
</svg>