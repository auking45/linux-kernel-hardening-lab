  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">AArch64 Static Archive: Member Inspection &amp; Symbol Extraction</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ aarch64-linux-gnu-ar rcs libsecure.a crypto_mac.o token_validator.o</tspan>
  </text>
  <text x="24" y="82" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ aarch64-linux-gnu-ar -t libsecure.a</tspan>
  </text>
  <text x="24" y="102" fill="#cbd5e1" font-size="12" xml:space="preserve">crypto_mac.o</text>
  <text x="24" y="122" fill="#cbd5e1" font-size="12" xml:space="preserve">token_validator.o</text>
  <text x="24" y="162" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ aarch64-linux-gnu-readelf -s libsecure.a</tspan>
  </text>
  <text x="24" y="182" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">File: libsecure.a(crypto_mac.o) [AArch64]</text>
  <text x="24" y="202" fill="#34d399" font-size="12" xml:space="preserve">    10: 0000000000000000    48 FUNC    GLOBAL DEFAULT    1 compute_mac</text>
  <text x="24" y="222" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">File: libsecure.a(token_validator.o) [AArch64]</text>
  <text x="24" y="242" fill="#34d399" font-size="12" xml:space="preserve">    10: 0000000000000000    64 FUNC    GLOBAL DEFAULT    1 validate_security_token</text>
  <text x="24" y="282" fill="#64748b" font-size="12" xml:space="preserve"># AArch64 static archive packages relocatable .o objects with an internal symdef index.</text>
  <text x="24" y="302" fill="#64748b" font-size="12" xml:space="preserve"># Linker selectively extracts only the modules resolving unsatisfied symbols.</text>
