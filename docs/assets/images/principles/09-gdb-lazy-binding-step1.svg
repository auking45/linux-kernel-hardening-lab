  <rect x="2" y="2" width="836" height="344" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">GDB Tracing Lazy Binding [Step 1]: GOT Points to PLT Trampoline</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ gdb -q -nx ./secvault_dyn</tspan>
  </text>
  <text x="24" y="82" fill="#64748b" font-size="12" xml:space="preserve">(gdb) b main &amp;&amp; run</text>
  <text x="24" y="102" fill="#cbd5e1" font-size="12" xml:space="preserve">Breakpoint 1, main () at secvault_dyn.c:16</text>
  <text x="24" y="142" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">=== [Step 1: BEFORE 1st Call to verify_token] ===</text>
  <text x="24" y="162" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ x/gx &amp;verify_token@got.plt</tspan>
  </text>
  <text x="24" y="182" fill="#fbbf24" font-size="12" xml:space="preserve">0x555555558020 &lt;verify_token@got.plt&gt;:    0x0000555555555070</text>
  <text x="24" y="222" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@linux</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ x/2i 0x0000555555555070</tspan>
  </text>
  <text x="24" y="242" fill="#64748b" font-size="12" xml:space="preserve">   0x555555555070:  endbr64</text>
  <text x="24" y="262" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve"> 0x555555555074:  push   $0x4        &lt;-- [Relocation Slot Index in .rela.plt]</text>
  <text x="24" y="282" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve"> 0x555555555079:  jmp    0x555555555020 &lt;-- [.plt header: _dl_runtime_resolve]</text>
  <text x="24" y="322" fill="#64748b" font-size="12" xml:space="preserve"># Crucial Finding: GOT entry points BACK to .plt stub, NOT the shared library function!</text>
