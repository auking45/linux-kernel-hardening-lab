<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 408" width="100%" height="408" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="836" height="404" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="#1e293b" />
  <line x1="2" y1="36" x2="838" y2="36" stroke="#334155" stroke-width="1" />
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />
  <text x="420.0" y="23" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">AArch64 PLT Stub Disassembly &amp; PC-Relative Dispatch (adrp + ldr + br)</text>
  <text x="24" y="62" font-size="12.5" xml:space="preserve">
    <tspan fill="#38bdf8" font-weight="bold">hardening-lab@arm64</tspan>
    <tspan fill="#94a3b8">:</tspan>
    <tspan fill="#a855f7" font-weight="bold">~/principles</tspan>
    <tspan fill="#f1f5f9" font-weight="bold">$ aarch64-linux-gnu-objdump -d -j .plt secvault_dyn</tspan>
  </text>
  <text x="24" y="82" fill="#38bdf8" font-size="12" font-weight="bold" xml:space="preserve">Disassembly of section .plt (AArch64 Procedure Linkage Table):</text>
  <text x="24" y="122" fill="#64748b" font-size="12" xml:space="preserve"># [1] PLT Header (.plt0 Trampoline)</text>
  <text x="24" y="142" fill="#cbd5e1" font-size="12" xml:space="preserve"> 00000000000006e0 &lt;.plt&gt;:</text>
  <text x="24" y="162" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve">  6e0: stp   x16, x30, [sp, #-16]!  &lt;-- [Push GOT slot (x16) &amp; LR (x30)]</text>
  <text x="24" y="182" fill="#cbd5e1" font-size="12" xml:space="preserve">  6e4: adrp  x16, 1f000             &lt;-- [Compute GOT page via PC-relative]</text>
  <text x="24" y="202" fill="#cbd5e1" font-size="12" xml:space="preserve">  6e8: ldr   x17, [x16, #4088]      &lt;-- [Load dynamic resolver address]</text>
  <text x="24" y="222" fill="#cbd5e1" font-size="12" xml:space="preserve">  6ec: add   x16, x16, #0xff8       &lt;-- [Calculate GOT slot address]</text>
  <text x="24" y="242" fill="#c084fc" font-size="12" font-weight="bold" xml:space="preserve">  6f0: br    x17                    &lt;-- [Branch to _dl_runtime_resolve]</text>
  <text x="24" y="282" fill="#64748b" font-size="12" xml:space="preserve"># [2] Individual Function PLT Stub (verify_token@plt)</text>
  <text x="24" y="302" fill="#cbd5e1" font-size="12" xml:space="preserve"> 0000000000000780 &lt;verify_token@plt&gt;:</text>
  <text x="24" y="322" fill="#fbbf24" font-size="12" xml:space="preserve">  780: adrp  x16, 20000             &lt;-- [PC-relative base of GOT entry]</text>
  <text x="24" y="342" fill="#fbbf24" font-size="12" xml:space="preserve">  784: ldr   x17, [x16, #64]        &lt;-- [Load target address from GOT]</text>
  <text x="24" y="362" fill="#cbd5e1" font-size="12" xml:space="preserve">  788: add   x16, x16, #0x40        &lt;-- [Slot pointer in x16]</text>
  <text x="24" y="382" fill="#34d399" font-size="12" xml:space="preserve">  78c: br    x17                    &lt;-- [Indirect branch to function]</text>
</svg>