name: Kernel CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-kernel:
    name: "Verify Kernel & Toolchain (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Kernel Source Tarball
        uses: actions/cache@v4
        with:
          path: downloads/*.tar.xz
          key: kernel-tarball-${{ hashFiles('scripts/env.sh') }}
          restore-keys: |
            kernel-tarball-

      - name: Cache Rootfs Archive (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: rootfs/initramfs-${{ matrix.arch }}.cpio.gz
          key: rootfs-${{ matrix.arch }}-${{ hashFiles('scripts/env.sh', 'scripts/build_rootfs.sh', 'labs/**/exploit.c', 'labs/**/test.sh') }}

      - name: Cache Base Kernel Build (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: build_dir/${{ matrix.arch }}-base
          key: kernel-bin-${{ matrix.arch }}-base-${{ hashFiles('scripts/env.sh', 'configs/base.config', 'configs/arch/*.config', 'scripts/build_kernel.sh') }}
          restore-keys: |
            kernel-bin-${{ matrix.arch }}-base-

      - name: Pull or Build Docker Lab Image
        run: |
          echo "Pulling cache image from GHCR (if available)..."
          docker compose pull lab || true
          echo "Building lab image to ensure local Dockerfile changes are applied..."
          docker compose build lab

      - name: Verify Shell Script Syntax
        run: |
          docker compose run --rm lab bash -n scripts/*.sh

      - name: Verify Rootfs Generation (${{ matrix.arch }})
        run: |
          docker compose run --rm lab ./scripts/build_rootfs.sh --arch ${{ matrix.arch }}

      - name: Verify Kernel Source & Base Build (${{ matrix.arch }})
        run: |
          docker compose run --rm lab ./scripts/run_lab.sh --arch ${{ matrix.arch }} --feature base --build-only

      - name: Verify QEMU Boot Test (${{ matrix.arch }} TCG Emulation)
        run: |
          docker compose run --rm lab ./scripts/run_qemu.sh --arch ${{ matrix.arch }} --no-kvm --test test_smoke --timeout 25

      - name: Ensure Cache Read Permissions
        if: always()
        run: |
          docker compose run --rm lab chmod -R a+rX downloads rootfs build_dir 2>/dev/null || true

  verify-features:
    name: "Verify Feature: ${{ matrix.feature }} (${{ matrix.arch }})"
    runs-on: ubuntu-latest
    needs: verify-kernel
    strategy:
      fail-fast: false
      matrix:
        include:
          # Task 3-1: Stack Protector Strong (Dual-Arch)
          - arch: x86_64
            feature: stack-protector
            test: test_stack_protector
          - arch: arm64
            feature: stack-protector
            test: test_stack_protector

          # Task 3-2: FORTIFY_SOURCE (Dual-Arch)
          - arch: x86_64
            feature: fortify-source
            test: test_fortify_source
          - arch: arm64
            feature: fortify-source
            test: test_fortify_source

          # Task 3-3: Shadow Call Stack (ARM64)
          - arch: arm64
            feature: shadow-call-stack
            test: test_shadow_call_stack

          # Task 3-4: STACKLEAK (Dual-Arch)
          - arch: x86_64
            feature: stackleak
            test: test_stackleak
          - arch: arm64
            feature: stackleak
            test: test_stackleak

          # Task 4-1: KASLR (Dual-Arch)
          - arch: x86_64
            feature: kaslr
            test: test_kaslr
          - arch: arm64
            feature: kaslr
            test: test_kaslr

          # Task 4-2: FG-KASLR (Dual-Arch)
          - arch: x86_64
            feature: fgkaslr
            test: test_fgkaslr
          - arch: arm64
            feature: fgkaslr
            test: test_fgkaslr

          # Task 4-3: Randomize Memory (Dual-Arch)
          - arch: x86_64
            feature: randomize-memory
            test: test_randomize_memory
          - arch: arm64
            feature: randomize-memory
            test: test_randomize_memory

          # Task 5-1: Strict Kernel RWX (Dual-Arch)
          - arch: x86_64
            feature: strict-rwx
            test: test_strict_rwx
          - arch: arm64
            feature: strict-rwx
            test: test_strict_rwx


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Kernel Source Tarball
        uses: actions/cache@v4
        with:
          path: downloads/*.tar.xz
          key: kernel-tarball-${{ hashFiles('scripts/env.sh') }}
          restore-keys: |
            kernel-tarball-

      - name: Cache Rootfs Archive (${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: rootfs/initramfs-${{ matrix.arch }}.cpio.gz
          key: rootfs-${{ matrix.arch }}-${{ hashFiles('scripts/env.sh', 'scripts/build_rootfs.sh', 'labs/**/exploit.c', 'labs/**/test.sh') }}

      - name: Cache Feature Kernel Build (${{ matrix.feature }} on ${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: build_dir/${{ matrix.arch }}-${{ matrix.feature }}
          key: kernel-bin-${{ matrix.arch }}-${{ matrix.feature }}-${{ hashFiles('scripts/env.sh', 'configs/**', 'labs/**/vuln_*.c', 'scripts/build_kernel.sh') }}
          restore-keys: |
            kernel-bin-${{ matrix.arch }}-${{ matrix.feature }}-

      - name: Pull or Build Docker Lab Image
        run: |
          echo "Pulling cache image from GHCR (if available)..."
          docker compose pull lab || true
          echo "Building lab image to ensure local Dockerfile changes are applied..."
          docker compose build lab

      - name: Run Hardening Lab Test (${{ matrix.feature }} on ${{ matrix.arch }})
        run: |
          docker compose run --rm lab ./scripts/run_lab.sh --arch ${{ matrix.arch }} --feature ${{ matrix.feature }} --test ${{ matrix.test }} --no-kvm --timeout 60

      - name: Ensure Cache Read Permissions
        if: always()
        run: |
          docker compose run --rm lab chmod -R a+rX downloads rootfs build_dir 2>/dev/null || true
