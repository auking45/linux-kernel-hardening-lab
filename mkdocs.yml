site_url: https://auking45.github.io/linux-kernel-hardening-lab/
site_name: Linux Kernel Hardening Lab
site_description: Linux Kernel Hardening Engineering & Interactive Verification Lab (x86_64 & arm64)
site_author: auking45
repo_url: https://github.com/auking45/linux-kernel-hardening-lab
repo_name: auking45/linux-kernel-hardening-lab

theme:
  name: material
  language: ko
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          name: 한국어
          build: true
          default: true
        - locale: en
          name: English
          build: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Dual-Arch Environment: getting-started/dual-arch.md
  - Architecture:
      - Memory & Protection Models: architecture/index.md
  - Features:
      - Taxonomy Roadmap: features/index.md
      - 01. Stack & Buffer Protection:
          - Stack Canary: features/01-stack-protector.md
