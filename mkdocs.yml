site_url: https://auking45.github.io/linux-kernel-hardening-lab/
site_name: Linux Kernel Hardening Lab
site_description: Linux Kernel Hardening Engineering & Interactive Verification Lab (x86_64 & arm64)
site_author: auking45
repo_url: https://github.com/auking45/linux-kernel-hardening-lab
repo_name: auking45/linux-kernel-hardening-lab

theme:
  name: material
  language: ko
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          name: 한국어
          build: true
          default: true
        - locale: en
          name: English
          build: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Dual-Arch Environment: getting-started/dual-arch.md
  - Architecture:
      - Memory & Protection Models: architecture/index.md
  - Attack Scenarios:
      - Roadmap & Overview: scenarios/index.md
      - 01. Humanoid BOF & Stack Canary: scenarios/01-humanoid-bof.md
      - 02. ret2usr & SMEP/PXN Defense: scenarios/02-ret2usr.md
  - Features:
      - Taxonomy Roadmap: features/index.md
      - 01. Stack & Buffer Protection:
          - Stack Canary: features/01-stack-protector.md
          - Fortify Source: features/02-fortify-source.md
          - Shadow Call Stack: features/03-shadow-call-stack.md
          - STACKLEAK: features/04-stackleak.md
      - 02. Memory Layout & Randomization:
          - KASLR: features/05-kaslr.md
          - FG-KASLR: features/06-fgkaslr.md
          - Randomize Memory: features/07-randomize-memory.md
      - 03. Memory Permissions & Access Separation:
          - Strict Kernel RWX (W^X): features/08-strict-rwx.md
          - SMEP & PXN (ret2usr Defense): features/09-smep-pxn.md
          - SMAP & PAN (User Data Access Prevention): features/10-smap-pan.md
          - Page Table Check (Invalid Mapping Detection): features/11-page-table-check.md
          - KPTI (Kernel Page Table Isolation): features/12-kpti.md
      - 04. Control Flow Integrity (CFI):
          - Clang kCFI: features/13-kcfi.md
          - x86 IBT & Shadow Stack: features/14-ibt-shstk.md
          - ARM64 BTI & PAC: features/15-bti-pac.md
      - 05. Heap & Slab Allocator Hardening:
          - SLAB Freelist Hardening: features/16-slab-freelist.md
          - Heap Zeroing (Alloc & Free): features/17-heap-init.md
          - Hardened Usercopy: features/18-hardened-usercopy.md
          - KFENCE (Memory Safety Detector): features/19-kfence.md
      - 06. Structure & Compiler Level Protections:
          - Structleak (Stack Auto-Initialization): features/20-structleak.md
          - Randstruct (Structure Layout Randomization): features/21-randstruct.md
      - 07. Speculative Execution Defenses:
          - Spectre v1 (array_index_nospec): features/22-spectre-v1.md
          - Spectre v2 (Retpoline, IBPB, STIBP): features/23-spectre-v2.md
          - Speculative Store Bypass Disable (SSBD): features/24-ssbd.md
          - MDS & TAA Mitigation (VERW): features/25-mds.md
      - 08. Mandatory Access Control & LSM Framework:
          - Stackable LSM Architecture: features/26-lsm-stacking.md
          - AppArmor Process Isolation: features/27-apparmor.md
          - SELinux Type Enforcement: features/28-selinux.md
          - Landlock Unprivileged Sandboxing: features/29-landlock.md
      - 09. System & Binary Integrity Verification:
          - IMA Integrity Measurement: features/30-ima.md
          - EVM Metadata Protection: features/31-evm.md
          - IPE Policy Enforcement: features/32-ipe.md
          - Kernel Lockdown LSM: features/33-lockdown.md
          - Module Signature Verification: features/34-module-sig.md
      - 10. Attack Surface Reduction & System Hardening:
          - Seccomp-BPF Syscall Filtering: features/35-seccomp.md
          - BPF Hardening & JIT Blinding: features/36-bpf-hardening.md
          - Strict Devmem & Strict I/O: features/37-strict-devmem.md
          - Kernel Info Leaks & Dmesg Restrict: features/38-info-leaks.md
          - Yama LSM Ptrace Scope: features/39-yama-ptrace.md
          - Kexec Restrictions: features/40-kexec-restrict.md
      - 11. Modern ARMv8/ARMv9 & Mobile Security:
          - ARM64 Memory Tagging (MTE): features/41-arm64-mte.md
          - ARMv9 Permission Overlay (POE): features/42-armv9-poe.md
          - Android Virtualization (AVF/pKVM): features/43-avf-pkvm.md
          - Arm Confidential Compute (CCA): features/44-arm-cca.md




